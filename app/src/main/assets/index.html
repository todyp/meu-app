H|Título IX · Das regras de ausência e licenças
A|Art. 90.|O tempo que cada militar pode ficar ausente varia conforme o seu cargo, posto ou graduação:
I|I -|Soldado a Subtenente: No máximo vinte (20) dias de afastamento. Se ultrapassado, o policial será demitido;
I|II -|Aspirante acima: No máximo sete (07) dias de afastamento. Se ultrapassado, receberá uma advertência (além das sanções disciplinares administrativas pelas divisões e diretorias e/ou pelo grupo hierárquico). Após vinte (20) dias sem se manifestar, a demissão torna-se incontornável.
P|Parágrafo único.|Compete à liderança dos Supervisores a aplicação de punições por ausência.
H|Título IX · Cap. I · Da declaração de licença
A|Art. 91.|Entende-se por licença o período no qual o policial se afasta temporariamente de suas atividades operacionais e/ou administrativas, sem prejuízo de sua vinculação à corporação.
A|Art. 92.|A licença terá duração mínima de (07) dias e máxima de quinze (15) dias, podendo ser prorrogada por mais sete (07) dias, mediante autorização do Comando.
P|Parágrafo único.|Só será aceita a prorrogação de quinte (15) dias apenas em casos extraordinários, mediante autorização do Comando.
A|Art. 93.|A solicitação de licença deverá ser realizada por meio do System, com antecedência mínima de dois (02) dias.
P|Parágrafo único.|Poderão solicitar a declaração de licença os policiais que possuírem, no mínimo, a graduação/cargo de Subtenente/Analista com o curso de Conceitos de Estrutura e Disciplina [CED].
A|Art. 94.|Compete ao Comando aprovar, reprovar e gerir as solicitações de licença, bem como supervisionar aquelas que estiverem em andamento.
A|Art. 95.|Após o término da licença, o policial deverá aguardar o intervalo mínimo de trinta (30) dias para requisitar nova declaração.
A|Art. 96.|Os policiais que participam do sistema de VIPs terão redução no período de carência para solicitação de nova licença, conforme disposto a seguir:
I|I –|VIP Prata: vinte e cinco (25) dias;
I|II –|VIP Ouro: vinte (20) dias;
I|III –|VIP Diamante: quinze (15) dias.
A|Art. 97.|Durante o período de licença:
I|I –|O policial poderá acessar o Habbo e contribuir com as atividades da corporação, sem obrigatoriedade de cumprimento de metas;
I|II –|O tempo mínimo para promoções ficará suspenso, não sendo contabilizado durante o afastamento;
I|III –|O tempo de serviço dos policiais em período de observação permanecerá congelado até o seu retorno.
A|Art. 98.|Após o retorno da licença, o policial deverá permanecer, no mínimo, sete (07) dias em atividade para que possa ser promovido.
H|Título X · Do system
A|Art. 99.|Compreende-se como system o site oficial da Polícia. Se faz obrigatório, aos Cargos Executivos e policiais da Hierarquia Militar a partir de Cabo, a criação de sua conta nesta plataforma.
A|Art. 100.|São impostas as seguintes restrições quanto à utilização do system:
I|I -|A criação de tópicos nas páginas das divisões e diretorias por parte dos Membros;
I|II -|O uso indevido dos tópicos criados pelas divisões e diretorias;
I|III -|Divulgar suas credenciais de acesso a terceiros. Isto inclui os integrantes da Presidência. NINGUÉM, independente da situação, deve ter acesso às suas senhas;
I|IV. -|Utilizar-se de qualquer método que vise camuflar o seu IP e/ou a sua identidade, como as Virtual Private Networks (VPNs).
P|Parágrafo único.|Subentende-se como utilização indevida a postagem de comentários que não condizem com a proposta imposta pelo tópico, o envio de mensagens ofensivas ou a realização de flood.
A|Art. 101.|É terminantemente proibido que um militar possua mais de uma conta dentro do departamento.
H|Título XI · Das honrarias militares
A|Art. 102.|As Honrarias Militares englobam características e conquistas especiais daqueles que lutaram em nome do Departamento de Investigação Criminal. Embora o nome faça referência somente à hierarquia comum, Cargos Executivos que estejam inseridos em um dos contextos abaixo também poderão ser agraciados com tais recompensas.
P|Parágrafo único.|Os agraciados perderão a Medalha nos seguintes casos:
I|I -|Se o policial for reincidente em transgressões disciplinares de natureza grave ou gravíssima;
I|II -|Se o policial for considerado culpado ou condenado, em processo judicial ou administrativo, por condutas que configurem transgressões disciplinares ou que violem os princípios básicos de convivência e disciplina no âmbito da Polícia DIC;
I|III -|Quando o policial for demitido da Polícia DIC em decorrência de transgressão disciplinar, não acarretando a perda da medalha as hipóteses de demissão por ausência ou dispensa;
I|IV -|Quando o policial for banido da Polícia DIC;
I|V -|Quando se envolver em atividades que causem descrédito à Polícia DIC, como disseminação de boatos, ataques verbais, entre outros;
I|VI -|Se o policial cometer atos que afetem a ordem e a disciplina na Polícia DIC, como incitar ódio, promover ataques ou conspirar contra outros policiais;
I|VII -|Se o policial entrar em outras organizações;
I|VIII -|Se o ex-policial alterar seu nome de usuário no Habbo Hotel sem comunicar o Comando da Polícia DIC.
H|Título XII · Dos sistemas de aposentadoria e reforma
A|Art. 103.|Os policiais aposentados ou reformados, ao alterarem seu nickname, deverão comunicar imediatamente ao Comando para atualização dos registros no System.
P|Parágrafo único.|O descumprimento desta disposição poderá acarretar a perda das prerrogativas correspondentes.
A|Art. 104.|Os policiais aposentados ou reformados ficam impedidos de assumir a Central de Ajuda. Quando presentes e ativos no batalhão, deverão assumir as funções de seus superiores nos setores, conforme o grau hierárquico correspondente ao posto ou cargo anteriormente ocupado.
P|Parágrafo único.|Os policiais aposentados ou reformados que estiverem com status “desativado” no System deverão trabalhar exclusivamente na recepção.
H|Título XII · Cap. I · Do sistema de aposentadoria
A|Art. 105.|A aposentadoria constitui benefício concedido aos militares que possuam, no mínimo, 6 meses de serviço no cargo de Comandante ou em posição hierárquica superior.
A|Art. 106.|Recomenda-se que a solicitação de aposentadoria seja encaminhada à Presidência com antecedência mínima de 30 dias, para fins de transição administrativa.
P|§ 1º|A aprovação do pedido ficará condicionada à análise da Presidência, considerando o histórico funcional do policial e a situação institucional do Departamento;
P|§ 2º|A Presidência poderá, a seu critério, convidar o militar à aposentadoria, hipótese em que o requisito de tempo de serviço, previsto no Art. 108., poderá ser dispensado.
A|Art. 107.|Constituem benefícios dos policiais aposentados:
I|I -|Receber o comando Sentido ao ingressar na base, quando detiverem o mais alto nível hierárquico entre os presentes;
I|II -|Ser tratados pelos pronomes de tratamento por todos os militares que não integrem a Presidência.
A|Art. 108.|O policial aposentado que ingressar no quartel deverá observar as seguintes normas:
I|I -|O uso do visual é livre, devendo respeitar o Regulamento dos Uniformes, a formalidade e o bom senso;
I|II -|A missão deverá seguir o padrão: [DIC] Aposentado <Último Cargo>;
I|III -|O emblema de aposentado deverá ser selecionado como grupo favorito.
I|IV -|Deverá manter o decoro profissional, cumprindo integralmente todas as normas internas da DIC, desde as regras de conduta em comunicação até as disposições previstas na Legislação e no Regulamento Disciplinar.
A|Art. 109.|O retorno de policiais aposentados ao serviço ativo somente ocorrerá mediante convite formal e expresso da Presidência.
P|§ 1º|O retorno poderá ocorrer em cargo distinto daquele anteriormente ocupado, a critério da Presidência;
P|§ 2º|O cargo atribuído no retorno não poderá ser superior ao anteriormente exercido;
P|§ 3º|O policial que retornar à ativa e desejar nova aposentadoria deverá permanecer em serviço por, no mínimo, 6 meses;
P|§ 4º|O policial que for identificado integrando outra organização militar perderá imediatamente o benefício.
H|Título XII · Cap. II · Do sistema de reforma
A|Art. 110.|A reforma de oficiais será concedida mediante análise dos serviços prestados ao Departamento. A solicitação deverá ser encaminhada ao Comando, que deliberará após avaliação das motivações e do histórico funcional do requerente.
P|§ 1º|A concessão da reforma dependerá do cumprimento dos seguintes requisitos:
I|I -|Possuir Honraria Militar ou integrar o Corpo de Superiores;
I|II -|Não possuir registros de transgressões disciplinares graves nos últimos 3 meses;
I|III -|Contar com, no mínimo, 6 meses de efetivo serviço, sem pedidos de dispensa ou readmissão.
P|§ 2º|Integrantes do Grupo de Operações Especiais poderão obter o benefício independentemente dos requisitos do § 1º, desde que possua posto igual ou superior a Major e apresente a solicitação ao seu Comandante;
P|§ 3º|O Chanceler com Curso de Formação de Superiores concluído poderá requerer o benefício diretamente à Presidência, independentemente dos requisitos do § 1º.
P|§ 4º|O policial terá o prazo de 24 horas para desistir do pedido de reforma, sem sujeição a qualquer tipo de punição, mantendo suas funções nas divisões e diretorias das quais fazia parte.
P|§ 5º|Caso a desistência ocorra entre 24 e 72 horas, o retorno será permitido mediante aplicação de advertência, ficando seus cargos nas divisões e diretorias sujeitos à avaliação pelo Líder vigente. Caso seja Líder ou Vice-Líder da divisão, ficará a cargo do Comando-Geral decidir.
P|§ 6º|Decorrido o prazo de 72 horas, o policial deverá cumprir integralmente o período de reforma, permanecendo afastado da Polícia por, no mínimo, 3 meses, a menos que seja convidado a retornar pelo Comando ou Presidência.
P|§ 7º|Concedida a reforma, o oficial deverá retirar-se de todos os chats e grupos oficiais, sob pena de cancelamento da reforma e aplicação de sanções disciplinares.
A||(Os Arts. 111 a 113 não constam nos prints enviados.)
H|Título XIII · Das políticas de readmissão
A|Art. 114.|Considera-se readmissão o mecanismo de reingresso ao Departamento, concedido aos militares que demonstrem arrependimento quanto à decisão de solicitar dispensa.
P|Parágrafo único.|Não serão admitidas readmissões nos casos em que o solicitante tenha sido demitido e/ou banido, devendo, nessa hipótese, reiniciar sua trajetória do zero ou ingressar por meio da aquisição de Cargo Executivo.
A|Art. 115.|A readmissão constitui direito assegurado, no mínimo, a militares ocupantes do posto de Tenente ou de Cargo Executivo com treinamento equivalente. O pedido deverá ser realizado no prazo máximo de 06 meses após a publicação da dispensa, mediante solicitação encaminhada ao Comando e/ou à Presidência. O solicitante ficará sujeito às seguintes disposições:
I|I -|O policial que solicitar readmissão em até 24 horas após a dispensa retornará ao mesmo cargo anteriormente ocupado, mantendo suas funções nas divisões e diretorias das quais fazia parte;
I|II -|O policial que solicitar readmissão entre 24 e 48 horas após a dispensa retornará ao mesmo cargo anteriormente ocupado, receberá 1 (uma) advertência, terá zerada a contagem de dias no cargo e manterá suas funções nas divisões e diretorias das quais fazia parte;
I|III -|O policial que solicitar readmissão entre 48 e 72 horas após a dispensa retornará com 1 (um) rebaixamento, ficando seus cargos nas divisões e diretorias sujeitos à reavaliação pelo Líder vigente;
I|IV -|O policial que solicitar readmissão após 72 horas não terá direito ao retorno ao cargo anteriormente ocupado na Hierarquia Militar. A solicitação será submetida à análise do Comando, que deliberará sobre a aceitação do retorno e, em caso de aprovação, definirá o Cargo Executivo a ser ocupado pelo solicitante.
P|§ 1º|Caso o policial dispensado ocupasse o cargo de Líder e/ou Vice-Líder de divisão ou diretoria, as disposições dos incisos I e II não se aplicam, ficando o militar sujeito à reavaliação do Comando-Geral quanto ao cargo a ser assumido na respectiva divisão ou diretoria.
P|§ 2º|Caso o policial dispensado possuísse direitos, estes serão submetidos à reavaliação do Comando, que deliberará sobre sua eventual restituição.
P|§ 3º|Caso o policial dispensado integrasse o Comando, o Comando-Geral ou a Presidência e solicite readmissão no período entre 48 e 72 horas, a Presidência realizará reavaliação específica para deliberar sobre a aplicação de um ou mais rebaixamentos.
P|§ 4º|O policial que for identificado integrando outra organização militar dentro do prazo previsto até o inciso III e optar por retornar, enquadrar-se-á automaticamente nas disposições do inciso IV.
P|§ 5º|O solicitante enquadrado no inciso IV não poderá receber Cargo Executivo equivalente ou superior ao anteriormente ocupado. A restituição de treinamentos ficará a critério exclusivo da Presidência.
P|§ 6º|O solicitante terá o prazo máximo de 06 meses, contados da data de sua saída, para requerer readmissão. Após esse período, caso deseje retornar, deverá fazê-lo por meio de alistamento ou mediante aquisição de Cargo Executivo.
A|Art. 116.|O direito à readmissão poderá ser exercido apenas uma única vez por passagem do militar. Após a primeira readmissão, quaisquer solicitações subsequentes durante a mesma carreira serão indeferidas.
H|Título XIV · Do Conselho Superior de Justiça
A|Art. 117.|O Conselho Superior de Justiça (CSJ) é o órgão jurisdicional de último grau de recurso, responsável por revisar as punições aplicadas pelo Tribunal de Justiça Policial e a fazer cumprir seu Regimento Interno.
A|Art. 118.|Fazem parte do Conselho Superior de Justiça:
I|I -|Todos os membros da Presidência;
I|II -|O Presidente do TJP;
I|III -|Demais policiais convidados.
A|Art. 119.|Compete ao CSJ o julgamento do Presidente do Tribunal de Justiça Policial, dos Ministros que o compõem, dos Comandantes-Gerais da Polícia DIC e dos membros da Chancelaria, em suas infrações penais e administrativas.
H|Título XV · Da Secretaria de Ensino
A|Art. 120.|A Secretaria de Ensino (SEC) é o órgão de supervisão do ensino, responsável por fiscalizar, revisar e manter atualizados os treinamentos e cursos do Departamento.
A|Art. 121.|Fazem parte da Secretaria de Ensino:
I|I -|Todos os membros da Presidência;
I|II -|O Comandante da Academia Policial;
I|III -|O Líder dos Guias;
I|IV -|O Diretor da Academia Militar de Formação e Elitização;
I|V -|Demais policiais convidados.
H|Título XVI · Cap. I · Da transferência de conta
A|Art. 122.|As transferências de contas são realizadas gratuitamente para, no mínimo, Subtenentes e Cargos Executivos com os treinamentos equivalentes que tenham perdido a conta por hacking, perguntas de segurança ou banimento do Habbo. Nesse caso, é necessário que o nick do novo avatar seja extremamente semelhante ao nome da conta anterior, com a adição de algum pequeno elemento.
P|Parágrafo único.|Uma única vez na carreira, o policial pode solicitar a alteração de conta para uma de nick semelhante sem motivo que justifique.
A|Art. 123.|É permitida a transferência de conta para nicks completamente diferentes para, no mínimo, Oficiais ou Cargos Executivos com treinamento equivalente em apenas duas oportunidades durante a sua passagem.
P|Parágrafo único.|As transferências serão autorizadas mediante pagamento de taxa de cinquenta (50) câmbios na primeira troca e cento e cinquenta (150) na segunda (e última) troca.
A|Art. 124.|Se faz terminantemente proibida a utilização do nick “ser” e suas variantes a partir do posto de Tenente para a Hierarquia Militar e de forma integral para os Cargos Executivos.
P|§ 1º|Membros da Hierarquia Militar poderão adequar seus nicknames gratuitamente a partir da graduação de Cabo e, têm como prazo para essa adequação, o 15º dia após sua promoção ao posto de Tenente.
P|§ 2º|Não serão aceitos na Hierarquia Executiva usuários com o nick ser, sendo vetada sua contratação ou compra de cargo caso a adequação não seja realizada de imediato.
A|Art. 125.|Os requerimentos de transferência de conta devem ser encaminhados para o Comando.
H|Título XVI · Cap. II · Da alteração de gênero
A|Art. 126.|A troca de gênero é permitida apenas àqueles que, no decorrer de sua vida pessoal, compreendem que se identificam com um gênero diferente do que lhe atribuíram e consideram que o gênero de seu avatar no jogo impacta diretamente nesse momento de sua vida.
P|§ 1º|Para requerer a troca de gênero, é necessário enviar uma solicitação formal a um Comandante.
P|§ 2º|O pedido será aceito apenas uma vez na passagem atual do militar.
P|§ 3º|É direito do policial que desconhece essa regra e alistou-se com o gênero incorreto alterar o gênero de seu avatar até a graduação de Aspirante, mediante o processo de solicitação.
H|Título XVII · Do sistema de VIPs
A|Art. 127.|O sistema de VIPs é um programa de benefícios exclusivos destinados aos policiais que contribuem de maneira especial para a Polícia. Este programa visa proporcionar vantagens adicionais que melhoram a experiência do militar no cotidiano da Polícia DIC.
A|Art. 128.|A aquisição e a manutenção dos níveis de VIP são regulamentadas pela Assessoria Presidencial, que define os critérios de elegibilidade, valores de contribuição e duração dos benefícios. Para obter informações detalhadas sobre os diferentes níveis de VIP, os benefícios específicos de cada nível, os critérios para obtenção e as regras de utilização, consulte o documento oficial.
H|Título XVIII · Cap. I · Dos decretos
A||(O cabeçalho do Título XVIII e os Arts. 129 a 133 não constam nos prints enviados.)
A|Art. 134.|O decreto é um ato administrativo que produz efeitos externa corporis, ou seja, alcança a todos os policiais do Departamento, independentemente do grupo hierárquico ou da autoridade que tenha sido responsável por sua edição e publicação, tendo como parâmetro as competências dos grupos hierárquicos.
A|Art. 135.|O vigor do decreto se inicia quinze (15) dias depois de oficialmente publicado no grupo “Família DIC Habbo”, ou em outro canal oficial que porventura venha a ser criado, salvo disposição em contrário.
A|Art. 136.|Com exceção do que possui vigência temporária, como o que autoriza mudanças no fardamento/uniforme em datas festivas, o decreto terá vigor até que outro o modifique ou revogue.
P|§ 1º|O decreto superveniente pode revogar o anterior de maneira expressa ou tácita, quando com ele verificar-se uma incompatibilidade de conteúdo, sendo silente em relação ao que pretende revogar, ou que regule inteiramente a matéria de que tratava o decreto anterior.
P|§ 2º|Não há revogação, nem modificação, no novo decreto que estabeleça condições gerais ou especiais sobre as já existentes.
P|§ 3º|Um decreto revogado não se restaura por ter o decreto revogador perdido a vigência, salvo disposição em contrário.
H|Título XVIII · Cap. II · Das portarias
A|Art. 137.|A portaria é um ato administrativo que produz efeitos interna corporis, ou seja, alcança apenas os policiais que integram uma divisão, subdivisão, diretoria ou um grupo hierárquico.
P|Parágrafo único.|As competências de cada policial constarão no Regimento Interno, o qual garantirá a autonomia funcional dos seus membros.
A|Art. 138.|Nos casos que envolvam promoção interna dos integrantes das divisões, diretorias e/ou subdivisões, a edição e publicação da portaria no grupo “Família DIC Habbo” é obrigatória.
P|Parágrafo único.|Nas demais decisões administrativas, a legalidade do ato está vinculada à difusão do seu conteúdo nos chats internos, devendo a liderança garantir tempo razoável de acesso dos integrantes ao teor da portaria.
A|Art. 139.|Ressalvada a autonomia que dispõe o líder para gerir a divisão/diretoria, nos termos do artigo 43 desta Legislação, é vedado aproveitar-se do acesso a materiais/scripts de formação curricular obrigatória para inovar e/ou alterar qualquer norma constante nos documentos oficiais, bem como regras de conduta militar, sem o aval do Comando-Geral, de modo a criar efeitos jurídicos externa corporis.
P|§ 1º|A proibição não contempla mudanças que otimizem o tempo do treinamento, nem que reorganizem e aprimorem as informações já verificadas no momento da alteração.
P|§ 2º|O Líder, em conjunto com sua equipe de liderança, pode criar novos treinamentos sem a autorização da Presidência, desde que não sejam obrigatórios e respeitem o disposto no caput, com o objetivo de melhorar a capacitação e qualidade dos policiais.
H|Título XVIII · Cap. III · Das competências dos grupos hierárquicos
A|Art. 140.|Compete privativamente à Presidência:
I|I -|Criar e extinguir as divisões e diretorias, inclusive grupos auxiliares e suas variações, bem como suspender e reorganizar suas atividades;
P|Parágrafo único.|Na impossibilidade de um policial da Presidência tratar dessas competências, excepcionalmente, fica autorizado ao Comando-Geral, por delegação, redigir o decreto.
I|II -|Criar, extinguir, reorganizar e congelar os cursos de formação curricular das hierarquias militar e executiva;
P|Parágrafo único.|Na hipótese de congelamento e/ou suspensão de qualquer curso de formação curricular obrigatório, o decreto disporá sobre a situação dos policiais que se encontram à espera do treinamento, podendo isentá-los da realização deste, ou seja, liberá-los da obrigatoriedade do requisito constante nos documentos oficiais para que sejam promovidos.
I|III -|Modificar as regras relativas aos uniformes, vide Regulamento dos Uniformes, determinando vedações, restrições e/ou permissões;
I|IV -|Alterar os preços de venda dos Cargos Executivos, bem como conceder promoções individuais e/ou coletivas;
I|V -|Modificar as regras relativas à remuneração dos policiais;
I|VI -|Nomear e exonerar os Ministros do Conselho Superior de Justiça;
I|VII -|Legislar sobre matéria do Regulamento Disciplinar;
P|Parágrafo único.|O Tribunal de Justiça Policial, nos termos do seu Regimento Interno, poderá tratar de matéria disciplinar.
I|VIII -|Dispor sobre organizações aliadas ao Departamento de Investigação Criminal, inclusive romper com as alianças existentes;
I|IX -|Avaliar o Comandante-Suplente no período de estágio, podendo efetivá-lo ou não na Presidência;
I|X -|Alterar, a qualquer tempo, as competências e prerrogativas dos grupos hierárquicos;
I|XI -|Legislar sobre matéria do Modus Operandi;
I|XII -|Todas as atribuições previstas nos Arts. 142 e 143.
A|Art. 141.|É da competência concorrente do Comando-Geral e da Presidência:
I|I -|Nomear e exonerar os líderes das divisões e diretorias;
P|Parágrafo único.|A exoneração dar-se-á, automaticamente, na hipótese de condenação definitiva por crimes conexos à gestão interna da divisão, quando estes forem de natureza grave ou gravíssima, nos termos do Regulamento Disciplinar.
I|II -|Afastar do exercício da função os líderes das divisões e diretorias, bem como reconduzi-los;
P|§ 1º|O afastamento ocorrerá quando houver fundada suspeita sobre atos ilícitos cometidos durante a gestão da divisão ou diretoria e alguma investigação em andamento, com o objetivo de impedir interferências no curso desta, mediante requerimento feito pelo órgão investigador à Presidência, que, aquiescendo, o ratificará ou, discordando, o declinará;
P|§ 2º|O afastamento terá um prazo máximo de 15 (quinze) dias iniciais, prorrogável, mediante justificativa plausível, por igual período;
P|§ 3º|Caso o requerimento aludido no § 1º seja aprovado, no mesmo decreto de afastamento constará o nome do policial que ficará responsável, interinamente, pela liderança da divisão ou diretoria, caso a função equivalente de Vice-Líder esteja vago;
P|§ 4º|A recondução ao exercício da função ocorrerá quando, ao término das investigações oficiais, ficar comprovada a inocência do policial ora afastado;
P|§ 5º|Se a investigação não for concluída no prazo máximo determinado no § 2º, o policial afastado será reconduzido às suas funções internas, sem prejuízo ao prosseguimento das investigações.
I|III -|Avaliar e conceder a honraria paga “Medalha de Ouro” aos Cargos Executivos, bem como revogá-la;
