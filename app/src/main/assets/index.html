P|§ 1°|Ausentar-se das tarefas da polícia por um intervalo de tempo acima do autorizado requer a declaração de aval ou licença. Sem a declaração, os Executivos estão sujeitos às sanções disciplinares administrativas.
P|§ 2°|Todas as sanções disciplinares que competem a esse artigo, poderão ser aplicadas pelos Supervisores.`;
const D3=`H|Título I · Das disposições iniciais
A|Art. 1°|As disposições do Modus Operandi aplicam-se exclusivamente aos Chanceleres do Departamento de Investigação Criminal (DIC) e regulam suas ações. Qualquer usuário do Habbo que juntar-se à Chancelaria deverá cumprir com os presentes termos.
P|§ 1º|A Legislação e o Regulamento Disciplinar (RD) aplicam-se a todos os policiais, sendo considerados documentos soberanos, prevalecendo sobre quaisquer outras normas internas;
A|Art. 2º|O Sistema da Chancelaria da Polícia DIC estabelece as normas para a concessão de estágios, bem como define as prerrogativas e benefícios atribuídos aos Chanceleres, visando assegurar seu papel no desenvolvimento e progresso da Polícia DIC.
H|Título II · Da Chancelaria
A|Art. 3º|O Chanceler possui equivalência a Supremo, no entanto não possui as prerrogativas da Presidência da Polícia DIC.
A|Art. 4º|O Chanceler deverá manter conduta exemplar, observando padrões de ortografia, respeito e desempenho nas funções, bem como atuar na organização administrativa e na resolução de conflitos.
A|Art. 5º|A concessão dos Estágios da Chancelaria observará critérios objetivos e subjetivos definidos pela Presidência, não constituindo o seu cumprimento garantia automática de progressão.
H|Título III · Das prerrogativas
A|Art. 6º|O Chanceler deverá concluir todos os treinamentos do Curso Básico Militar (CBM) até o Curso de Formação de Superiores (CFS), conquistando gradualmente as prerrogativas previstas neste artigo.
P|§ 1º|Após a aprovação no CCO:
I|I -|Acesso ao chat de Oficiais;
I|II -|Vale-auxiliar para uma divisão ou diretoria.
I|III -|Autonomia para promover até um Subtenente a Aspirante e um Analista a Coordenador;
I|IV -|Permissão para aplicar a punição de apresentar armas.
P|§ 2º|Após a aprovação no CGA:
I|I -|Acesso ao chat de Oficiais Superiores;
I|II -|Participação na Reunião Semanal dos Superiores;
I|III -|Permissão para aplicar advertências e rebaixamentos.
P|§ 3º|Após a aprovação no CLD:
I|I -|Permissão para aplicar demissões.
P|§ 4º|Após a aprovação no CFS:
I|I -|Acesso ao chat de Coronéis;
I|II -|Autonomia para promover até um Capitão a Major e um Delegado a Investigador;
I|III -|Uso da estrela, simbolizando a conclusão dos cursos da Academia Policial;
I|IV -|Direito à Reforma, mediante autorização da Presidência.
P|§ 5º|Constituem prerrogativas gerais do cargo:
I|I -|Aplicação de punções restrita à Presidência, salvo mediante ofício ao Tribunal de Justiça Policial;
I|II -|Acompanhamento do Comando, com a finalidade de auxiliar no desenvolvimento e progressão na carreira.
H|Título IV · Dos estágios da Chancelaria
A|Art. 7º|O Chanceler que concluir o Curso de Formação de Superiores (CFS) e pleitear o Estágio I (equivalente à Inspetoria) deverá atender aos seguintes requisitos, além de análise da Presidência quanto ao desempenho e aptidão para o cargo:
I|I -|Cumprir com as obrigações em base, reconhecendo subordinados regularmente;
I|II -|Demonstrar capacidade de análise crítica e acompanhamento de subordinados;
I|III -|Possuir aptidão para mediação de conflitos, nos termos legais;
I|IV -|Ocupar, no mínimo, o cargo interno de Auxiliar em alguma divisão ou diretoria;
I|V -|Participar ativamente da Reunião Semanal dos Superiores;
I|VI -|Manter conduta compatível com o cargo, evitando punições escritas.
A|Art. 8º|A concessão do Estágio I confere ao Chanceler as prerrogativas da Inspetoria, incluindo:
I|I -|Acesso ao chat da Inspetoria;
I|II -|Possibilidade de ministrar a Reunião Semanal dos Superiores;
I|III -|Autonomia para promover um Major a Tenente-Coronel;
I|IV -|Percepção de salário correspondente;
I|V -|Administração nos chats e emblemas institucionais definidos pelo Comando.
P|§ 1º|O Chanceler permanecerá em seu cargo, devendo a identificação funcional constar na missão e observar o seguinte padrão: [DIC] Chanceler ¥ [Siglas] ou [DIC] Chanceler E1 [Siglas].
P|§ 2º|O Chanceler deverá utilizar a medalha “Hierarquia Militar 1”, na cor vermelha, como indicado abaixo.
A|Art. 9º|O Chanceler que concluir o Estágio I e pleitear o Estágio II (equivalente à Superintendência) deverá atender aos seguintes requisitos, além de análise da Presidência quanto ao desempenho e aptidão para o cargo:
I|I -|Executar as funções previstas na escala da Inspetoria;
I|II -|Participar ativamente das reuniões de Oficiais Superiores e das reuniões do Corpo de Superiores;
I|III -|Ser participativo no chat da Inspetoria;
I|IV -|Ocupar, no mínimo, o cargo interno de Sub-líder em alguma divisão ou diretoria;
I|V -|Demonstrar capacidade de análise crítica e iniciativa nas funções desempenhadas;
I|VI -|Apresentar histórico de desempenho satisfatório em base;
I|VII -|Manter conduta exemplar, com domínio dos procedimentos administrativos.
A|Art. 10.|A concessão do Estágio II confere ao Chanceler as prerrogativas da Superintendência, incluindo:
I|I -|Acesso ao chat da Superintendência;
I|II -|Autorização para atuar como vendedor de Cargos Executivos, conforme normas vigentes;
I|III -|Percepção de salário correspondente;
P|§ 1º|O Chanceler permanecerá em seu cargo, devendo a identificação funcional constar na missão e observar o seguinte padrão: [DIC] Chanceler ¥¥ [Siglas] ou [DIC] Chanceler E2 [Siglas].
P|§ 2º|O Chanceler deverá utilizar a medalha “Hierarquia Militar 2”, na cor vermelha, como indicado abaixo.
A|Art. 11.|O Chanceler que concluir o Estágio II e pleitear o Estágio III (equivalente ao Comando) deverá atender aos seguintes requisitos, além de análise da Presidência quanto ao desempenho e aptidão para o cargo:
I|I -|Cumprir regularmente suas funções na escala semanal;
I|II -|Demonstrar iniciativa na elaboração de projetos e contribuir para o desenvolvimento da Polícia;
I|III -|Apresentar histórico de desempenho satisfatório em base;
I|IV -|Demonstrar capacidade de liderança e bom relacionamento com subordinados;
I|V -|Participar ativamente das discussões no chat da Superintendência.
A|Art. 12.|A concessão do Estágio III confere ao Chanceler as prerrogativas do Comando, incluindo:
I|I -|Acesso ao chat do Comando;
I|II -|Administração dos grupos gerenciados pelo Comando;
I|III -|Percepção de salário correspondente;
I|IV -|Atuação como moderador do System;
I|V -|Moderação nas plataformas oficiais definidas pela Presidência;
I|VI -|Representação institucional da Polícia DIC, quando designado;
I|VII -|Direito à aposentadoria especial, conforme critérios estabelecidos pela Presidência.
P|§ 1º|O Chanceler permanecerá em seu cargo, devendo a identificação funcional constar na missão e observar o seguinte padrão: [DIC] Chanceler ¥¥¥ [Siglas] ou [DIC] Chanceler E3 [Siglas].
P|§ 2º|O Chanceler deverá utilizar a medalha “Hierarquia Militar 3”, na cor vermelha, como indicado abaixo.
A|Art. 13.|O Chanceler que concluir o Estágio III e pleitear o Estágio IV (equivalente ao Comando-Geral) deverá atender aos seguintes requisitos, além de análise da Presidência quanto ao desempenho e aptidão para o cargo:
I|I -|Apresentar desempenho satisfatório no Comando;
I|II -|Manter conduta compatível com as atribuições do cargo;
I|III -|Possuir histórico funcional positivo, sem punições escritas;
I|IV -|Desenvolver e participar de projetos institucionais;
I|V -|Demonstrar conhecimento amplo sobre a estrutura e funcionamento da Polícia DIC.
A|Art. 14.|A concessão do Estágio IV confere ao Chanceler as prerrogativas do Comando-Geral, incluindo:
I|I -|Acesso ao chat do Comando-Geral;
I|II -|Acesso aos chats de lideranças das divisões e diretorias;
I|III -|Administração nos chats das divisões e diretorias;
I|IV -|Administração nas plataformas institucionais definidas pela Presidência;
I|V -|Atuação no acompanhamento e desenvolvimento dos Cargos Executivos;
I|VI -|Organização de eventos, reuniões e demais atividades institucionais.
P|§ 1º|O Chanceler permanecerá em seu cargo, devendo a identificação funcional constar na missão e observar o seguinte padrão: [DIC] Chanceler ¥¥¥¥ [Siglas] ou [DIC] Chanceler E4 [Siglas].
P|§ 2º|O Chanceler deverá utilizar a medalha “Hierarquia Militar 4”, na cor vermelha, como indicado abaixo.
A|Art. 15.|O Chanceler que concluir o Estágio IV e pleitear o Estágio V (equivalente à Supremacia) deverá atender aos seguintes requisitos, além de análise da Presidência quanto ao desempenho e aptidão para o cargo:
I|I -|Apresentar desempenho excepcional no Comando-Geral;
I|II -|Desenvolver e assumir responsabilidade por projetos de relevância institucional;
I|III -|Demonstrar capacidade de gestão de crises e implementação de medidas estratégicas;
I|IV -|Evidenciar domínio das atividades administrativas e operacionais da Polícia DIC.
A|Art. 16.|A concessão do Estágio V confere ao Chanceler as prerrogativas da Supremacia, incluindo:
I|I -|Exercício das prerrogativas atribuídas ao cargo de Supremo;
I|II -|Possibilidade de integração à hierarquia militar na patente de Supremo, mediante deliberação da Presidência;
I|III -|Atuação na avaliação de policiais, conforme designação da Presidência;
P|§ 1º|O Chanceler permanecerá em seu cargo, devendo a identificação funcional constar na missão e observar o seguinte padrão: [DIC] Chanceler ¥¥¥¥¥ [Siglas] ou [DIC] Chanceler E5 [Siglas].
P|§ 2º|O Chanceler deverá utilizar a medalha “Hierarquia Militar 5”, na cor vermelha, como indicado abaixo.
H|Título V · Das disposições finais
A|Art. 17.|Este documento encontra-se sob a jurisdição do Departamento de Investigação Criminal [DIC], com todos os direitos reservados.
A|Art. 18.|As alterações deste documento somente poderão ser realizadas por deliberação da Presidência.`;
const D4=`H|Cap. I · Das disposições gerais
A|Art. 1º|O Regulamento Disciplinar da Polícia DIC (RD) tem por finalidade especificar as transgressões disciplinares e estabelecer normas relativas a punições e seus recursos.
A|Art. 2º|Estão sujeitos a este regulamento todos os militares e Cargos Executivos da Polícia DIC, na ativa, aposentados ou reformados.
P|Parágrafo único.|Os membros da Presidência de ambas as hierarquias serão julgados e punidos pelo Conselho Superior de Justiça.
A|Art. 3º|Compete privativamente à Presidência legislar sobre matéria disciplinar.
P|§ 1º|A competência de que trata o caput deste artigo poderá ser delegada ao Tribunal da Justiça Policial, ou ao Comando a qualquer tempo.
P|§ 2º|As alterações realizadas neste regulamento devem ser publicadas com vistas ao princípio da legalidade.
A|Art. 4º|A disciplina militar é um dos preceitos básicos norteadores da Polícia DIC e se baseia na rigorosa observância e no acatamento integral das normas e regulamentos.
P|§ 1º|Incumbe aos militares incentivar e manter a harmonia e a amizade entre seus pares e subordinados.
P|§ 2º|É dever do superior tratar os subordinados em geral com interesse e bondade.
P|§ 3º|O subordinado deve agir com respeito e obediência para com os seus superiores hierárquicos.
A|Art. 4º-A.|Toda atuação disciplinar no âmbito da Polícia DIC será guiada pelos princípios institucionais do Tribunal de Justiça Policial (TJP) e do Conselho Superior de Justiça (CSJ), resguardando a integridade, a imparcialidade e a eficiência da justiça interna. São princípios obrigatoriamente observados:
I|I -|Legalidade: nenhuma conduta será punida sem a devida previsão normativa anterior. A atuação disciplinar deve sempre respeitar as normas vigentes da instituição;
I|II -|Impessoalidade: os julgamentos e procedimentos disciplinares devem ser conduzidos com neutralidade, assegurando tratamento igualitário a todos os policiais da Polícia DIC;
I|III -|Proporcionalidade: a penalidade aplicada deve ser compatível com a gravidade da infração e ao cargo, posto ou graduação de cada infrator, considerando a intenção, reincidência, histórico e impacto da conduta;
I|IV -|Ampla Defesa e Contraditório: será garantido ao acusado o direito de se manifestar plenamente e apresentar sua defesa;
I|V -|Moralidade e Ética: a conduta da autoridade julgadora e das partes envolvidas deve pautar-se pela ética e pelo respeito mútuo, preservando a imagem e os valores da Polícia DIC.
P|Parágrafo único.|O descumprimento de qualquer dos princípios estabelecidos neste artigo poderá ensejar a revisão do ato disciplinar ou, conforme o caso, responsabilização da autoridade que o praticou.
A|Art. 4º-B.|O policial acusado em processo disciplinar possui garantias fundamentais asseguradas por este Regulamento, em conformidade com os princípios constitucionais do devido processo legal, da ampla defesa, do contraditório, da dignidade da pessoa humana e da imparcialidade.
P|§ 1º|São direitos assegurados ao acusado:
I|I -|Ser formalmente informado da transgressão a ele imputada, com descrição precisa dos fatos que a sustentam;
I|II -|Ter garantido o contraditório e a ampla defesa;
I|III -|Ser julgado unicamente com base nos fatos da infração atual, sendo vedada a consideração de transgressões anteriores como agravante, salvo em casos de reincidência da mesma conduta;
I|IV -|Ter assegurado o prazo razoável para apresentação de defesa, 15 dias a partir do recebimento da punição recorrida;
I|V -|É vedado o julgamento por autoridade integrante do Tribunal de Justiça Policial – compreendendo juízes, defensores e promotores – que esteja diretamente envolvida ou tenha interesse pessoal no desfecho do processo, a fim de resguardar a imparcialidade do julgamento e prevenir conflitos de interesse.;
I|VI -|Ter resguardada sua imagem e moral até a decisão definitiva, sendo vedada qualquer forma de exposição vexatória;
I|VII -|Ser representado por defensor ou por si próprio, nos termos do regulamento interno do Tribunal de Justiça Policial;
I|VIII -|Ter direito à revisão da sanção aplicada, mediante recurso nos termos previstos neste regulamento;
I|IX -|Ter a pena aplicada com observância do princípio da proporcionalidade, levando-se em conta a intenção, o contexto e os antecedentes da mesma natureza.
P|§ 2º|O histórico disciplinar anterior do acusado poderá ser consultado exclusivamente para fins estatísticos, de análise de conduta funcional ou para apuração de reincidência da transgressão em questão, sendo vedado seu uso como agravante genérico, exceto nos processos e decisões conduzidos pelo Estado-Maior, aos quais esta vedação não se aplica.
A|Art. 5º|A todos os policiais é indispensável a fiel execução e cumprimento das normas estabelecidas nos documentos oficiais.
H|Cap. II · Título I · Da conceituação
A|Art. 6º|Considera-se transgressão disciplinar toda e qualquer conduta que atente contra as normas aqui dispostas e todos os atos que firam as normas elencadas nos regimentos internos das divisões e diretorias da Polícia DIC, bem como os atos ofensivos à ética, aos deveres e às obrigações policiais.
A|Art. 7º|São transgressões disciplinares todas as ações contidas na parte especial deste regulamento, bem como aquelas contidas nas legislações das divisões e diretorias.
A|Art. 8º|Conforme a Legislação, o militar que aplicar apresentar-armas, advertências, rebaixamentos e/ou demissões sem concreta justificativa receberá para si a mesma punição que aplicou erroneamente.
A|Art. 9º|Quando a apuração de uma transgressão for realizada por meios ilegais ou em desacordo com os preceitos constitucionais e legais, ficará garantido ao prejudicado o direito à reparação
I|I. -|De absolvição;
I|II -|De redução ou substituição da pena;
I|III -|Da anulação do processo.
P|Parágrafo único.|No caso da anulação do processo, poderá ser iniciada outra denúncia por parte do denunciante de maneira que fique de acordo com os preceitos regulares.
H|Cap. II · Título II · Das penas e do julgamento
A|Art. 10.|Aplicam-se as penas conforme a gravidade da transgressão disciplinar.
A|Art. 11.|As transgressões disciplinares estão dispostas em níveis, conforme o grau de reprovabilidade da conduta praticada:
I|I -|Levíssimas;
I|II -|Leves;
I|III -|Médias;
I|IV -|Graves;
I|V -|Gravíssimas.
A|Art. 12.|É vedada a aplicação de mais de uma pena para a mesma transgressão disciplinar, exceto nos casos em que o Tribunal da Justiça Policial assim definir.
A|Art. 13.|O julgamento da transgressão deve ser precedido de análise que considere:
I|I -|A pessoa do transgressor;
I|II -|O que levou ao seu cometimento;
I|III -|As consequências do ato.
A|Art. 14.|No julgamento da transgressão, podem ser levantadas causas que a justifiquem, que a atenuem ou que a agravem.
A|Art. 15.|Haverá causa de justificação quando a transgressão for cometida:
I|I -|Em obediência a ordem superior;
I|II -|Por ignorância, plenamente comprovada, desde que não atente contra os princípios básicos de convivência na Polícia DIC;
I|III -|Em estrito cumprimento do dever.
P|Parágrafo único.|Não haverá punição quando for reconhecida qualquer causa de justificação.
A|Art. 16.|São circunstâncias atenuantes:
I|I -|Ser o transgressor réu primário;
I|II -|O tempo de efetivo serviço maior que um (1) ano;
I|III -|Ser a participação na transgressão de menor importância;
I|IV -|A falta de prática do serviço;
I|V -|Ter cometido a transgressão sob coação, ou em cumprimento de ordem de autoridade superior;
I|VI -|Ter confessado espontaneamente, perante aos órgãos responsáveis, a transgressão;
I|VII -|Colaborar em investigação ou processo-crime com informações que levem a identificação de outros transgressores, a revelação de grupo criminoso ou na prevenção das transgressões disciplinares.
A|Art. 17.|São circunstâncias agravantes:
I|I -|O mau comportamento;
I|II -|A prática simultânea de duas ou mais transgressões;
I|III -|A reincidência em transgressão, desde que a última tenha sido cometida dentro do período de 6 (seis) meses anteriores;
I|IV -|O conluio de duas ou mais pessoas;
I|V -|Ter o transgressor abusado de sua autoridade hierárquica ou funcional;
I|VI -|Ter praticado a transgressão em base ou por meio de qualquer canal de comunicação oficial da polícia;
I|VII -|Ter utilizado a estrutura de alguma divisão ou diretoria para atingir seus objetivos ilegais;
I|VIII -|A prática atentatória contra o Comando, a Presidência, ao Tribunal de Justiça Policial ou Grupo de Operações Especiais (GOE);
I|IX -|Ser o policial equivalente ou superior a Major.
A|Art. 18.|Na análise das atenuantes e agravantes, serão desconsideradas as penalidades aplicadas em passagens anteriores.
P|§ 1º|Exceto nos casos que dizem respeito à condição de réu primário, o caput não será concedido ao policial que evidenciar reincidência em punições na sua passagem atual.
P|§ 2º|A aplicação da agravante prevista no inciso VI somente será admitida quando a conduta praticada for classificada como de natureza grave ou gravíssima.
A|Art. 19.|As penas principais são:
I|I -|Repreensão;
I|II -|Apresentar armas;
I|III -|Advertência escrita;
I|IV -|Rebaixamento;
I|V -|Demissão;
I|VI -|Banimento.
A|Art. 20.|A repreensão é a forma mais branda de punir, consistindo em advertência feita de forma verbal ao transgressor, em caráter reservado.
P|§ 1º|O caráter reservado da repreensão deve ser obedecido em todos os casos em que sua publicidade possa acarretar em vexame público.
P|§ 2º|A repreensão não constará na ficha do policial.
P|§ 3º|Aplica-se a repreensão aos casos de transgressões disciplinares consideradas levíssimas.
A|Art. 21.|A punição de apresentar armas é a obrigação de o punido acenar durante período pré-determinado.
P|§ 1º|A punição de apresentar armas deve ser acompanhada de uma repreensão, de forma totalmente reservada.
P|§ 2º|O tempo de cumprimento da sanção não poderá ultrapassar dez (10) minutos.
P|§ 3º|Aplica-se a punição de apresentar armas às transgressões disciplinares consideradas leves, bem como aos reincidentes repreendidos.
P|§ 4º|Em caso de autopunição para transgressões leves, a repreensão se torna dispensável.
P|§ 5º|A pena de apresentar-armas poderá ser imposta a partir da graduação de Cabo e equivalentes, desde que cumprida a exigência do treinamento correspondente (CFB2).
A|Art. 22.|Aplica-se advertência escrita aos policiais que cometam transgressões disciplinares consideradas médias.
P|§ 1º|A advertência escrita será registrada na ficha policial.
P|§ 2º|As advertências escritas são perdoadas nos casos em que o policial é promovido de:
J|I -|Oficial superior para Superior;
J|II -|Superior para Comando;
J|III -|Comando para Presidência.
P|§ 3º|O policial que não reincida em nenhuma transgressão disciplinar punível com advertência escrita será perdoado após quarenta e cinco (45) dias. Caso reincida, o prazo será de sessenta (60) dias.
P|§ 4º|Sargentos acima podem receber advertência em caráter administrativo, sendo que apenas Subtenentes acima podem receber advertência por reprovabilidade de conduta.
A|Art. 23.|O rebaixamento é a punição na qual o policial perde seu cargo, posto ou graduação.
P|§ 1º|Os rebaixamentos são registrados na ficha do policial.
P|§ 2º|Em regra, os rebaixamentos ocorrem somente uma vez por cargo, posto ou graduação. No entanto, comprovado o grau de reprovabilidade da transgressão, pode-se aplicar quantos rebaixamentos forem necessários.
P|§ 3º|O acúmulo de três (3) advertências escritas na ficha policial acarretará no seu automático rebaixamento.
P|§ 4º|Aplica-se o rebaixamento aos casos de transgressões disciplinares consideradas graves.
A|Art. 24.|A demissão consiste no desligamento definitivo do policial, a bem da disciplina e da ordem.
P|§ 1º|As demissões recebem o nome de dispensa quando o policial faz um pedido direto acerca do seu desligamento do Departamento, onde deixa claro que deseja encerrar sua carreira na Instituição.
P|§ 2º|Aplica-se a demissão aos casos de transgressões disciplinares consideradas gravíssimas.
P|§ 3º|A demissão pode vir acompanhada de banimento temporário ou definitivo da Polícia DIC, a ser aplicado pelo Tribunal de Justiça Policial, Grupo de Operações Especiais, Comando ou pela Presidência, de acordo com a conveniência ou oportunidade.
A|Art. 25.|Fica vedado aos policiais, enquanto submetidos a procedimento investigativo instaurado pelo Tribunal de Justiça Policial (TJP) ou por qualquer outro órgão fiscalizador competente, pleitear dispensa voluntária da Polícia.
P|§ 1º|O descumprimento de tal proibição não ensejará a extinção do procedimento investigativo, o qual prosseguirá, se necessário, à revelia do investigado.
P|§ 2º|Em caso de condenação, será imposta como única penalidade o banimento, cabendo à autoridade competente a determinação do grau de severidade, temporário ou definitivo, em consonância com a gravidade das infrações apuradas.
A|Art. 25-A.|Será admitido como meio de prova, para fins de apuração da verdade dos fatos em processos disciplinares ou administrativos, o testemunho de pessoas que possuam conhecimento direto ou indireto sobre os acontecimentos do processo.
P|§ 1º|A prova testemunhal será avaliada conforme sua coerência interna, compatibilidade com os demais elementos dos autos, e a credibilidade da pessoa que a fornece, levando-se em conta sua relação com as partes envolvidas e as circunstâncias do depoimento.
P|§ 2º|O juízo de valor sobre a prova testemunhal deverá considerar a espontaneidade, a firmeza das declarações, e a ausência de contradições relevantes, não sendo exigida a prova documental para sua validade, salvo quando o órgão julgador do processo decidir o contrário.
P|§ 3º|É vedada a desconsideração da prova testemunhal exclusivamente com base em sua natureza subjetiva, devendo o órgão julgador fundamentar expressamente sua decisão ao rejeitá-la.
H|Cap. II · Título III · Da aplicação
A|Art. 26.|A repreensão pode ser aplicada por Sargentos e equivalentes com os respectivos treinamentos da graduação (CFA).
A|Art. 27.|A pena de apresentar armas pode ser aplicada por Sargentos e equivalentes com os respectivos treinamentos do posto (CFA).
P|Parágrafo único.|Na aplicação da punição de apresentar armas, o policial deverá obedecer ao tempo definido em legislação.
A|Art. 28.|A pena de advertência escrita pode ser aplicada por Tenentes e equivalentes com o Curso de Formação para Oficiais (CFO).
A|Art. 29.|A pena de rebaixamento pode ser aplicada por Capitães e equivalentes, desde que tenha finalizado o Curso de Comando Operacional (CCO).
P|§ 1º|Por decisão colegiada, o Corpo de Superiores, o Comando ou a Presidência podem decidir sobre o rebaixamento de policiais por incompatibilidade com o cargo, posto ou graduação.
P|§ 2º|O Comando possui a prerrogativa de realizar rebaixamentos múltiplos sob ordem administrativa.
P|§ 3°|Compete exclusivamente ao Tribunal de Justiça Policial (TJP), ao Conselho Superior de Justiça (CSJ) e à Presidência a aplicação de rebaixamentos múltiplos por reprovabilidade de conduta.
A|Art. 30.|A pena de demissão pode ser aplicada por Majores e equivalentes, desde que tenha finalizado o Curso de Gestão Administrativa (CGA).
P|§ 1º|As demissões devem ser comunicadas ao Comando para fins de procedimentos administrativos.
P|§ 2º|Os banimentos são aplicados exclusivamente pela Presidência, pelo Comando, pelo Grupo de Operações Especiais e pelo Tribunal de Justiça Policial, por delegação.
P|§ 3º|Compete exclusivamente à Presidência a análise do nivelamento de banimentos.
A|Art. 31.|A todos os policiais é garantido o direito de recurso contra punições disciplinares que julgarem injustas, ofensivas ou injustificadas.
P|§ 1º|Compete ao Tribunal de Justiça Policial o julgamento dos recursos interpostos em face de punições disciplinares.
P|§ 2º|Ao Conselho Superior de Justiça compete o segundo, e, último grau de recurso das decisões proferidas no Tribunal de Justiça Policial.
P|§ 3º|Não cabe recurso à punição aplicada diretamente por um membro da Presidência.
A|Art. 31-A.|No que diz respeito às prerrogativas, estas se sobrepõem à equivalência dos policiais, de modo que o policial com prerrogativas superiores pode aplicar punições aos seus pares de equivalência Executiva, desde que façam parte do Comando.
A|Art. 31-B.|A deliberação colegiada sobre sanções será aplicável somente nos seguintes casos e por seus respectivos órgãos competentes:
P|§ 1º|As sanções de natureza disciplinar somente poderão ser decididas de forma colegiada pelo Tribunal de Justiça Policial (TJP), pelo Conselho Superior de Justiça (CSJ) ou pela Presidência, conforme suas competências regimentais.
P|§ 2º|As sanções de natureza administrativa somente poderão ser decididas de forma colegiada pelo Corpo de Superiores, Comando, Comando-Geral e pela Presidência.
P|§ 3º|Fica vedada a deliberação colegiada fora das competências previstas nos §1º e §2º, sendo consideradas nulas quaisquer decisões colegiadas proferidas por órgãos ou membros não autorizados.
P|§ 4º|Ocorrências de natureza disciplinar, quando não submetidas aos órgãos competentes mencionados no §1º, não poderão ser objeto de deliberação colegiada, devendo seguir rito de apuração individual, fundamentado e objetivo.
H|Cap. II · Título IV · Das transgressões
A|Art. 32.|São consideradas transgressões disciplinares de natureza levíssima:
I|TLV1 -|Entrar em base com missão, uniforme ou grupo favoritado de maneira irregular;
I|TLV2 -|Ausentar-se em qualquer setor do quartel, exceto área externa, sala VIP ou ausência, sendo Praça ou Cargo Executivo com os treinamentos equivalentes;
I|TLV3 -|Solicitar salários, distintivos, condecorações e promoções, inclusive em divisões e diretorias;
I|TLV4 -|Alistar de forma errônea;
I|TLV5 -|Apresentar erros no trabalho em base;
I|TLV6 -|Errar os pronomes de tratamento;
I|TLV7 -|Trabalhar mal, intencionalmente ou por falta de atenção, em qualquer serviço ou instrução;
I|TLV8 -|Utilizar qualquer abreviação dentro de base;
I|TLV9 -|Utilizar-se das prerrogativas hierárquicas e/ou funcionais para interferir incorretamente ou exageradamente no serviço de outro setor ou militar;
I|TLV10 -|Ausentar-se de um setor sem assumir a maior graduação, posto ou cargo presente, quando devido;
I|TLV11 -|Retirar-se de setor ou local de serviço sem prévia autorização do comandante responsável ou da autoridade competente.
A|Art. 33.|São consideradas transgressões disciplinares de natureza leve:
I|TL1 -|Usar de forma irregular o sistema de turnos;
I|TL2 -|Ausentar-se em qualquer setor do quartel, exceto área externa, sala VIP ou ausência, sendo Oficial ou Cargo Executivo com os treinamentos equivalentes;
I|TL3 -|O policial solicitar aplicar um treinamento para um militar que está sendo promovido antes que o procedimento de promoção seja finalizado;
I|TL4 -|Solicitar aprovação em teste e/ou treinamento de divisão;
I|TL5 -|Entrar em base durante a execução do sentido, salvo quando o detentor do sentido permitir ou caso seja superior do policial que está recebendo o comando;
I|TL6 -|Alterar uniforme ou missão fora de ambas salas de comandos;
I|TL7 -|Ser reincidente em transgressão disciplinar de natureza levíssima.
A|Art. 34.|São consideradas transgressões disciplinares de natureza média:
I|TM1 -|Utilizar-se de forma irregular dos direitos concedidos;
I|TM2 -|Utilizar direitos garantidos da posição que ocupa de maneira inadequada;
I|TM3 -|Portar-se em base de maneira indecorosa, contra os princípios, valores e padrões da polícia;
I|TM4 -|Deixar de exercer autoridade compatível com seu cargo, posto ou graduação e treinamento;
I|TM5 -|Desrespeitar as regras estabelecidas na Habbo Etiqueta;
I|TM6 -|Ausentar-se, sem a devida autorização, do exercício de suas funções, do local do serviço ou de outro qualquer em que deva encontrar-se por força de disposição legal ou ordem;
I|TM7 -|Não cumprir funções estabelecidas pela liderança da divisão e diretoria da qual faz parte;
I|TM8 -|Atrasar ou descumprir com a função ou divisão e diretoria;
I|TM9 -|Se retirar da divisão ou diretoria sem bater no mínimo duas semanas de metas na função interna que ocupa;
I|TM10 -|Receber três notificações em sequência;
I|TM11 -|Abandonar posições que ocupa ou funções, fora os casos permitidos;
I|TM12 -|Usufruir ou tentar utilizar documentos ilegais ou qualquer outra informação para obter vantagem nas avaliações a que for submetido;
I|TM13 -|Exercer funções que não lhe foram atribuídas, sem a devida autorização ou competência, sejam elas de natureza operacional ou administrativa;
I|TM14 -|Realizar falso testemunho, negar ou calar a verdade como requerente em processos judiciais;
I|TM15 -|Promover ou envolver-se em rixa, discussões e/ou ataques verbais, com outro militar;
I|TM16 -|Faltar à verdade ou omitir deliberadamente informações que possam conduzir à apuração de uma transgressão disciplinar;
I|TM17 -|Deixar de cumprir ou alterar, sem justo motivo, as determinações constantes da ordem recebida de um superior, ou qualquer outra determinação escrita ou verbal;
I|TM18 -|Desrespeitar um superior;
I|TM19 -|Desrespeitar o serviço do policial de cargo, posto ou graduação subordinada;
I|TM20 -|Constranger policial de cargo, posto ou graduação inferior, ofendendo-o por palavra, ato ou escrito;
I|TM21 -|Desacatar um policial no exercício de sua função;
I|TM22 -|Desclassificar atividades ou membros de divisões e diretorias da polícia;
I|TM23 -|Adulterar documentos internos;
I|TM24 -|Divulgar ou compartilhar informações de somenos de chats alheios, documentos ou outros meios inacessíveis ao receptor;
I|TM25 -|Afirmar que um policial cometeu falsamente uma conduta criminosa;
I|TM26 -|Fazer afirmação falsa sobre outro policial, ofendendo a reputação;
I|TM27 -|Xingar ou/e realizar brincadeiras de mau gosto, ofendendo a honra do policial;
I|TM28 -|Concorrer para a discórdia ou a desarmonia ou cultivar inimizade entre militares;
I|TM29 -|Divulgar e/ou compartilhar fotografias de outros policiais em redes sociais como o Facebook ou o Telegram sem o seu devido consentimento;
I|TM30 -|Aconselhar ou concorrer para que não seja cumprida qualquer ordem de autoridade competente, ou para retardar a sua execução;
I|TM31 -|Ofender a moral das divisões, diretorias e seus membros, por atos, gestos ou palavras;
I|TM32 -|Atribuir-se publicamente a condição de vítima ou injustiçado com o intuito de gerar comoção, influenciar julgamentos ou deslegitimar decisões;
I|TM33 -|Incitar ou concorrer para que outrem incida em transgressão administrativa;
I|TM34 -|Deixar de participar das atividades nas dependências da polícia ou a qualquer ato de serviço para o qual tenha sido escalado ou a que deva assistir;
I|TM35 -|Faltar ou chegar atrasado, sem justo motivo, a qualquer ato, serviço ou instrução de que deva participar ou a que deva assistir;
I|TM36 -|Ausentar-se do batalhão por mais de sete (7) dias sem a devida autorização ou aval;
I|TM37 -|Acumular verificações dos Supervisores;
I|TM38 -|Usurpar a função de outra organização, policial ou cargo;
I|TM39 -|Utilizar-se do modo offline ou visibilidade desativada, pertencendo à Hierarquia Militar, sem a devida autorização da Presidência;
I|TM40 -|Ser reincidente em transgressão disciplinar de natureza leve.
A|Art. 35.|São consideradas transgressões disciplinares de natureza grave:
I|TG1 -|Utilizar de funções ou atribuições para benefício próprio, ou de outro;
I|TG2 -|Deixar de punir o subordinado que cometer transgressão, salvo na ocorrência das circunstâncias de justificação previstas neste regulamento, ou quando se tratar de superior, não levar o fato ao conhecimento da autoridade competente;
I|TG3 -|Não levar falta ou irregularidade que presenciar, ou de que tiver ciência e não lhe couber reprimir, ao conhecimento de autoridade competente, dentro do prazo de 48 (quarenta e oito) horas;
I|TG4 -|Deixar de cumprir prescrições expressamente estabelecidas na Legislação da Polícia DIC ou em outros regulamentos, desde que não haja tipificação como transgressão disciplinar, cuja violação afete os preceitos da hierarquia e disciplina, a ética militar, a honra pessoal, o pundonor militar ou o decoro da classe;
I|TG5 -|Omitir ou deixar de mostrar print de autorização em promoção, punição e demais procedimentos que necessitam de permissão, ou nele inserir informação falsa;
I|TG6 -|Utilizar-se de funções alheias para benefício próprio ou de outrem;
I|TG7 -|Favorecer amigos e/ou parentes, em detrimento de pessoas qualificadas, nomeando ou elevando posições/funções em troca ou não de recompensas, de modo que a ética e o mérito profissional sejam substituídos por relações afetivas;
I|TG8 -|Falsificar de qualquer modo, relatórios, aulas, postagens oficiais da DIC, ou qualquer informação, em todo território da Polícia DIC;
I|TG9 -|Dar início a um processo judicial ou administrativo, contra uma pessoa, sabendo que esta é inocente;
I|TG10 -|Negligenciar, atrasar ou dificultar ao subordinado a apresentação de recurso contra punições;
I|TG11 -|Se apresentar em processos judiciais, com provas falsas a favor de terceiros ou de si próprio;
I|TG12 -|Ofender, provocar, desafiar, desconsiderar ou procurar desacreditar outro militar, por atos, gestos ou palavras, mesmo entre civis;
I|TG13 -|Não realizar, ou realizar de forma inadequada funções decretadas em processos judiciais;
I|TG14 -|Acumular (3) três advertências escritas;
I|TG15 -|Induzir ou concorrer intencionalmente para que outrem incida em transgressão disciplinar;
I|TG16 -|Censurar ato de superior hierárquico ou procurar desconsiderá-lo seja entre militares, seja entre civis;
I|TG17 -|Desacreditar, dirigir-se, referir-se ou responder de maneira desatenciosa a superior hierárquico;
I|TG18 -|Utilizar-se de canais de comunicação inapropriados para denunciar um policial, desrespeitando o caráter privativo e/ou sigiloso da denúncia;
I|TG19 -|Apropriar-se de dinheiro ou qualquer utilidade que, no exercício da função, recebeu por erro de outrem;
I|TG20 -|Utilizar ou divulgar, indevidamente, com o fim de beneficiar a si ou a outrem, ou de comprometer a credibilidade do certame, conteúdo sigiloso de processo seletivo ou avaliação ou exame de natureza administrativa;
I|TG21 -|Solicitar auxílio, em exames de natureza prática ou teórica, a outrem o envio de questionários, gabaritos ou normas que possam contribuir para a resolução de exercícios pertencentes a avaliações administrativas;
I|TG22 -|Ser reincidente em transgressão disciplinar de natureza média;
I|TG23 -|Solicitar, receber ou exigir, para si ou para terceiros, vantagens indevidas, seja de forma direta ou indireta. Isso inclui atos realizados fora do exercício da função ou antes de sua assunção, desde que estejam relacionados à função desempenhada;
I|TG24 -|Desacatar ou ridicularizar decisões provenientes de qualquer instância ou entidade punitiva, demonstrando desrespeito para com sua legitimidade e autoridade;
I|TG25 -|Incitar distúrbios, zombaria ou manifestações desrespeitosas em publicações, plataformas de comunicação ou qualquer meio oficial vinculado às atividades da polícia;
I|TG26 -|Publicar, comentar, curtir ou compartilhar conteúdos que desrespeitem, ironizem ou desacreditem superiores, colegas ou a instituição, mesmo que sem menção explícita;
I|TG27 -|Realizar postagens com mensagens ambíguas, indiretas ou passivo-agressivas, com potencial de gerar instabilidade interna;
I|TG28 -|Empregar o direito de expressão para desacatar regras, mascarar indisciplina ou manipular percepções internas;
I|TG29 -|Ser conivente ou apoiar, mesmo implicitamente, manifestações públicas contrárias aos valores da instituição.
A|Art. 36.|São consideradas transgressões disciplinares de natureza gravíssima:
I|TGV1 -|Alistar-se com nicks que contenham siglas ou que se refiram à outras organizações policiais;
I|TGV2 -|Promover ataques às dependências da Polícia DIC, realizando flood, baderna ou destruição;
I|TGV3 -|Falsificar ou utilizar de maneira criminosa cargos, postos e graduações ou emblemas;
I|TGV4 -|Utilizar-se de contas fakes para cometer qualquer tipo de crime em base;
I|TGV5 -|Atentar contra a moral do DIC, impondo descrédito, realizando xingamentos, comentários maldosos ou ações impróprias;
I|TGV6 -|Passar-se por um vendedor de cargo executivo;
I|TGV7 -|Praticar assédio sexual ou moral contra qualquer policial da DIC;
I|TGV8 -|Incitar ódio e repúdio a um determinado policial ou grupo;
I|TGV9 -|Usar meios para conseguir a conta de algum policial, com o intuito de prejudicar ou não;
I|TGV10 -|Conspirar contra um policial;
I|TGV11 -|Aceitar ou induzir um policial a passar dados de contas ligadas ao Departamento;
I|TGV12 -|Praticar, induzir ou incitar a discriminação ou preconceito de raça, cor, etnia, religião ou procedência nacional ou estrangeira, condição física ou mental, deficiência, orientação sexual, de gênero e demais comportamentos discriminatórios;
I|TGV13 -|Induzir ou praticar o cyberbullying;
I|TGV14 -|Divulgar e/ou compartilhar fotografias de outros policiais em redes sociais como o Facebook ou o Telegram, sem o seu consentimento e com o intuito de praticar ou de induzir à prática de cyberbullying;
I|TGV15 -|Disseminar boatos ou notícia infundada nos chats, quartos e demais dependências da polícia ou concorrer para tal;
I|TGV16 -|Ordenar despesas não autorizadas pela Presidência;
I|TGV17 -|Vazar informações das quais deveria guardar sigilo, por sua elevada importância, de atos, documentos, dados ou assuntos de que tem ciência em virtude da posição que ocupa ou função interna nas divisões e diretorias;
I|TGV18 -|Desviar verbas pré-destinadas para benefício próprio ou de outrem;
I|TGV19 -|Deixar de considerar os padrões de segurança pessoal especificados em aulas e documentos oficiais de modo que cause dano ou coloque em risco a integridade da polícia;
I|TGV20 -|Conceder, voluntariamente ou não, acesso às contas pessoais utilizadas em todo o território da polícia;
I|TGV21 -|Ausentar-se da polícia voluntariamente sem aval por mais de vinte (20) dias;
I|TGV22 -|Utilizar o perfil em modo offline ou visibilidade desativada, da graduação de Soldado a Subtenente, sem a autorização da Presidência;
I|TGV23 -|Manter o perfil em modo offline ou visibilidade desativada por 72 horas ou mais, estando na graduação de Aspirante ou superior, ou ocupando Cargo Executivo, sem a autorização da Presidência;
I|TGV24 -|Possuir nick inapropriado, ofensivo ou inexistente no Habbo;
I|TGV25 -|Estar o cargo executivo ausente há mais de sessenta (60) dias do departamento;
I|TGV26 -|Praticar balbúrdia ou atentar contra a ordem de outras organizações militares, ou concorrer para tal, seja por atos, gestos ou palavras;
I|TGV27 -|Criar e manter contas fakes dentro da instituição para realização de atos ilícitos ou para ter vantagens para si ou para outrem;
I|TGV28 -|Utilizar-se de camufladores de rede (VPN) sem motivo que justifique o acesso ao Habbo e sem o devido aval da equipe de inteligência do Grupo de Operações Especiais;
I|TGV29 -|Receber bonificações financeiras ou vantagens por engano e/ou agir de má fé;
I|TGV30 -|Falsificar o recebimento de bonificações, prêmios ou gratificações quaisquer, a fim de obter vantagens financeiras para si ou para outrem;
I|TGV31 -|Filiar-se a outro departamento estando registrado na DIC, considerando então traição.
I|TGV32 -|Oferecer/aceitar bonificações financeiras ou qualquer vantagem indevida para benefício próprio ou de outrem;
I|TGV33 -|Utilizar-se do modo oculto no perfil do Habbo sem a devida autorização da Presidência;
I|TGV34 -|Falsificar comprovantes ou tentar aplicar golpes na compra de cargos ou similares;
I|TGV35 -|Ser reincidente em transgressão disciplinar de natureza grave;
I|TGV36 -|Retirar-se dos grupos e/ou chats da Polícia;
I|TGV37 -|Utilizar liberdade de expressão para incitar o desrespeito às normas, ordens ou hierarquias da corporação;
I|TGV38 -|Manter ou utilizar múltiplas contas no Departamento, inclusive aquelas cuja utilização não exige cadastro obrigatório no system.
H|Cap. II · Título V · Das penas acessórias
A|Art. 37.|Aplicam-se penas acessórias com o propósito de balancear as sanções disciplinares tradicionais, assegurando que sejam aplicadas de maneira proporcional ao crime cometido.
P|§ 1°.|As penas acessórias são acrescidas às punições tradicionais.
P|§ 2°|O descumprimento de uma pena acessória agravará sanções tradicionais pré-estabelecidas.
P|§ 3°|As punições deste artigo não marcam o perfil do policial no system. Por questões de praticidade, pode ser sinalizada de forma temporária.
P|§ 4°|As penas acessórias podem ser aplicadas somente por integrantes do Tribunal de Justiça Policial ou do Corpo de Superiores acima.
A|Art. 38.|As penas acessórias podem variar entre:
I|I -|Congelamento no cargo, posto ou graduação;
I|II -|Refazimento de treinamentos;
I|III -|Aumento da meta na divisão e/ou diretoria;
I|IV -|Horas em turnos.
A|Art. 39.|O congelamento poderá equivaler a um acréscimo de até oitenta por cento (80%) do tempo mínimo para promoção do infrator.
A|Art. 40.|O aumento na meta do policial não poderá extrapolar o equivalente ao triplo da pontuação convencional na função em que ocupa.
A|Art. 41.|O tempo de turno ao qual o infrator ficará submetido não poderá ultrapassar o equivalente a dezoito (18) horas em uma semana.
H|Cap. III · Das transgressões administrativas
A|Art. 42.|São consideradas transgressões disciplinares de caráter administrativo todas aquelas oriundas de descumprimentos de disposições regimentais das divisões e diretorias da Polícia DIC.
A|Art. 43.|Compete privativamente ao Colégio de Líderes definir as transgressões administrativas cometidas em cada uma de suas divisões e diretorias, bem como suas punições.
A|Art. 44.|As notificações aplicadas em face de transgressões administrativas possuem a vigência de 45 dias. Dado este prazo, serão imediatamente canceladas.
H|Cap. IV · Do sistema recursal
A|Art. 45.|É garantido a todos os policiais da DIC o duplo grau de jurisdição nos recursos interpostos, respeitando os princípios da ampla defesa e do contraditório.
A|Art. 46.|Compete ao Tribunal de Justiça Policial a análise dos recursos interpostos contra punições aplicadas em decorrência de transgressões disciplinares.
P|Parágrafo único.|É atribuição da Presidência da Polícia DIC analisar os recursos apresentados contra decisões proferidas pelo Grupo de Operações Especiais (GOE).
A|Art. 47.|Ao Conselho Superior de Justiça compete a análise dos recursos interpostos contra decisões do Tribunal de Justiça Policial (TJP).
A|Art. 48.|Nos casos de penas administrativas, os recursos observarão a seguinte hierarquia:
I|I –|Primeira instância: Superintendência;
I|II –|Segunda instância: Comando;
I|III –|Terceira instância: Comando-Geral;
I|IV –|Instância final: Presidência.
A|Art. 49.|É de competência dos líderes, diretores, comandantes de divisões e diretorias a análise imediata dos recursos interpostos em face das punições aplicadas em decorrência de transgressões administrativas.
A|Art. 50.|Nos casos de penas ou situações administrativas ocorridas nas divisões e diretorias, os recursos seguirão a seguinte ordem de instâncias:
I|I –|Primeira instância: Liderança da divisão/diretoria;
I|II –|Segunda instância: Comando-Geral;
I|III –|Instância final: Presidência.
A|Art. 51.|Aos policiais da DIC são assegurados, em todos os níveis recursais, os direitos à ampla defesa e ao contraditório.
H|Cap. V · Das disposições finais
A|Art. 52.|Este documento está sob jurisdição do Departamento de Investigação Criminal, com todos os direitos reservados.
A|Art. 53.|O Regulamento Disciplinar poderá ser alterado pelo Tribunal de Justiça Policial.`;
const D5=`H|Título I · Das disposições preliminares
A|Art. 1º|Este Regulamento Administrativo estabelece normas, diretrizes e critérios para a organização, funcionamento e controle das atividades administrativas do Departamento de Investigação Criminal, bem como define os direitos, deveres, atribuições e responsabilidades dos policiais pertencentes aos grupos descritos neste regimento.
A|Art. 2º|O presente regulamento tem como finalidade assegurar:
I|I -|a padronização das condutas administrativas;
I|II -|a transparência nos processos decisórios;
I|III -|o respeito à hierarquia e à disciplina;
I|IV -|a segurança jurídica dos atos administrativos.
H|Título II · Dos princípios administrativos
A|Art. 3º|Toda atuação administrativa no âmbito da Polícia DIC será orientada pelos princípios previstos neste Regulamento, visando resguardar a integridade, a organização, a eficiência e a regularidade dos processos internos.
P|Parágrafo único.|Constituem princípios obrigatoriamente observados no exercício das funções administrativas:
I|I -|Hierarquia: respeito à estrutura hierárquica institucional, às competências dos cargos e às determinações superiores;
I|II -|Disciplina: cumprimento das normas, diretrizes e deveres administrativos estabelecidos pela corporação;
I|III -|Legalidade interna: observância integral dos documentos oficiais, regulamentos e procedimentos administrativos da Polícia DIC;
I|IV -|Eficiência: execução das atividades administrativas com organização, agilidade, qualidade e produtividade;
I|V -|Responsabilidade funcional: dever de responder pelos próprios atos, decisões e atribuições exercidas no âmbito administrativo;
I|VI -|Imparcialidade: atuação administrativa livre de favorecimentos pessoais, perseguições ou interesses individuais;
I|VII -|Moralidade e ética: adoção de conduta íntegra, respeitosa e compatível com os valores institucionais da corporação;
I|VIII -|Proporcionalidade: aplicação equilibrada e coerente de medidas administrativas, observando a gravidade de cada situação.
A|Art. 4º|A todo policial é garantido o direito de interposição de recurso contra punições administrativas, assegurados o contraditório e a ampla defesa no âmbito institucional.
H|Título III · Dos Oficiais Superiores
A|Art. 5º|Os Oficiais Superiores exercem função de execução operacional e apoio administrativo, devendo atuar como referência de conduta, desempenho, postura e comprometimento institucional perante seus subordinados e demais membros da Polícia DIC.
A|Art. 6º|Compete aos Oficiais Superiores o pleno conhecimento e cumprimento de suas atribuições administrativas e operacionais, observadas as competências específicas de cada posto hierárquico, bem como o respeito à hierarquia institucional, o cumprimento integral dos documentos oficiais da Polícia DIC e o zelo pela imagem, organização e credibilidade da corporação.
P|§ 1º|Compete aos Majores:
I|I -|Desempenhar suas funções com excelência nas divisões e diretorias;
I|II -|Manter conduta compatível com o posto;
I|III -|Participar das atividades organizadas pelo Corpo de Superiores, tais como eventos, dinâmicas e animações;
I|IV -|Possuir desempenho operacional acima da média, mantendo constância na distribuição de distintivos e promoções;
I|V -|Participar de forma ativa das reuniões semanais, bem como nos chats oficiais;
I|VI -|Atuar com proatividade na execução de funções;
I|VII -|Atuar no Posto de Vigilância, cumprindo a gestão do posto com autonomia;
I|VIII -|Acompanhar de forma direta e regular seus subordinados, fornecendo feedbacks acerca do desempenho e andamento de suas atividades;
I|IX -|Realizar a avaliação dos melhores da semana e melhores do mês de Praças e Oficiais.
P|§ 2º|Compete aos Tenentes-Coronéis:
I|I -|Demonstrar capacidade argumentativa e participação ativa nas reuniões semanais e debates institucionais;
I|II -|Atuar na mediação de conflitos em chats e na manutenção da disciplina institucional.
P|§ 3º|Compete aos Coronéis:
I|I -|Atuar como referência de liderança, organização e estabilidade institucional;
I|II -|Contribuir ativamente para o crescimento e desenvolvimento do departamento por meio de projetos, planejamentos, propostas e medidas administrativas.
P|§ 4º|As competências supracitadas são cumulativas, ou seja, um Coronel precisa demonstrar, para além do que é exigido no posto que ocupa, as características exigidas em postos anteriores.
A|Art. 7º|Constituem condutas impeditivas de promoção no âmbito dos Oficiais Superiores:
I|I -|Ausência operacional ou administrativa recorrente nos canais e chats oficiais da Polícia DIC;
I|II -|Descumprimento, negligência ou execução inadequada de ordens superiores;
I|III -|Postura incompatível com o posto ocupado;
I|IV -|Ausência de proatividade no exercício das funções;
I|V -|Comunicação inadequada, desorganizada ou incompatível com os padrões estabelecidos;
I|VI -|Negligência no acompanhamento, orientação ou reconhecimento dos subordinados;
I|VII -|Oscilação injustificada de desempenho;
I|VIII -|Prática de condutas que prejudiquem a organização, a disciplina ou a eficiência administrativa;
I|IX -|Desrespeito às normas previstas nos documentos oficiais do Departamento.
H|Título IV · Cap. I · Da Inspetoria (Corpo de Superiores)
A|Art. 8º|A Inspetoria é responsável pela fiscalização, acompanhamento e avaliação das atividades administrativas e operacionais, atuando diretamente na manutenção da disciplina, organização e eficiência institucional.
A|Art. 9º|O membro promovido à Inspetoria será submetido a período obrigatório de observação pelo prazo de 45 (quarenta e cinco) dias, durante o qual deverá demonstrar capacidade administrativa, liderança, estabilidade, comprometimento e aptidão para o exercício das atribuições inerentes ao cargo.
A|Art. 10|Compete à Inspetoria:
I|I -|Fiscalizar o desenvolvimento operacional e administrativo dos Oficiais Superiores, bem como realizar acompanhamentos regulares;
I|II -|Fiscalizar o andamento das atividades operacionais;
I|III -|Realizar a gestão dos policiais nos meios de comunicação oficiais;
I|IV -|Conduzir as reuniões semanais, promovendo alinhamento, debates e direcionamentos administrativos;
I|V -|Fiscalizar o quadro militares e ex-militares agraciados com honrarias;
I|VI -|Mediar conflitos internos, assegurando a manutenção da disciplina e da ética;
I|VII -|Cumprir com a meta operacional estipulada;
I|VIII -|Exercer liderança ativa na tomada de decisões;
I|IX -|Delegar acompanhamentos e funções aos Oficiais Superiores, quando necessário.
A|Art. 11|São critérios para aprovação no período de observação da Inspetoria:
I|I -|Presença ativa e constante em base e nos meios de comunicação oficiais;
I|II -|Participação assídua em reuniões e debates propostos;
I|III -|Capacidade argumentativa e imparcialidade nas análises;
I|IV-|Proatividade e espírito de liderança, demonstrando capacidade de conduzir debates e reuniões, organizando e alinhando decisões até o parecer final;
I|V -|Identificação precisa de condutas irregulares;
I|VI -|Postura profissional e disciplinada compatível com o cargo que ocupa;
I|VII -|Valorização e reconhecimento de seus subordinados, principalmente por meio de acompanhamentos e feedbacks constantes;
I|VIII -|Realização assertiva das atividades designadas por meio da escala semanal, bem como funções extras.
I|IX -|Cumprimento das metas operacionais;
A|Art. 12|Constituem motivos passíveis de reprovação na Observação:
I|I -|Ausência e/ou atividade inconstante, insuficiente para o cargo que ocupa;
I|II -|Falta de participação em reuniões e debates;
I|III -|Descumprimento constante de metas;
I|IV -|Erros recorrentes no exercício das atividades administrativas;
I|V -|Comunicação inadequada;
I|VI -|Postura incompatível com o cargo;
I|VII -|Ausência de reconhecimento dos subordinados;
I|VIII -|Incapacidade de identificar condutas irregulares;
I|IX -|Falta de colaboração nos acompanhamentos e feedbacks;
I|X -|Recorrência excessiva de justificativas;
I|XI -|Ausência nas atividades oficiais;
I|XII -|Instabilidade de desempenho.
H|Título IV · Cap. II · Da Superintendência (Corpo de Superiores)
A|Art. 13|A Superintendência exerce função de coordenação, supervisão administrativa e direcionamento.
A|Art. 14|O membro promovido à Superintendência será submetido a período obrigatório de observação pelo prazo de 21 (vinte e um) dias, durante o qual deverá demonstrar capacidade administrativa, liderança, estabilidade, comprometimento e aptidão para o exercício das atribuições inerentes ao cargo.
A|Art. 15|Compete à Superintendência:
I|I -|Supervisionar e acompanhar diretamente a atuação da Inspetoria;
I|II -|Realizar acompanhamentos regulares com Tenentes-Coronéis e Coronéis, bem como efetuar avaliações periódicas de desempenho e feedbacks;
I|III -|Realizar as atividades inerentes à Tutoria dos Executivos.
A|Art. 16|São critérios para aprovação no período de observação da Superintendência, além dos estabelecidos no Art. 12:
I|I -|Supervisionar diretamente as atividades realizadas pela Inspetoria;
I|II -|Propositura e condução estruturada de debates;
I|III -|Identificação e correção de falhas estruturais.
A|Art. 17|Constituem motivos passíveis de reprovação na Observação:
I|I -|Ausência e/ou atividade inconstante, insuficiente para o cargo que ocupa;
I|II -|Falta de participação em reuniões e debates;
I|III -|Descumprimento constante de metas;
I|IV -|Erros recorrentes no exercício das atividades administrativas;
I|V -|Comunicação inadequada;
I|VI -|Postura incompatível com o cargo;
I|VII -|Ausência de reconhecimento dos subordinados;
I|VIII -|Incapacidade de identificar condutas irregulares;
I|IX -|Falta de colaboração nos acompanhamentos e feedbacks;
I|X -|Recorrência excessiva de justificativas;
I|XI -|Ausência nas atividades oficiais;
I|XII -|Instabilidade de desempenho.
H|Título V · Do Comando
A|Art. 18|O Comando exerce a função de supervisão, coordenação administrativa e direcionamento operacional, sendo responsável pelo acompanhamento geral das atividades da Polícia DIC.
A|Art. 19|O membro promovido ao Comando será submetido a período obrigatório de observação pelo prazo de 45 (quarenta e cinco) dias, durante o qual deverá demonstrar capacidade administrativa, liderança, estabilidade, comprometimento e aptidão para o exercício das atribuições inerentes ao cargo.
A|Art. 20|Compete ao Comando:
I|I -|Supervisionar as atividades realizadas pelo Corpo de Superiores;
I|II -|Coordenar diretrizes administrativas e operacionais da Polícia DIC;
I|III -|Acompanhar e fiscalizar metas, projetos e atividades dos grupos hierárquicos inferiores;
I|IV -|Supervisionar sistemas administrativos e grupos oficiais do Habbo;
I|V -|Manter atualizados os documentos oficiais do system;
I|VI -|Conduzir alinhamentos, debates e decisões administrativas;
I|VII -|Auxiliar na manutenção e organização dos canais oficiais e planilhas de controle;
I|VIII -|Atuar no desenvolvimento administrativo, operacional e organizacional da Polícia DIC;
I|IX -|Acompanhar movimentações administrativas vinculadas ao system e demais chats utilizados pelo Departamento;
I|X -|Analisar condecorações, solicitações administrativas, licenças e alterações de nick registradas nos sistemas oficiais;
I|XI -|Realizar a avaliação, acompanhamento e deliberação dos membros em período de observação vinculados ao Corpo de Superiores;
I|XII -|Acompanhar e deliberar sobre as sugestões enviadas pelos militares no system;
I|XIII -|Efetuar a tutoria da Chancelaria.
A|Art. 21|São critérios para aprovação no período de observação do Comando, além dos previamente estabelecidos para o Corpo de Superiores:
I|I -|Iniciativa na resolução de problemas;
I|II -|Cumprir com as atividades solicitadas pelo Comando-Geral e Presidência;
I|III -|Acompanhamento assertivo do Corpo de Superiores;
I|IV -|Proatividade administrativa.
P|§ 1º|O não cumprimento dos critérios estabelecidos no art. 19 é motivo suficiente para a reprovação de um policial na observação do Comando.
P|§ 2º|Os Comandantes já aprovados no período de observação poderão ser rebaixados caso não cumpram com os critérios supramencionados.
H|Título VI · Do Comando-Geral
A|Art. 22|O Comando-Geral exerce a função de coordenação e direcionamento administrativo, sendo responsável pelo acompanhamento geral, supervisão das divisões e diretorias e fiscalização das atividades da Polícia DIC.
A|Art. 23|O Comando-Geral possui autoridade institucional para:
I|I -|Supervisionar e avaliar as atividades realizadas pela liderança das divisões e diretorias;
I|II -|Legislar em matérias relacionadas às divisões e diretorias;
I|III -|Intervir em divisões, diretorias e setores administrativos, quando necessário;
I|IV -|Revisar e, se necessário, revogar decisões de hierarquias subordinadas;
I|V-|Deliberar sobre casos omissos de natureza administrativa, com exceção das pautas de competência exclusiva da presidência.
H|Título VII · Da Presidência
A|Art. 24|A Presidência é responsável pela gestão geral da Polícia DIC. Sua atuação baseia-se em liderar todo o departamento, do operacional ao administrativo, agindo com visão estratégica na tomada de decisões para o crescimento constante da polícia.
A|Art. 25|O cargo de Comandante-Suplente é equivalente ao cargo de Supremo, porém passa por um período avaliativo de efetivação na Presidência, com critérios definidos pelo Vice-Presidente e o Presidente.
P|§ 1º|A utilização dessa posição ocorre apenas em situações necessárias, não sendo obrigatório o uso com todos os policiais cogitados ao cargo de Supremo.
P|§ 2º|A aprovação no período avaliativo concede, oficialmente, o cargo efetivo de Supremo e a permanência na Presidência da Polícia DIC. A reprovação, por outro lado, retorna o policial ao cargo de Comandante-Geral.
A|Art. 26|Compete à Presidência:
I|I -|Avaliar o desempenho operacional e administrativo dos integrantes do Comando e do Comando-Geral;
I|II -|Analisar projetos de competência da Presidência e sua viabilidade para o desenvolvimento da polícia;
I|III -|Estabelecer normas de impacto estrutural no departamento, bem como legislar acerca do fluxo de pagamentos e DICoins;
I|IV -|Coordenar o trabalho da Assessoria Presidencial e recrutar novos assessores quando necessário;
I|V -|Acompanhar entradas e saídas monetárias e gerenciar pagamentos;
I|VI -|Manter contato e boa relação com organizações aliadas;
I|VII -|Gerenciar produtos da loja;
I|VIII -|Aplicar melhorias funcionais no system.
H|Título VIII · Das transgressões administrativas
A|Art. 27|As transgressões administrativas serão classificadas conforme sua gravidade e impacto corporativo.
A|Art. 28|Considera-se transgressão leve:
I|I -|Conduta sem impacto relevante;
I|II -|Falhas ocasionais sem reincidência;
I|III -|Atraso na entrega das atividades.
A|Art. 29|Considera-se transgressão média:
I|I -|Reincidência de transgressões leves;
I|II -|Não realização das atividades escaladas ou solicitadas;
I|III -|Impacto administrativo limitado, sem prejuízo às atividades.
A|Art. 30|Considera-se transgressão grave:
I|I -|Reincidência de transgressões médias;
I|II -|Não cumprimento das atividades que interfiram nas atividades de terceiros;
I|III -|Prejuízo à disciplina ou hierarquia.
A|Art. 31|Considera-se transgressão gravíssima:
I|I -|Reincidência de transgressões graves;
I|II -|Conduta que comprometa a integridade do departamento;
I|III -|Abuso de função ou fraude.
A|Art. 32|Será aplicada repreensão ou apresentar-armas ao policial que praticar transgressão considerada leve, a depender da especificidade de cada caso.
A|Art. 33|Será aplicada notificação administrativa ou advertência ao policial que praticar transgressão considerada média, a depender da especificidade de cada caso.
A|Art. 34|Será aplicado rebaixamento ou demissão ao policial que praticar transgressão considerada grave, a depender da especificidade de cada caso.
A|Art. 35|Será aplicado banimento ao policial que praticar transgressão considerada gravíssima, a depender da especificidade de cada caso.
H|Título IX · Do sistema recursal
A|Art. 36|É garantido a todos os policiais da DIC o duplo grau de jurisdição nos recursos interpostos, respeitando os princípios da ampla defesa e do contraditório.
A|Art. 37.|Os recursos interpostos em face das punições aplicadas em decorrência de transgressões administrativas observarão a seguinte hierarquia:
I|I –|Primeira instância: Superintendência;
I|II –|Segunda instância: Comando;
I|III –|Terceira instância: Comando-Geral;
I|IV –|Instância final: Presidência.
P|§ 1º|Punições aplicadas em decorrências administrativas no âmbito interno de divisões e diretorias observarão a ordem disposta no Art. 50 do Regulamento Disciplinar.
P|§ 2º|Quando uma punição for aplicada por qualquer instância recursal, a primeira instância para eventual recurso será aquela imediatamente superior à instância responsável pela aplicação da punição. Art. 51. Aos policiais da DIC são assegurados, em todos os níveis recursais, os direitos à ampla defesa e ao contraditório.

A|Art. 38|Este documento está sob jurisdição do Departamento de Investigação Criminal, com todos os direitos reservados.
A|Art. 39|Os casos omissos, não previstos expressamente neste Regulamento, bem como situações passíveis de múltiplas interpretações, serão resolvidos diretamente pelo Comando da Polícia DIC.

A|Art. 40.|O Regulamento Administrativo poderá ser alterado pelo Comando, Comando-Geral e Presidência do Departamento de Investigação Criminal.`;

P|§ 3°|Para registrar a contribuição financeira, o VIP deve preencher o formulário fornecido pelos assessores no grupo do Telegram “[DIC/Apr] VIPs”. A pontuação será atribuída da seguinte forma: 80 pontos para cada Clube Arquiteto (CA) doado, 40 pontos para cada Habbo Club (HC) doado e 1 ponto para cada câmbio doado. Acesse o link do formulário clicando: [Aqui].

P|§ 5°|Em caso de empate na pontuação, o desempate será definido com base no somatório das horas operacionais realizadas no sistema de turnos.
A|Art. 10.|Os patrocinadores VIP Diamante terão direito aos seguintes benefícios exclusivos:
I|I -|Todos os benefícios dos níveis Bronze, Prata e Ouro;
I|II -|Redução no período de carência para solicitação de nova licença, de trinta (30) para quinze (15) dias, conforme artigo 96 da Legislação;
I|III -|Isenção da renovação no mês seguinte;
I|IV -|Emblema VIP Diamante para destacar sua exclusividade;
I|V -|50% de desconto na renovação de 1 amigo;
I|VI -|150 DICoins;
I|VII -|Capa personalizada no system;
I|VIII -|Medalha personalizada para o VIP Diamante;
I|IX -|Bot exclusivo do Top 1 patrocinador na base;
I|X -|Um visual completo livre, em concordância com a decisão da Assessoria;
I|XI -|Concessão de um troféu especial ao Top 1 e Top 2;
I|XII -|Envio automático de uma mensagem exclusiva sempre que um VIP Diamante entrar no quarto;
I|XIII -|Liberdade para realizar alterações no fim da missão, desde que respeitados os limites do bom senso.
A|Art. 11.|A classificação para o status VIP Diamante terá duração de 1 mês, sendo reavaliada a cada novo ciclo mensal, com base na avaliação das contribuições financeiras durante o período vigente e do ganhador do evento mensal.
H|Título IV · Da perda de benefícios · Arts. 12 e 13
A|Art. 12.|Os policiais que adquirirem os benefícios e entrarem no programa de Sistema VIP possuem diretrizes, possuindo duas penas para transgressores:
I|I -|Suspensão temporária;
I|II -|Perda total.
A|Art. 13.|Violação das regras do programa de Sistema VIP:
I|I -|Qualquer violação das regras internas do departamento, incluindo comportamento inadequado ou antiético, resultará na perda imediata dos benefícios;
I|II -|Dependendo da gravidade da violação, penalidades podem incluir advertências, suspensão temporária, ou exclusão permanente do sistema de patrocínio;
I|III -|Qualquer tentativa de fraude, abuso ou manipulação do sistema de patrocínio será investigada. Se comprovada, resultará na perda permanente dos benefícios e na exclusão do programa;
I|IV -|O departamento poderá buscar a recuperação de valores indevidamente obtidos através de fraude ou abuso;
I|V -|Patrocinadores serão notificados com antecedência sobre o reset dos benefícios via Telegram;
I|VI -|Se o patrocinador não efetuar o pagamento correspondente para renovar os benefícios após o reset, ele será retirado do sistema, reiniciando o programa, perdendo todos os benefícios conquistados;
I|VII -|Qualquer comportamento online que prejudique a imagem ou reputação do departamento resultará na revisão dos benefícios. Isso inclui atividades nas redes sociais e em plataformas de comunicação do departamento;
I|VIII -|Sanções podem variar desde advertências até a perda completa dos benefícios, dependendo da gravidade do incidente;
I|IX -|Patrocinadores que receberem feedback negativo consistente de outros membros ou superiores sobre as realizações dos eventos terão seus benefícios reavaliados, podendo estar sujeito a perda total ou suspensão temporária;
I|X -|O uso de visuais VIP é permitido, desde que não descaracterize o uniforme militar e nem atribua aparência de superior+ aos membros da hierarquia militar e executiva.
P|Parágrafo único.|Estas regras visam garantir a transparência e a integridade do sistema de patrocínio VIP, incentivando a participação ativa e o cumprimento das normas do departamento.
H|Título V · Das considerações finais
A|Art. 14.|A Presidência da Polícia DIC se reserva o direito de revisar e alterar as condições do Sistema VIP, incluindo os benefícios e os valores de contribuição, notificando os colaboradores previamente.
A|Art. 15.|Todas as alterações serão comunicadas através do chat exclusivo e por meio de canais oficiais do departamento.
A|Art. 16.|O Sistema VIP é gerido por Assessores da Presidência. Para entrar em contato com um membro da Assessoria Presidencial, você pode usar os seguintes meios:
I||Assessor Presidencial --gabriel: Telegram
I||Assessor Presidencial :Matheus:Mell: Telegram
I||Assessor Presidencial manovjunior: Telegram`;
const D7=`H|Título I · Disposições iniciais
A|Art. 1º|O Regimento dos Distintivos tem por finalidade estabelecer as diretrizes relativas ao sistema de distintivos, disciplinando suas características, formas de concessão e recebimento, prazos de vigência e demais particularidades aplicáveis a cada categoria de distintivo.
A|Art. 2º|O sistema de distintivos tem como objetivo reconhecer e recompensar adequadamente os esforços individuais dos policiais pertencentes ao Departamento de Investigação Criminal, promovendo a meritocracia, a coesão institucional e o comprometimento com os objetivos da Polícia.
H|Título II · Dos distintivos
A|Art. 3º|Existem dois tipos de distintivos: os Distintivos Administrativos e os Distintivos Operacionais, diferenciando-se entre si pela forma de concessão ao policial.
A|Art. 4º|A cada vinte (20) distintivos acumulados, será acrescido um (01) câmbio ao salário mensal do militar.
P|Parágrafo único.|Todos os distintivos serão convertidos em câmbios durante o pagamento oficial da Polícia DIC, sendo posteriormente zerados.
H|Título II · Cap. I · Dos distintivos administrativos
A|Art. 5º|Os Distintivos Administrativos possuem caráter cumulativo e são concedidos aos militares com base em seu desempenho operacional ou em sua atuação nas divisões das quais participam, como forma de reconhecimento pelo desempenho em uma das seguintes categorias:
I|I -|Melhores da Semana, em razão do destaque no ranking hierárquico ou de divisões;
I|II -|Melhores do Mês, em razão do destaque no ranking hierárquico ou de divisões;
I|III -|Meta semanal, em razão do cumprimento de metas e/ou do exercício de funções internas na divisão.
A|Art. 6º|O requerimento dos Distintivos Administrativos deverá ser realizado pela liderança da respectiva divisão dentro do prazo estipulado pelo Centro de Gestão e Finanças para cada modalidade de concessão.
P|Parágrafo único.|Decorrido o prazo estabelecido, o responsável estará sujeito às sanções previstas no Regulamento Disciplinar, em razão de negligência funcional.
A|Art. 7º|Os Distintivos Administrativos referentes aos Melhores da Semana de divisões serão distribuídos conforme a função interna ocupada pelo militar:
I|I -|Membros receberão vinte (20) distintivos;
I|II -|Fiscais receberão vinte e cinco (25) distintivos;
I|III -|Auxiliares receberão quarenta (40) distintivos.
P|Parágrafo único.|A liderança de cada divisão deverá realizar o requerimento dos Distintivos Administrativos relacionados aos Melhores da Semana até domingo, às 18h00, conforme o fuso-horário de Brasília.
A|Art. 8º|Serão distribuídos cem (100) Distintivos Administrativos aos militares que constarem entre os Melhores do Mês de divisões.
P|Parágrafo único.|A liderança de cada divisão deverá realizar o requerimento dos Distintivos Administrativos relacionados aos Melhores do Mês até as 18h00 do primeiro dia do mês subsequente, conforme o fuso-horário de Brasília.
A|Art. 9º|Serão distribuídos vinte (20) Distintivos Administrativos aos militares que constarem entre os Melhores da Semana hierárquico e cem (100) aos que constarem entre os Melhores do Mês hierárquico.
P|Parágrafo único.|O Corpo de Superiores deverá realizar o requerimento dos Distintivos Administrativos relacionados aos Melhores da Semana hierárquico até domingo, às 18h00, e aos Melhores do Mês hierárquico até as 18h00 do primeiro dia do mês subsequente, ambos conforme o fuso-horário de Brasília.
A|Art. 10.|Os Distintivos Administrativos relacionados ao cumprimento de metas e/ou ao exercício de funções internas na divisão serão distribuídos de acordo com a função ocupada pelo militar:
P|Parágrafo único.|A liderança de cada divisão deverá realizar o requerimento dos Distintivos Administrativos relacionados ao cumprimento de metas e/ou funções internas até as 18h00 do domingo subsequente, conforme o fuso-horário de Brasília.
A|Art. 11.|Os Distintivos Administrativos possuem validade compreendida entre um pagamento oficial e outro, sendo automaticamente zerados após a realização do pagamento mensal.
A|Art. 12.|Os policiais que não realizarem a distribuição dos distintivos dentro do prazo estipulado para cada categoria terão até as 23h59 do respectivo dia de registro da distribuição para apresentar justificativa na página do Centro de Gestão e Finanças no system.
P|Parágrafo único.|A ausência de justificativa acarretará a aplicação das punições previstas no art. 23 deste Regimento.
H|Título II · Cap. II · Dos distintivos operacionais
A|Art. 13.|Os Distintivos Operacionais são concedidos de um policial para outro como forma de reconhecimento pelo bom desempenho operacional demonstrado, especialmente quando houver destaque em algum dos setores da base.
A|Art. 14.|Os Distintivos Operacionais possuem validade compreendida entre um pagamento oficial e outro, sendo automaticamente zerados após a realização do pagamento mensal.
A|Art. 15.|Os Distintivos Operacionais deverão ser distribuídos exclusivamente nas áreas operacionais, sendo vedada sua concessão na sala VIP/ausência ou na área externa da base.
A|Art. 16.|Após a entrega do distintivo, o militar deverá realizar o respectivo requerimento por meio do Sistema de Distintivos oficial no prazo máximo de trinta (30) minutos, preenchendo todos os campos obrigatórios e anexando:
I|I -|Print da entrega do distintivo contendo o balão de fala;
I|II -|Mini perfil do militar beneficiado;
I|III -|Data e horário da concessão.
A|Art. 17.|Cada policial poderá conceder, no máximo, dez (10) Distintivos Operacionais por dia, sendo distrubuidos obrigatoriamente dois (2) distintivos por concessão.
P|§ 1°|A cada vinte (20) distintivos que o militar distribuir operacionalmente, será acrescido automaticamente dois (02) distintivos ao militar que acumulou como forma de bonificação.
P|§ 2°.|É vedado conceder Distintivos Operacionais ao mesmo militar mais de uma vez no mesmo dia.
A|Art. 18.|Cada militar poderá receber, no máximo, dez (10) Distintivos Operacionais diariamente.
A|Art. 19.|A prioridade para recebimento de Distintivos Operacionais será atribuída aos militares que estiverem atuando de forma assertiva em setores considerados prioritários.
P|Parágrafo único.|A partir do cargo de Capitão/Advogado, a prioridade de reconhecimento será destinada aos militares que estiverem atuando de forma assertiva nos comandos centrais, sem prejuízo da possibilidade de concessão em razão de destaque operacional em outras áreas ou batalhões.
A|Art. 20.|Conforme o militar ascende hierarquicamente e conclui os cursos disponibilizados pela Academia Policial, adquire gradualmente prerrogativas para concessão de Distintivos Operacionais:
I|I -|Capitão ou Cargo Executivo com CCO poderá conceder Distintivos Operacionais até a graduação de Tenente/Promotor;
I|II -|Major ou Cargo Executivo com CCO poderá conceder Distintivos Operacionais até a graduação de Capitão/Advogado;
I|III -|Tenente-Coronel ou Delegado com CCO poderá conceder Distintivos Operacionais até a graduação de Major/Administrador;
I|IV -|Coronel ou Investigador+ com CCO poderá conceder Distintivos Operacionais até a graduação de Tenente-Coronel/Delegado;
I|V -|Inspetoria poderá conceder Distintivos Operacionais até a graduação de Coronel/Investigador;
I|VI -|Superintendência poderá conceder Distintivos Operacionais até a Inspetoria;
I|VII -|O Comando poderá conceder Distintivos Operacionais a qualquer policial, independentemente da graduação, cargo ou posto ocupado.
P|Parágrafo único.|A prerrogativa de distribuição de Distintivos Operacionais inicia-se a partir do cargo de Cabo/Sócio.
H|Título III · Cap. I · Das disposições (Das punições)
A|Art. 21.|As punições são aplicadas pela liderança do Centro de Gestão e Finanças mediante bonificação realizada com violação de alguma das diretrizes estabelecidas neste regimento.
A|Art. 22.|O atraso, a falta, o erro ou a dúvida no registro dos Distintivos deve ser tratado diretamente com algum membro do Centro de Gestão e Finanças. A falta de justificativa em algum atraso poderá acarretar nas punições estabelecidas neste Regimento.
A|Art. 23.|As punições são progressivas e se dispõem, em ordem crescente, em: aviso, notificação e advertência escrita.
P|§ 1º|Um aviso será perdoado ao completar trinta (30) dias de sua vigência.
P|§ 2º|Uma notificação será perdoada em um dos seguintes casos:
J|I -|Ao completar quarenta e cinco (45) dias de sua vigência;
J|II -|Ao policial ser advertido pelo acúmulo de três (03) notificações.
H|Título III · Cap. II · Das bonificações negligentes
A|Art. 24.|São consideradas bonificações negligentes passíveis de receber um aviso:
I|I -|Bonificar um militar de uma graduação, posto ou cargo não permitido;
I|II -|Bonificar alguém que já alcançou o limite diário de dez distintivos;
I|III -|Exceder o seu próprio limite diário de dez distintivos a serem entregues;
I|IV -|Bonificar o mesmo policial mais de uma vez no dia;
I|V -|Preencher o formulário da entrega do distintivo com informações erradas;
I|VI -|Anexar imagem incompleta, sem todos os requisitos obrigatórios, como o balão de fala e o mini-perfil do militar;
I|VII -|Conceder Distintivos Operacionais e efetivar a entrega pelo formulário em mais de trinta (30) minutos após a entrega, sem justificativa adequada;
I|VIII -|Bonificar um militar na sala VIP/ausência ou na área externa da base;
I|IX -|Realizar a bonificação de Distintivos Administrativos (MM, MS e CMS) fora do prazo previsto, com erros de digitação ou deixar de enviá-los, sem justificativa plausível.
A|Art. 25.|São considerados motivos passíveis de receber uma notificação:
I|I -|O acúmulo de três avisos.
P|Parágrafo único.|O acúmulo de três (03) notificações gera uma advertência.
A|Art. 26.|Este documento poderá ser legislado pelo Comando, Comando-Geral e Presidência.`;
const D8=`H|Título I · Das normas gerais
A|Art. 1º|O Regulamento dos Uniformes estabelece as prescrições acerca dos uniformes e acessórios da Polícia DIC, regulando sua posse, uso e descrição geral.
A|Art. 2º|Todos os uniformes usados pelos militares do Departamento de Investigação Criminal devem estar em conformidade com este regulamento, sendo passível de punições para aqueles que não o seguirem.

A|Art. 9º|Os policiais que detenham qualquer uma das medalhas poderão utilizar o “boné de camuflagem” na cor preta e deverão anexar ao uniforme a “Medalha Militar 2”, com borda verde escuro e esfera amarela conforme a imagem abaixo. Ademais, o emblema da honraria também deve ser favoritado.

H|Arts. 18 a 30
A|Art. 18.|É permitido aos policiais pertencentes ao Corpo de Superiores utilizar os acessórios de cabeça listados no Art. 17, como chapéus e faixas.
A|Art. 19.|Os policiais que participam do sistema de VIPs possuem o benefício de utilizar visuais exclusivos. Para visualizar os visuais permitidos, clique aqui.
A|Art. 20.|O uso de cabelos com duas cores é permitido desde que a cor esteja presente neste documento e seja a mesma cor nas duas opções.

A|Art. 23.|O uso do walkie talkie é permitido exclusivamente na coloração preta, HC ou não-HC, com o rádio na cor preta ou branca, HC ou não-HC.
