H|Título VI · Das considerações finais
A|Art. 31.|Este Regulamento está sob jurisdição do Departamento de Investigação Criminal, com todos os direitos reservados.
A|Art. 32.|Compete ao Comando realizar as adaptações e modificações deste documento.
A|Art. 33.|Os artigos que compõem este Regulamento poderão ser modificados ou adaptados ao decorrer do tempo, sem aviso prévio.`;
const D9=`H|Cap. I · Introdução
A|Art. 1°|O Regimento dos Portadores (RP) expõe todas as normas e procedimentos exigidos aos militares oficiais e ativos do departamento que possuem direitos de mobílias.
A|Art. 2°|Tornar-se um dos detentores do direito de mobílias representa um grande voto de confiança concedido pelo Grupo de Operações Especiais, fruto do esforço e comprometimento exemplar do militar agraciado.
A|Art. 3°|Esse arquivo é confidencial, disponibilizado apenas aos portadores do Departamento de Investigação Criminal.
P|Parágrafo único.|O vazamento de qualquer informação disponibilizada por esse documento será penalizado de modo severo e inflexível.
H|Cap. II · Dos portadores de direitos
A|Art. 4º|É estritamente proibido aos portadores utilizarem os direitos caso não estejam operando como Oficial de Comando. No entanto, abre-se uma exceção para serpar, mutar, expulsar ou banir, dependendo da ocasião, se o militar que estiver no Oficial de Comando autorizar ou se o posto estiver vago, desde que comprovada a necessidade de realizar a punição.
P|Parágrafo único.|Estão salvos deste artigo o Grupo de Operações Especiais (GOE) e o Comando+.
A|Art. 5º|É obrigatório que o portador tenha a versão atualizado do Habbo Hotel, seja computador ou mobile.
A|Art. 6º|Todos os portadores estão sujeitos a avaliações ocasionais pelo Grupo de Operações Especiais e a sanções disciplinares caso obtenham rendimento abaixo do estipulado.
H|Cap. III · Título I · Boas práticas de gestão
A|Art. 7º|O Oficial de Comando (OC) é responsável pela administração honrosa e impecável do batalhão, atestando a organização e a eficiência do batalhão. É primordial que os portadores saibam como evitar tumulto e baderna, resolvendo situações de conflito ou ataque de maneira elegante, assim como maximizar o rendimento de cursos, novos recrutas e movimentação.
P|Parágrafo único.|É imprescindível assimilar que, apesar de ser o posto de máxima autoridade e exigir rigidez e firmeza durante o serviço, jamais deve ser utilizado o uso da falta de respeito. A cordialidade e a empatia são princípios indispensáveis e inerentes a um bom Oficial de Comando.
A|Art. 8º|Durante a atuação do portador como Oficial de Comando, para manter a ordem, organização e a fluidez do quartel, são definidas algumas regras gerais, as quais devem ser seguidas à risca:
I|I -|Não movimentar mobílias sem uma justificativa fundamentada. Caso desestruture algum local do quartel e não consiga resolver, deve procurar um Comandante, um membro do Grupo de Operações Especiais ou da Diretoria de Engenharia;
I|II -|Ampliar o evento do quarto sempre que a opção for disponibilizada, a fim de garantir visibilidade ao quartel no navegador. Caso não possua duckets suficientes, contate outro Portador;
I|III -|Assegurar que há ao menos um Guia disponível para aplicar aulas e treinamentos;
I|IV -|Manter um militar que possua as prerrogativas de operar no Posto de Vigilância atuando no posto, sendo de responsabilidade do Oficial de Comando fiscalizar o trabalho realizado nesse posto;
I|V -|Ajustar o turno para a ausência sempre que se dirigir ao respectivo setor. No entanto, é fundamental que respeite o limite de 10 (dez) minutos de afastamento para cada 1 (uma) hora de turno realizada no Oficial de Comando;
I|VI -|Exercer uma postura profissional enquanto estiver no posto, mantendo uma ortografia impecável, agilidade na organização do batalhão e pulso firme;
I|VII -|Serpar os policiais no lado externo da base que estiverem dançando ou badernando;
I|VIII -|Enviar, periodicamente, mensagens nos bate-papos oficiais no Telegram chamando os policiais para colaborarem com o movimento do batalhão. O chat de Guias também deve ser utilizado para solicitar a aplicação de aulas;
I|IX -|Solicitar um Vendedor de Cargos Executivos no bate-papo de portadores, caso surjam potenciais clientes interessados. Na mensagem, sempre especifique o nick do cliente e o cargo desejado;
I|X -|Autorizar, quando necessário, que guias apliquem treinamentos aos militares que acabaram de promover, devendo oficializar a liberação no devido tópico do chat de portadores, conforme previsto nas normas vigentes.
H|Cap. III · Título II · Da execução do sentido
A|Art. 9º|O comando “Sentido” é efetuado sempre que um policial equivalente ou superior ao militar de maior cargo/posto que estiver presente no quartel entrar e sentar-se no Pátio ou ocupar algum setor. Exige-se, portanto, uma atenção minuciosa e cautelosa por parte do Oficial de Comando.
P|§ 1°|O treinamento mínimo para que o policial possa ser prestigiado com o comando é o Curso de Formação de Superiores (CFS).
P|§ 2°|Todos os Chanceleres devem receber o comando, exceto quando possuir um membro equivalente à Presidência em base (Supremo, Vice-Presidente ou Presidente).
P|§ 4°|O comando deve ser aplicado apenas nos casos em que o policial entra pelo piso de acesso da área externa ou pelo comando de entrada, utilizado pela Presidência.
P|§ 5°|Nos contextos em que o militar se locomove à Sala de Comandos, ao Corredor Interno ou à Sala de Ausências, o comando é imediatamente cancelado.
P|§ 6°|O Sentido pode ser negado pelo superior via sussurro. Caso esse procedimento não ocorra, o Oficial de Comando deverá prosseguir com o “Sentido” normalmente.
P|§ 7º|Para que o mesmo policial receba o comando novamente, é necessário estar, ao menos, uma (01) hora fora do batalhão. Caso o policial entre em base antes do intervalo ser concluído, a contabilização do tempo é reiniciada.
P|§ 8°|Alunos do Curso de Operações Especiais (COEsp) não recebem o “Sentido”.
A|Art. 10.|O comando pode ser utilizado para realizar pronunciamentos ou para ordenar o batalhão, caso se constate mandatório pelo Oficial de Comando vigente ou seja solicitado pelo Comando ou Grupo de Operações Especiais.
A|Art. 11.|O Sentido deve ser executado conforme o passo a passo e as normas estabelecidas a seguir:
I|I -|Sentar-se no trono e utilizar o comando “!sino”;
I|II -|Dar um passo à frente e proclamar: “POLÍCIA DIC - SENTIDO!”. Variações desse modelo são permitidas, desde que sejam em caixa alta (caps lock) e sigam um padrão semelhante;
I|III -|Ajustar os policiais que prestaram o comando incorretamente, assegurando que todos estejam de pé, sem itens e sem balões de fala;
I|IV -|Assim que todos os militares prestarem o comando perfeitamente, deve-se direcionar o comando ao policial: “Sentido destinado à/ao {senhor(a)} {cargo/posto} {nick}”. Variações dessa mensagem são permitidas, exigindo somente que seja em caixa baixa (sem caps lock) e similar ao modelo citado.
P|§ 1°|Os policiais que estiverem atendendo um recruta na Recepção, na Salinha de Recrutas, no Fiscalizador de Recrutas ou que se encontrarem na Sala de Comandos não devem executar o comando.
P|§ 2°|Durante o procedimento descrito no terceiro inciso, caso um militar não responda ou demore para exercer o comando de forma correta, inicie a contagem regressiva de cinco segundos e, caso ele não se adapte, serpe-o.
P|§ 3°|Após concretizar o passo a passo por completo, você deverá retornar ao seu posto e prestar o Sentido também. Em seguida, deverão aguardar pelo “À vontade” para que o batalhão retorne às suas atividades normais.
P|§ 4°|É terminantemente proibido que a execução do comando demore mais de 20 (vinte) segundos. Caso esse tempo seja ultrapassado, todos os militares incorretos devem ser imediatamente serpados para que o “Sentido” possa prosseguir.
P|§ 5°|O militar que entrar no batalhão durante a execução do comando deve ser serpado e, assim que o Sentido findar, repreendido ou punido, se necessário. Porém, se isso acontecer com policial de cargo/posto equivalente ou superior ao militar que estiver recebendo o “Sentido”, o comando deve ser transferido ao policial que entrou;
P|§ 6°|O militar que estiver isento de prestar o comando por se encontrar na Sala de Comandos e sair desta ao longo da execução do "Sentido" deverá ser serpado.
P|§ 7°|O militar que estiver atendendo um recruta e terminar o procedimento, deverá prestar comando, caso não realize, deverá ser serpado.
A|Art. 12.|Aposentados também são recepcionados com o comando Sentido. No entanto, somente se tiver o posto equivalente ou sendo o maior superior presente em base.
H|Cap. III · Título III · Dos processos de migração
A|Art. 13.|O Departamento de Investigação Criminal possui duas bases, denominadas de Base 1 (B1) e Base 2 (B2), utilizadas conforme as circunstâncias.
A|Art. 14.|Os processos de migração englobam a abertura, transferência e fechamento do batalhão, os quais possuem características únicas. Sempre que um desses procedimentos for realizado, deve-se arcar à risca com os protocolos impostos neste documento.
A|Art. 15.|A abertura consiste no reinício do serviço diário. Para identificar quais policiais estão disponíveis, é permitido que toque o sino no Hall de Espera e questione quem está livre para trabalhar. São definidas as normas de aplicação:
P|§ 1°|Se estabelece o passo a passo para realizar a abertura do batalhão:
J|I -|Dirigir-se ao Hall de Espera do departamento;
J|II -|No Hall de Espera, deve-se subir no portão de permissão, tocar o sino (“!sino”) e informar que a base foi aberta aos militares presentes;
J|III -|No portão de permissão, localizado no canto esquerdo do hall, deve digitar o comando "!abrirb1" ou "!abrirb2", a depender do número dos policiais no hall;
J|IV -|Coletar um print do batalhão aberto, mostrando o navegador de quartos com a palavra "polícia" na barra de pesquisa, o comando "!ver" e a data e hora. Em seguida, encaminhar a imagem no chat de movimentação, conforme esse modelo;
J|V -|Ligar a base no System, com isso você será colocado automaticamente no turno do Oficial de Comando;
J|VI -|Enviar, no canal dos portadores de direitos o comando /abrirbase, no tópico "Comandos".
P|§ 2°|Para realizar o procedimento de abertura, é obrigatório que todos os critérios abaixo sejam atendidos:
J|I -|Ter, no mínimo, 1 (uma) hora de intervalo após o último fechamento;
J|II -|O horário vigente ser entre 06:00 e 23:00, considerando o horário de Brasília;
J|III -|Possuir, no mínimo, oito (8) militares disponíveis;
P|§ 3°|A abertura da B2 pode ser realizada com seis (6) militares, desde que tenha um aplicador ou guia disponível para aplicação da Aula de Formação.
P|§ 4°|A partir das 10:00, a realização dos procedimentos de abertura se fazem obrigatórios, descartando-se os requisitos previamente estabelecidos.
A|Art. 16.|O fechamento se configura como a desabilitação temporária dos serviços prestados no batalhão, exercido conforme o contexto. Consideram-se as regras de execução:
P|§ 1°|Se estabelece o passo a passo para realizar o fechamento:
J|I -|Coletar um print do batalhão aberto, mostrando o navegador de quartos com a palavra "polícia" na barra de pesquisa, o comando "!ver" e a data e hora. Em seguida, encaminhar a imagem no chat de movimentação, conforme esse modelo;
J|II -|Convocar os militares para o pátio e anunciar o fechamento, explicando o motivo;
J|III -|Utilizar o comando “!fechar” e se certificar de que todos os portões executivos estejam abertos;
J|IV -|Se retirar para o Hall de Espera e ligar o jogo disponibilizado no Hall de Espera, utilizando o comando “!on” no portão de permissão;
J|V -|Fechar a base no System;
J|VI -|Enviar, no canal dos portadores de direitos o comando /fecharbase, no tópico "Comandos".
P|§ 2°|Quando uma das condições abaixo for atendida, o fechamento se faz obrigatório:
J|I -|Após a meia-noite, o número de usuários no quarto for igual ou inferior a 08;
J|II -|Quando solicitado pelo Comando acima para a realização de um evento;
J|III -|Quando solicitado pelo Grupo de Operações Especiais.
A|Art. 17.|A transferência constitui-se pelo deslocamento de um batalhão para outro, conforme a demanda, como eventos, manutenções do quarto ou o baixo fluxo de policiais e recrutas. Exige-se o cumprimento dos preceitos a seguir:
P|§ 1°|Se estabelece o passo a passo para realizar a transferência da base:
J|I -|Coletar um print do batalhão aberto, mostrando o navegador de quartos com a palavra "polícia" na barra de pesquisa, o comando "!ver" e a data e hora;
J|II -|Convocar os militares para o pátio e anunciar a transferência, explicando o motivo;
J|III -|Executar o comando “!transferirb1” ou “!transferirb2”, de acordo com a base para a qual o contingente será enviado;
J|IV -|Realizar o fechamento do batalhão, movendo o tapete um quadrado para frente e utilizando o comando “!fechar”;
J|V -|Coletar um segundo print no batalhão para o qual os policiais foram transferidos, mostrando o navegador de quartos com a palavra "polícia" na barra de pesquisa, o comando "!ver" e a data e hora. Em seguida, encaminhar as imagens no chat de movimentação, conforme esse modelo.
P|§ 2°|Quando uma das condições abaixo for atendida, a transferência se faz obrigatória:
J|I -|A manutenção de uma das bases;
J|II -|Após às 22:00, se o número de policiais operando nos setores da Base 1 atingir um valor inferior a 10, transfere à Base 2;
J|III -|Após às 09:00, se o número de policiais operando nos setores da Base 2 atingir um valor superior a 9, transfere à Base 1;
J|IV -|A partir das 12:00 até às 21:59, determina-se a utilização da Base 1.
A|Art. 18.|O Comando e o Grupo de Operações Especiais possuem autonomia para ordenar que qualquer processo de migração seja realizado, mesmo quando os critérios previamente estabelecidos não forem cumpridos integralmente.
A|Art. 19.|A utilização dos dois quartéis simultaneamente é vedada, salvo os contextos de pagamento, em eventos ocasionais ou durante missões elaboradas pelo Grupo de Operações Especiais.
H|Cap. III · Título IV · Dos relatórios de banimentos
A|Art. 20.|O banimento aplicado pelos portadores pode ter a duração máxima de um (01) dia. É estritamente proibido banir permanentemente os usuários, exceto nos seguintes casos:
I|I -|Pelo Grupo de Operações Especiais (GOE), quando a segurança da base ou qualquer outra dependência assim o justifica;
I|II -|Pelo Comando ou Presidência em qualquer circunstância que justifique;
I|III -|Os policiais que jogam pelo celular devem solicitar apoio de outro portador, se necessário, já que não conseguem efetuar banimentos temporários. Caso não tenha ninguém disponível para ajudá-los e se faça comprovadamente necessário, podem banir permanentemente e relatar o ocorrido ao Grupo de Operações Especiais, além de postar o relatório.
P|Parágrafo único.|Somente o Grupo de Operações Especiais e o Comando têm a autoridade para permitir que um portador exceda a permissão e aplique um banimento permanente.
A|Art. 21.|Após realizar qualquer banimento, é imprescindível a postagem do Relatório de Banimento (RB), localizado no tópico dentro do chat de Direitos. Caso possua qualquer dificuldade ou cometa algum equívoco durante o processo, contate um membro do Grupo de Operações Especiais.
H|Cap. III · Título V · Dos acessos aos aliados
A|Art. 22.|A Aliança Revolucionária do Tratado Militar (ARTM) é composta pelos departamentos RCC, DME e pela organização GOPH, sendo considerados nossos únicos aliados até o momento.
A|Art. 23.|O Grupo Organizado de Polícia Habbiana (GOPH), ocasionalmente, realiza rondas, as quais buscam estabilizar a Polícia no navegador de quartos. A entrada do órgão mencionado é permitida caso o número de funcionários realizando a ação seja igual ou superior a 4 (quatro).
A|Art. 24.|A entrada dos demais integrantes (RCC e DME) é permitida aos Conselheiros da aliança mencionada. Ademais, para que acessem o batalhão, é obrigatório que estejam com o emblema do tratado como favorito.
A|Art. 25.|Apesar dos acessos concedidos, também compreende-se como proibido aos aliados:
I|I -|Auxiliar nas atividades do batalhão;
I|II -|Permanecer em qualquer local que não seja a Sala de Ausências;
I|III -|Provocar desorganização e tumulto no quartel.
H|Cap. III · Título VI · Dos sistemas de prioridades
A|Art. 26.|O Sistema de Prioridades foi elaborado para manter um fluxo justo e eficiente de portadores no Oficial de Comando. Por meio dessa metodologia, são estabelecidas 4 (quatro) prioridades para que todos os militares consigam assumir o posto e arcar com a carga horária atribuída.
P|§ 1º|A primeira prioridade entrega a preferência aos policiais que estão online no jogo e em atividade no batalhão. Neste caso, o Oficial de Comando que necessitar ser assumido deverá abrir o bate-papo de portadores e realizar a chamada, definindo o horário que precisa sair e marcando todos os policiais presentes na base.
P|§ 2º|A marcação dos policiais presentes em base deverá ser realizada juntamente com o pedido de retirada do posto, no chat de portadores.
P|§ 3º|A segunda prioridade engloba os portadores que ainda não atingiram suas metas. Neste caso, o Oficial de Comando que necessitar ser assumido deverá especificar no bate-papo de portadores que a prioridade é daqueles que ainda não arcaram com a carga horária estipulada.
P|§ 4º|A terceira prioridade é destinada aos policiais que se encontram offline do jogo, ou fora das dependências da polícia, e desejam assumir.
P|§ 5º|A quarta prioridade é direcionada aos militares agraciados com isenção de meta. Estão incluídos nesse critério a Coordenação do Grupo de Operações Especiais e o Comando+.
A|Art. 27.|Caso dois policiais que se encaixem na prioridade estabelecida se disponibilizem, a preferência é de quem se manifestou primeiro. Se acontecer desse policial não comparecer no horário estipulado no período de 5 (cinco) minutos, o posto é transferido ao segundo policial que se manifestou, e assim por diante.
A|Art. 28.|Os portadores poderão solicitar a assunção do posto ao Oficial de Comando vigente a partir da quinta-feira, desde que não tenham cumprido a sua meta integralmente. Nesse contexto, a transferência do comando se faz obrigatória.
H|Cap. III · Título VII · Dos procedimentos emergenciais
A|Art. 29.|O acidente se configura como um acontecimento imprevisto e indesejável que resulta em danos de maneira não intencional.
P|Parágrafo único.|Hodiernamente, existe um padrão reincidente de acidente emergencial em decorrência da falha de wireds, havendo necessidade de resposta imediata.
I|I -|Procedimento Hel (2H), utilizado quando é detectada a queda dos mobis de programação do quarto, tendo uma duração estimada em 10 (dez) minutos. Durante este interstício, tornam-se inutilizáveis os sistemas internos como anti-flood, anti-afk e remoção por meio da serpa.
J|a)|Relate o ocorrido no chat de direitos e comunique imediatamente o Grupo de Operações Especiais, mencionando todos os membros em sua mensagem de aviso através do comando “/goe” no Telegram;
J|b)|Organize o setor das Alavancas, visto que, com a inutilização do piso seta, a entrada ao batalhão será por meio deste. Caso não haja membros do Grupo de Operações Especiais presentes, contate um Inspetor ou superior para que fique responsável pela conferência dos militares através do system;
J|c)|Os recrutas da Recepção devem ser destinados às aulas após a conclusão do alistamento, sem necessidade de encaminhamento ao Fiscalizador de Recrutas ou Salinha de Recrutas. Com a verificação dos requisitos realizada, posicione o teleporte da Sala de Acessos atrás do recruta, aguardando sua entrada. Em seguida, disponha o teleporte para que o Guia possa realizar a aplicação da Aula de Formação. Caso não haja membros do Grupo de Operações Especiais presentes, procure um Inspetor ou superior para que fique responsável pela conferência dos recrutas. Lembre-se que a entrada convencional é bloqueada por blocos invisíveis.
A|Art. 30.|A emergência é um termo utilizado para descrever um acontecimento que surge com a má intenção de provocar ações prejudiciais ao departamento, as quais visam causar desestabilizar ou destruir as estruturas internas.
A|Art. 31.|No presente, existem duas categorias de ataque e seus respectivos procedimentos de resposta:
P|§ 1°|Os ataques de direitos se constituem como investidas internas que envolvem o abuso da prerrogativa de direitos no batalhão, movimentando mobílias de modo irregular e/ou realizando kicks, mutes e banimentos sem autorização.
J|I -|Procedimento Forseti (1F), utilizado durante ataques isolados e de natureza leve, ou seja, movimentando apenas uma ou duas mobílias, se configurando como uma brincadeira de mau gosto ou uma tentativa de prejudicar o turno do Oficial de Comando vigente.
K|a)|Use o comando “!ver” e tire uma captura de tela imediatamente;
K|b)|Toque o sino da base e peça para que os portadores presentes parem de utilizar direitos de forma irregular;
K|c)|Após transmitir o aviso, envie a captura de tela ao Grupo de Operações Especiais e explique o ocorrido;
K|d)|Assegure a estabilidade do batalhão.
J|II -|Procedimento Tyr (1T), utilizado durante ataques de natureza moderada, identificados pela reincidência dos incidentes de natureza leve ou pela utilização de kicks, mutes e banimentos sem o consentimento do Oficial de Comando.
K|a)|Use o comando !ver e tire uma captura de tela imediatamente;
K|b)|Efetue o banimento de 1 (uma) hora de todos os policiais que possuem direitos presentes no quartel e informe o motivo e os nomes no bate-papo dos portadores. O banimento de membros do Grupo de Operações Especiais e da Presidência é estritamente proibido;
K|c)|Encaminhe a captura de tela ao Grupo de Operações Especiais e explique o ocorrido;
K|d)|Assegure a estabilidade do batalhão.
J|III -|Procedimento Odin (1O), utilizado durante ataques de destruição intensos, os quais, em primeira instância, banem todos os portadores do batalhão, portanto, você não terá nenhum procedimento para realizar em base.
K|a)|Informe imediatamente o Grupo de Operações Especiais e a Presidência, marcando todos em sua mensagem através dos comandos “/goe” e “/presidencia” e enviando um aviso no privado de todos que estiverem mais acessíveis no momento;
K|b)|Chame os policiais ao Hall de Espera em todos os chats do departamento e acalme os militares, evitando o pânico e o alarmismo.
P|§ 2°|Os ataques de flood são compreendidos como investidas externas que abrangem a poluição visual de chat por meio de mensagens exageradamente grandes e caracteres/palavras inconvenientes.
J|I -|Procedimento Forseti (2F), utilizado durante ataques apartados e leves, os quais envolvem apenas uma ou duas mensagens grandes em capslock.
K|a)|Basta silenciar o usuário por dez (10) minutos. Caso o usuário utilize de discursos de intolerância em suas frases ou seja uma conta que está sendo reincidente neste ato, capture uma print, efetue o banimento de 1 (um) dia e encaminhe a imagem ao Grupo de Operações Especiais.
J|II -|Procedimento Tyr (2T), utilizado quando é constatada a insistência do ataque, onde o usuário entra com diversas contas, inúmeras vezes, para realizar um flood mais acentuado, considerado como uma investida de natureza moderada.
K|a)|Ligue o anti-flood utilizando a instrução “!fp”, de acordo com o nível de intensidade. Não se esqueça de desligar após o fim dos ataques utilizando o comando "!fp off";
K|b)|Utilize o comando "!fp 1" em situações de ataques leves, quando o nível padrão do sistema de anti-flood não for suficiente;
K|c)|Aplique o comando "!fp 2" para ataques de natureza moderada, onde o comando anterior não estiver mitigando os danos causados pelos invasores;
K|d)|Habilite o comando "!fp 3" apenas em situações críticas ou em pronunciamentos do Comando ou da Presidência, desativando-o imediatamente após o término do evento;
K|e)|Capture a tela dos avatares realizando o ataque e encaminhe ao Grupo de Operações Especiais;
K|f)|Caso a conta consiga contornar o sistema de anti-flood, efetue o banimento permanente do usuário, informando posteriormente ao Grupo de Operações Especiais.
J|III -|Procedimento Odin (2O), utilizado quando o atacante é experiente e utiliza de ferramentas de terceiros para floodar mensagens e auxiliar no ataque, como scripts, ou nas ocasiões em que o ataque persiste por mais de 10 (dez) minutos.
K|a)|Permaneça executando 2T conforme o seu alcance;
K|b)|Contate o Grupo de Operações Especiais, marcando os respectivos integrantes através dos comandos “/goe”, e solicitando urgência no incidente.
A|Art. 32.|Enquanto atuando como Oficial de Comando, ao identificar um portador utilizando de seus direitos de mobílias para seu próprio benefício no trabalho operacional (como abrir portões executivos) ou para realizar brincadeiras inconvenientes, ordene-o a se autopunir, apresentando armas por 5 (cinco) minutos, e explique que sua atitude foi incorreta, além de relatar o caso ao Grupo de Operações Especiais. Caso ele persista, inicie a realização dos procedimentos emergenciais.
A|Art. 33.|Se você for informado sobre um ataque de direitos e não estiver conectado à sua conta do Habbo Hotel, evite entrar no jogo. Fazer isso pode aumentar suas suspeitas, portanto, não contribua para a criação de evidências contra você mesmo.
H|Cap. III · Título VIII · Da meta semanal
A|Art. 34.|Aos portadores, é estabelecida a meta de 5 (cinco) horas semanais como Oficial de Comando.
P|Parágrafo único.|Devido ao alto número de funções específicas desempenhadas, reduções de carga horária podem ser aplicadas conforme a necessidade.
A|Art. 35.|Os militares que não conseguirem atingir o número de horas estipulado no decorrer da semana devem, obrigatoriamente, postar a justificativa até às 23:59 de sábado, considerando o horário de Brasília.
A|Art. 36.|Devido ao alto número de funções desempenhadas, isenção e redução de meta são aplicadas para determinados policiais:
I|I -|Policiais que ocupam a Inspetoria e a Superintendência possuem isenção;
I|II -|Coordenadores do Grupo de Operações Especiais possuem isenção;
I|III -|Policiais que fazem parte da Assessoria Presidencial possuem isenção;
I|IV -|Militares do Grupo de Operações Especiais possuem 3 horas de meta.
P|Paragrafo único.|A Inspetoria e Superintendência poderão ter meta em determinados períodos, conforme definido pelo Comando+.
A|Art. 37.|A utilização indevida dos direitos fora do Oficial do Comando resultará na amplificação da carga horária em 2 (duas) horas de todos os portadores que não possuem isenção de meta enquanto o culpado não se revelar.
A|Art. 38.|Apesar das isenções fornecidas, é fundamental que, durante períodos que apresentam uma baixa disponibilidade por parte dos portadores, todos colaborem com a atuação no Oficial de Comando.
H|Cap. III · Título IX · Da liberdade individual
A|Art. 39.|Um dos artigos presentes no primeiro capítulo da Legislação, que infere a respeito da liberdade individual, aplica-se, na prática, no contexto do Oficial de Comando. Todos os militares são totalmente livres, ninguém é obrigado a sempre estar presente no quartel enquanto estiver online no Habbo, desde que apresente um rendimento satisfatório conforme seu cargo, posto ou graduação.
A|Art. 40.|É proibido obrigar qualquer policial a assumir o Oficial de Comando caso esteja online no Habbo e fora do exercício de suas funções. O respeito à liberdade individual é superior a qualquer ideal coletivo que o departamento prega.
H|Cap. IV · Das transgressões administrativas
A|Art. 41.|A negligência com as normas e procedimentos estabelecidos por este documento se configura como transgressão administrativa.
I|I -|São transgressões passíveis de notificação:
J|a)|A ineficácia ou imprevidência durante a gestão do batalhão como Oficial de Comando;
J|b)|Atrasar ou não postar o relatório de justificativa caso não atinja a meta semanal;
J|c)|Mover mobílias de forma irregular, atuando como Oficial de Comando ou não;
J|d)|Não postar os processos de migração, relatórios de banimentos ou registros de liberação de Guias;
J|e)|Realizar os processos de migração, procedimentos emergenciais ou o sistema de prioridades erroneamente;
J|f)|Postar os processos de migração, os relatórios de banimentos ou registros de liberação de Guias incorretamente;
J|g)|Conceder, assumir ou segurar o Oficial de Comando mediante solicitação feita fora do chat oficial de Portadores;
J|h)|Não comunicar no chat oficial de Portadores que foi para ausência durante o turno no Oficial de Comando;
J|i)|Floodar outros Portadores com os avisos do sistema de clique;
J|j)|Ausentar-se temporariamente do posto, ainda que mediante solicitação para que outro portador o mantenha, com a finalidade de realizar funções administrativas ou operacionais paralelas.
I|IV -|São transgressões passíveis de banimento temporário ou permanente do departamento:
J|a)|Aproveitar-se dos direitos de mobília para obter qualquer tipo de benefício próprio;
J|b)|Utilizar da prerrogativa para proferir ataques contra a instituição;
J|c)|Modificar Variáveis ou Sistemas de Wireds que possam comprometer o funcionamento da base ou prejudicar alguém.
A|Art. 42.|As notificações possuem um prazo de 45 (quarenta e cinco) dias de validade. Após o término desse intervalo, são automaticamente expiradas.
P|§ 1°|Para qualquer notificação recebida, o militar recebe um prazo de até 7 (sete) dias para recorrer à punição, em primeira instância, à Coordenação e Comando do Grupo de Operações Especiais.
P|§ 2°|É direito do Portador ter métodos para recorrer à notificação, mas o envio do pedido de reavaliação não garante a remoção da punição.
H|Cap. V · Das considerações finais
A|Art. 43.|Este documento disponibiliza um padrão a ser seguido por todos os portadores de direitos do Departamento de Investigação Criminal. Sendo assim, qualquer negligência será passível de punição, a depender do grau de irregularidade.
A|Art. 44.|As alterações deste documento são de incumbência do Grupo de Operações Especiais e devem ser realizadas com justificativa e transparência.
A|Art. 45.|Este documento encontra-se sob a jurisdição do Grupo de Operações Especiais e da Presidência Militar do Departamento de Investigação Criminal.`;
const D10=`H|Introdução
A||Ao tornar-se Portador de Direitos, será necessário utilizar alguns comandos para facilitar e agilizar o trabalho desempenhado. Este documento apresentará todos os comandos, suas respectivas funções e os locais onde devem ser utilizados.
H|Base Principal · No trono · Comandos que devem ser proferidos sentados no trono
A|!oc|Para ativar os avisos no Oficial de Comando;
A|!pv|Para ativar os avisos do Posto de Vigilância;
A|!ob|Concede os direitos do Oficial de Base;
A|!sair|Para desativar os avisos em base, quando sair do O.C;
A|!tirarpv|Para retirar os avisos do militar no Posto de Vigilância;
A|!verpv|Lista de todos os policiais que podem assumir o Posto de Vigilância;
A|!ver|Utilizado no envio da movimentação, serve para mostrar quais os portadores estão presentes em base;
A|!sino|Quando desejar tocar o sino;
A|!avisos|Lista todos os policiais que possuem avisos ativos no quarto.
A|!organizaron|Ativa o sistema de organização do Sentido para virar os policiais em direção ao pátio.
A|!organizaroff|Desativa o sistema de organização.
A|!kick1|Envia o policial ou civil para os bancos da área externa.
A|!kick2|Muta e envia para os bancos da área externa, mantendo o baderneiro congelado.
A|!unmute|Para cancelar o mute causado por sistemas de segurança da base.
A|!sorteioon|Puxa o bot "Sorteador" para realizar o sorteio;
A|!sortear|O bot faz o sorteio do escolhido em base;
A|!sorteiooff|Encerra o bot.
H|Base Principal · Tapete · Comandos que devem ser proferidos após colocar o tapete do Oficial do Comando um bloco à frente
A|!abrir|Quando desejar abrir a base;
A|!fechar|Quando desejar fechar a base;
A|!transferirb1|Quando desejar transferir a base secundária para a base principal.
A|!transferirb2|Quando desejar transferir a base principal para a base secundária.
H|Hall de Espera · Dirija-se ao portão de permissão e digite
A|!sino|Quando desejar tocar o sino;
A|!abrirb1|Quando desejar abrir a Base Principal;
A|!abrirb2|Quando desejar abrir a Base Secundária;
A|!on|Quando realizar o fechamento, utilize o comando para abrir o jogo do Hall;
H|Sistema de Mute do Hall de Espera
A|!muteon|Quando desejar ligar o sistema de mute;
A|!muteoff|Quando desejar desligar o sistema de mute.
P|Procedimentos:|
I|I.|Subir no portão de permissão e acionar o comando "!muteon";
P|Observação:|Qualquer pessoa que estiver fora dos grupos de Praças, Corpo Executivo e Acesso à Base, será removida ao enviar qualquer mensagem. Isso ajudará a evitar ataques de flood ou palavreados inadequados por parte dos baderneiros.
I|II.|Assim que os floods cessarem e as ameaças forem neutralizadas, basta o Portador digitar o comando "!muteoff" para desativar.
H|Sistema de Kick do Hall de Espera
A|!kickon|Quando desejar ligar o sistema de kick;
A|!kickoff|Quando desejar desligar o sistema de kick.
P|Procedimentos:|
I|I.|Subir no portão de permissão e acionar o comando "!kickon";
I|II.|Clicar no indivíduo que deseja kickar do quarto;
I|III.|Após a neutralização das ameaças, desative o sistema com o comando "!kickoff".
H|Sistema de Anti-Flood (Base Principal)
A|!fp|O Sistema de Prevenção de Flood (FP) tem o objetivo de proteger a base principal contra ataques de flood, contendo níveis de controle ajustáveis conforme a gravidade dos ataques. O comando "!fp + número" deve ser dado após o tapete ser puxado um bloco à frente, desligue cada nível dessa mesma forma, utilizando o comando "!fp off". Suas aplicações estão descritas a seguir:
A|I. Nivel 1 -|Ataques leves
I|a)|Ativado pelo comando "!fp 1";
I|b)|Deve ser utilizado para conter ataques de menor intensidade;
I|c)|Expulsa usuários que digitam fora dos bancos e que não pertencem aos grupos autorizados (Praças, Acesso à Base e Corpo Executivo).
A|II. Nivel 2 -|Ataques moderados
I|a)|Ativado pelo comando "!fp 2";
I|b)|Aplicado quando o nível 1 não for o suficiente para conter ataques;
I|c)|Expulsa usuários que:
J|1.|Digitam fora dos bancos, exceto nos rollers de alistamento;
J|2.|Possuem pontuação de conquista inferior a 2000;
J|3.|Não pertencem aos grupos autorizados.
A|III. Nível 3 -|Situações críticas
I|a)|Ativado pelo comando "!fp 3";
I|b)|Deve ser utilizado exclusivamente durante pronunciamentos importantes, como os do Comando ou Presidência;
I|c)|Expulsa todos os usuários fora da base, exceto aqueles que estão presentes nos grupos "Acesso à Base" e "Corpo Executivo".
I|d)|Deve ser desativado imediatamente após o término do evento ou pronunciamento.
P|Observação:|Avise no chat de Direitos ao ativar qualquer nível de Prevenção de Flood.
H|Corredor Interno
A|!pag|Para ativar o teleporte do pagamento.
A|!poriginal|Para arrumar o corredor e retornar o teleporte do pagamento.
H|Sala de Comandos Externa
A|!kickon|Utilize este comando quando desejar kickar alguém, digite uma vez e clique no personagem para expulsá-lo.
A|!kickoff|Para desligar o comando kick.`;
const D11=`H|Cap. I · Das disposições iniciais
A|Art. 1°.|Este regimento estabelece a composição e a competência das seções do Tribunal de Justiça Policial, regula o processo e o julgamento dos feitos que lhes são atribuídos pela Legislação do Departamento de Investigação Criminal.
A|Art. 2°.|O Tribunal de Justiça Policial (TJP) é um órgão jurisdicional permanente do Departamento de Investigação Criminal, com a finalidade de julgar e decidir questões relacionadas às transgressões disciplinares e administrativas, garantindo a justiça e a ordem nas ações relacionadas à atuação do policial da Polícia DIC.
P|§ 1º.|Compete ao TJP a salvaguarda dos documentos oficiais, cabendo ao Plenário, por maioria de seus membros e com a anuência do Conselho Superior de Justiça, aprovar alterações legislativas.
P|§ 2º.|Seus membros possuem a autonomia para julgar e aplicar sanções disciplinares a todos os policiais, de Soldado a Comandante, em virtude da lei.
P|§ 3º.|Seus membros possuem a autonomia para aplicar sanções disciplinares por flagrante, por meio de decisão monocrática, com restrição aos policiais que ocupam cargos de Soldado a Superintendente, na hierarquia militar, e Sócio a Líder-Executivo medalhistas de prata, na hierarquia executiva, em virtude da lei.
P|§ 4º.|É vedada a participação dos integrantes do Tribunal de Justiça Policial em discussões jurídicas sobre transgressões disciplinares de caráter voluntário com qualquer pessoa que não pertença ao órgão, sendo essa medida estabelecida para garantir a integridade e a imparcialidade no âmbito jurídico.
A|Art. 3°.|O Tribunal de Justiça Policial tem como objetivos principais:
I|I.|Assegurar a justiça e a equidade no julgamento das transgressões disciplinares;
I|II.|Promover a transparência e a integridade nas decisões e processos;
I|III.|Proteger os direitos dos membros do Departamento de Investigação Criminal;
I|IV.|Fomentar a disciplina e o profissionalismo nos meios relacionados à instituição;
I|V.|Garantir a ordem e a efetividade institucional;
I|VI.|Estimular a melhoria contínua dos processos e políticas disciplinares do departamento.
A|Art. 4°.|O Tribunal de Justiça Policial atuará em conformidade com os documentos oficiais do Departamento de Investigação Criminal, respeitando os direitos fundamentais dos indivíduos e observando o devido processo legal em todas as suas atividades.
H|Cap. II · Da composição do tribunal
A|Art. 5°.|O Tribunal de Justiça Policial é composto por três esferas de atuação independentes e autônomas, com atribuições especificadas neste documento:
I|I.|Juízes [J.TJP];
I|II.|Promotores [MPJP];
I|III.|Defensores [D.TJP].
A|Art. 6°.|O Tribunal é composto, em sua capacidade máxima, por três Juízes, quatro Promotores, quatro Defensores, dois Analistas Judiciários e um Presidente.
A|Art. 7°.|O Presidente do Tribunal de Justiça Policial é escolhido pela Presidência do Departamento de Investigação Criminal, sendo necessário ser membro da Inspetoria acima, dentro dos seus critérios.
A|Art. 8°.|A seleção de Juízes, Promotores e Defensores será feita por meio de convocação direta do Presidente do Tribunal, com a aprovação do Conselho Superior de Justiça.
A|Art. 9°.|Todos os membros do Tribunal, ao assumirem suas funções, deverão prestar compromisso formal de cumprir e respeitar o Regimento Interno e as normas estabelecidas para a atuação.
H|Cap. III · Das prerrogativas dos integrantes
A|Art. 10.|Os membros do Tribunal de Justiça Policial (TJP) possuem prerrogativas adicionais no âmbito da Polícia DIC e no Tribunal de Justiça Policial, conforme detalhado abaixo:
I|I.|Os integrantes do TJP somente poderão ser submetidos a sanções disciplinares pelo Presidente do Tribunal de Justiça Policial ou pelos membros do Conselho Superior de Justiça (CSJ). Entretanto, Comandantes acima poderão aplicar punições imediatas em casos de flagrante delito, desde que informem imediatamente ao Presidente do Tribunal de Justiça Policial ou ao Conselho Superior de Justiça para que sejam tomadas as medidas cabíveis, conforme a legislação vigente.
I|II.|O Presidente e os demais membros do Tribunal de Justiça Policial devem utilizar, como símbolo de identificação, uma medalha adquirida na loja (Medalha Militar 3), nas cores verde e branca, bem como o emblema do TJP como favorito e missão, de acordo com sua ocupação interna;
I|III.|Os integrantes do TJP têm autoridade para adotar medidas disciplinares, previstas na Legislação e no Regulamento Disciplinar da Polícia DIC, em face de qualquer policial, independentemente do posto ou graduação, desde Soldado até Comandante, por meio dos processos jurídicos ou quando autorizados diretamente pelo Presidente do órgão;
I|IV.|Os integrantes do TJP têm autoridade para adotar medidas disciplinares, previstas na Legislação e no Regulamento Disciplinar da Polícia DIC, em face de qualquer policial, restringindo aos policiais, Soldado a Superintendente, na hierarquia militar, e Sócio a Líder-Executivo medalhistas de prata, por meio de decisão monocrática, delitos cometidos e apurado em flagrante;
I|V.|Os Juízes do TJP possuem direitos de administração em grupos internos;
I|VI.|É garantido aos integrantes do TJP o poder de conceder dispensas, tanto para si mesmos quanto para outros policiais, sempre que necessário.
H|Cap. III · Seção I · Dos juízes
A|Art. 11.|Os Juízes são responsáveis por conduzir a instrução e o julgamento de transgressões disciplinares ou dos recursos advindos de punições aplicadas.
A|Art. 12.|A seleção dos Juízes será realizada pela Presidência do Tribunal de Justiça Policial, com a aprovação do Conselho Superior de Justiça.
A|Art. 13.|O juiz imparcial é aquele que busca, nas provas, a verdade dos fatos com objetividade e fundamento, mantendo ao longo de todo o processo uma distância equivalente das partes envolvidas, evitando todo e qualquer tipo de comportamento que possa refletir favoritismo, predisposição ou preconceito.
A|Art. 14.|A distribuição dos processos ao juiz relator será realizada através de sorteio eletrônico, observando os princípios de imparcialidade e equidade.
A|Art. 15.|O Juiz dirigirá o processo conforme as disposições deste regimento, incumbindo-lhe:
I|I.|Assegurar às partes igualdade de tratamento;
I|II.|Garantir, em suas decisões, a razoabilidade, a legalidade e a eficiência;
I|III.|Julgar todas as contravenções cometidas por policiais do departamento;
I|IV.|Julgar recursos de punições atribuídas aos militares em casos comuns;
I|V.|Manter a confidencialidade das informações que conheça em razão de seu cargo ou função;
I|VI.|Relatar as matérias processuais despachadas pelos Promotores.
A|Art. 16.|São direitos dos Juízes:
I|I.|Participar das sessões e deliberar acerca dos processos pautados, com direito a voto e manifestação;
I|II.|Requisitar provas, ouvir testemunhas e realizar outras atividades que considerar pertinentes para a elucidação do caso.
I|III.|Receber apoio e demais recursos necessários para a execução de suas funções;
I|IV.|Propor mudanças e melhorias nos procedimentos e práticas do Tribunal, com o objetivo de promover a eficiência e a justiça no processo.
A|Art. 17.|O relatório elaborado pelo Juiz relator deverá conter uma exposição clara dos fatos, a análise jurídica fundamentada e a proposta de decisão, sendo submetido ao colegiado para apreciação e deliberação.
A|Art. 18.|É vedado ao Juiz adotar qualquer procedimento que seja incompatível com a dignidade, a honra e o decoro de suas funções.
A|Art. 19.|Exige-se do Juiz que seja eticamente independente e que não interfira, de qualquer modo, na atuação jurisdicional de outrem, exceto em respeito às normas legais.
A|Art. 20.|Constitui atentado à dignidade do cargo qualquer ato ou comportamento do Juiz, no exercício de suas funções, que implique discriminação injusta ou arbitrária contra qualquer pessoa.
A|Art. 21.|Compete aos Juízes, ao proferir suas sentenças, considerar a proporcionalidade dos postos das partes envolvidas e as circunstâncias específicas do caso, de modo a garantir que a decisão seja justa e adequada à gravidade da transgressão ou do recurso.
H|Cap. III · Seção II · Dos promotores de justiça
A|Art. 22.|Os Promotores de Justiça são responsáveis por garantir que as transgressões disciplinares sejam devidamente investigadas e que os responsáveis sejam formalmente acusados.
A|Art. 23.|A seleção dos Promotores será realizada pela Presidência do Tribunal de Justiça Policial, com a aprovação do Conselho Superior de Justiça.
A|Art. 24.|Aos Promotores, incumbe, além de outras atribuições:
I|I.|Zelar pelo prestígio da justiça, garantindo que todos os membros da instituição sejam tratados com respeito e dignidade;
I|II.|Desempenhar suas funções com esmero e presteza;
I|III.|Prestar assistência judiciária aos solicitantes;
I|IV.|Agir com ética e responsabilidade na apresentação das acusações;
I|V.|Colaborar com a defesa e o júri, a fim de promover um processo justo e equilibrado, respeitando os direitos de todas as partes envolvidas;
I|VI.|Manter a confidencialidade das informações que conheça em razão de seu cargo ou função.
A|Art. 25.|São direitos dos Promotores:
I|I.|Participar dos julgamentos, apresentando provas e argumentos em favor da acusação;
I|II.|Solicitar medidas e providências que julguem necessárias para o andamento dos casos;
I|III.|Propor mudanças e melhorias nos procedimentos e práticas do Tribunal, com o objetivo de promover a eficiência e a justiça no processo.
A|Art. 26.|Os Promotores de Justiça devem manter uma postura imparcial e objetiva, assegurando que suas ações sejam baseadas em fatos e evidências, e que não reflitam preconceitos ou interesses pessoais.
H|Cap. III · Seção III · Dos defensores
A|Art. 27.|Os Defensores são responsáveis por defender os direitos dos réus, garantir a sua representação legal e ajudá-los a obter uma decisão favorável.
A|Art. 28.|A seleção de Defensores será realizada pela Presidência do Tribunal de Justiça Policial, com a aprovação do Conselho Superior de Justiça.
A|Art. 29.|São deveres dos Defensores:
I|I.|Atuar com decoro, veracidade, dignidade e boa-fé;
I|II.|Contribuir para o aprimoramento da instituição e das leis a ela associadas;
I|III.|Colaborar com a Promotoria e os Juízes, a fim de promover um processo justo;
I|IV.|Manter a confidencialidade das informações que conheça em razão de seu cargo ou função.
A|Art. 30.|São direitos dos Defensores:
I|I.|Defender os réus com total autonomia e profissionalismo;
I|II.|Ter acesso a todos os documentos e provas relevantes ao caso;
I|III.|Pugnar pela efetivação dos direitos dos réus no curso do processo;
I|IV.|Participar das audiências dos casos em que atuar;
I|V.|Propor mudanças e melhorias nos procedimentos e práticas do Tribunal, com o objetivo de promover a eficiência e a justiça no processo.
H|Cap. IV · Da presidência do tribunal
A|Art. 31.|O cargo de Presidente do Tribunal de Justiça Policial será ocupado por um dos membros do Tribunal, escolhido conforme os critérios e o processo fixados pelo Conselho Superior, bem como o tempo de mandato.
P|Parágrafo único.|Na hipótese de vacância do cargo de Presidente do Tribunal, o membro mais antigo do TJP assumirá o cargo temporariamente.
A|Art. 32.|O Presidente do Tribunal de Justiça Policial terá os mesmos direitos e deveres que os demais membros, além das responsabilidades adicionais que decorrem de sua posição de liderança.
A|Art. 33.|São atribuições do Presidente do Tribunal de Justiça Policial:
I|I.|Zelar pelo cumprimento da lei e da justiça na Polícia DIC, garantindo que todos os procedimentos sejam realizados de acordo com a Legislação e este Regimento Interno;
I|II.|Presidir as sessões e reuniões do Tribunal, garantindo a ordem e a condução adequada dos trabalhos;
I|III.|Representar o Tribunal em eventos oficiais e perante outras instituições, mantendo a dignidade e a integridade do órgão;
I|IV.|Coordenar a distribuição dos casos entre os Juízes e supervisionar o andamento dos processos, assegurando o cumprimento dos prazos e a eficiência no julgamento;
I|V.|Elaborar e submeter ao Conselho Superior propostas de alterações no regimento interno e em outros procedimentos, visando a melhoria contínua das práticas do Tribunal;
I|VI.|Assinar as decisões e atos administrativos do Tribunal, incluindo as deliberações sobre transgressões disciplinares e outras questões de competência do órgão;
I|VII.|Agir com imparcialidade, respeitar rigorosamente as normas e o Regimento Interno, fomentando um ambiente de colaboração e respeito entre todos os membros do Tribunal.
P|§ 1º.|O Presidente deverá convocar reuniões regulares do Tribunal e manter a comunicação eficaz com todos os membros para garantir que as operações do Tribunal sejam realizadas de maneira eficiente.
P|§ 2º.|Em caso de necessidade de decisões urgentes ou extraordinárias, o Presidente poderá tomar providências temporárias, com a posterior ratificação pelo Tribunal em sua totalidade, para assegurar a continuidade e a eficácia das operações do Tribunal.
H|Cap. V · Do funcionamento do tribunal
A|Art. 34.|O mandato do Presidente do Tribunal de Justiça Policial terá a duração de quatro (04) meses.
P|Parágrafo único.|A prorrogação ou antecipação de um mandato será decidida pelo Conselho Superior de Justiça.
A|Art. 35.|Findo o mandato do Presidente do TJP, este passará a integrar uma das funções do Tribunal, conforme houver vaga.
A|Art. 36.|O mandato dos Juízes, Defensores e Promotores terá a duração de dois (02) meses.
A|Art. 37.|Findo o mandato dos membros descritos no Art. 36, estes serão redistribuídos através de sorteio.
A|Art. 38.|O Tribunal realizará suas atividades de acordo com um calendário estabelecido pelo Conselho Superior de Justiça, que definirá as datas para sessões regulares e extraordinárias conforme a demanda e a necessidade do Tribunal.
P|§ 1º.|O calendário de atividades deverá ser divulgado antecipadamente a todos os membros do Tribunal e às partes envolvidas nos processos, para garantir a transparência e a organização adequada das sessões.
P|§ 2º.|Sessões extraordinárias poderão ser convocadas pelo Presidente do Tribunal, com a devida justificativa e conforme a urgência do caso.
H|Cap. V · Seção I · Das sessões de julgamento
A|Art. 39.|As sessões de julgamento se destinam a discutir o processo e somente se iniciará com a presença das partes envolvidas, dos Juízes, de um Defensor e de um Promotor de Justiça.
P|Parágrafo único.|Em caso de ausência de qualquer um dos componentes necessários para o início da sessão, esta será suspensa e reagendada, salvo em casos de urgência previamente justificados.
A|Art. 40.|É dada a interrupção do julgamento para análise de novos fatos com o objetivo de aprimorar a imparcialidade e assegurar o devido processo legal nos julgamentos realizados pelo Tribunal de Justiça Policial (TJP). Fica estabelecida a possibilidade de suspensão temporária do julgamento em casos específicos durante a réplica da acusação.
P|§ 1º.|Caso a acusação apresente novos elementos, como provas adicionais ou novas acusações durante a réplica, deverá ser concedido um prazo de até 30 (trinta) minutos para que o júri possa assimilar as informações e a defesa possa se preparar adequadamente para responder.
P|§ 2º.|Se os novos elementos apresentados forem de alta complexidade e puderem impactar significativamente a condução do julgamento, será permitida uma suspensão de até 72 (setenta e duas) horas. Nessa circunstância, a sessão atual será encerrada, e uma nova sessão será agendada para que a defesa possa apresentar sua resposta com a devida análise dos novos fatos.
A|Art. 41.|Os julgamentos serão abertos ao público, exceto quando houver determinação em contrário do Presidente ou do CSJ.
A|Art. 42.|O colegiado de juízes decidirá sobre o processo com base no relatório e na proposta de decisão apresentada pelo juiz relator. O colegiado pode optar por seguir a proposta do relator ou manifestar opiniões divergentes, com base nas evidências e nos argumentos apresentados.
P|§ 1º.|As decisões serão tomadas por votação colegiada dos juízes, e as divergências devem ser devidamente fundamentadas e registradas.
P|§ 2º.|O juiz relator deverá fornecer uma exposição detalhada e fundamentada de sua proposta de decisão para auxiliar o colegiado na deliberação.
A|Art. 43.|Em caso de impedimento ou suspeição do juiz relator, o processo será redistribuído a outro juiz, que assumirá a função de relator de acordo com o sorteio ou a designação pelo Presidente do Tribunal.
A|Art. 44.|As sentenças do Tribunal serão registradas e disponibilizadas publicamente, respeitando as normas de confidencialidade e proteção de dados.
P|§ 1º.|O registro das sentenças incluirá um resumo das decisões, sem comprometer a confidencialidade das informações pessoais e sensíveis.
P|§ 2º.|A disponibilização das sentenças será feita através de canais oficiais do Tribunal.
H|Cap. V · Seção II · Sessões plenárias
A|Art. 45.|As sessões no Plenário destinam-se à discussão administrativa do Tribunal e serão convocadas pelo Presidente previamente.
A|Art. 46.|Em casos excepcionais e de clamor nacional o Plenário poderá se revestir de função jurisdicional e atuar como sessão de julgamento, denominado por rito sumaríssimo.
P|Paragrafo único.|Nas excepcionalidades do caput, todos os membros do TJP serão convocados à sessão, que será presidida pelo Presidente do TJP ou o Presidente do CSJ.
H|Cap. VI · Do sistema de aprendizes
A|Art. 47.|O sistema de Aprendizes tem como objetivo formar e capacitar os militares nas diversas situações jurídicas relacionadas ao Tribunal de Justiça Policial.
A|Art. 48.|Os Aprendizes do Tribunal de Justiça Policial estarão sujeitos a avaliação por tempo indeterminado a partir do seu ingresso no sistema.
A|Art. 49.|Aprendizes em curso possuem prerrogativas especiais tanto na Polícia DIC quanto no Tribunal de Justiça Policial, que são as seguintes:
I|I.|Os Aprendizes somente poderão ser punidos pelos membros do Tribunal de Justiça Policial;
I|II.|Os Aprendizes deverão usar um uniforme diferenciado, que inclui boina e medalha;
I|III.|Possuem a permissão para participar e opinar nas sessões realizadas durante sua permanência como Aprendiz neste órgão, mantendo essa permissão caso concluam o processo de aprendizagem e sejam oficialmente formados;
I|IV.|Têm prioridade em futuras convocações ao Tribunal de Justiça Policial;
I|V.|Podem receber condecorações durante o programa, desde que se destaquem nas atividades.
A|Art. 50.|São prerrogativas de um Aprendiz Formado, independentemente do posto que ocupa:
I|I.|Possuem permissão para punir com a devida pena, com exceção de banimento, qualquer posto subordinado, desde que o ato do transgressor da lei seja flagrado;
I|II.|Possuem permissão para aplicar advertência escrita até o posto de Coronel, desde que o ato do transgressor da lei seja flagrado;
I|III.|Possuem permissão para postar dispensa;
I|IV.|Podem participar do chat e do grupo de Aprendizes Formados;
I|V.|Podem ser requisitados, a qualquer tempo, por um membro do Tribunal de Justiça Policial, para auxiliar na coleta de provas e informações sobre ocorrências que não tenham natureza sigilosa;
I|VI.|Podem ser requisitados para auxiliar um membro do Tribunal de Justiça Policial durante a análise das contas das divisões e do balanço mensal de punições, prestando auxílio por meio da coleta de informações, sendo vedado emitir parecer, juízo de valor ou sugestões;
I|VII.|Podem, em conjunto, realizar pesquisas dentro da Polícia DIC sobre temas de interesse do órgão que mereçam maior atenção do Tribunal de Justiça Policial, apontando problemas e recomendações, e deverão apresentar um relatório completo assinado por todos os Aprendizes Formados;
I|VIII.|Os Aprendizes Formados podem utilizar a medalha Hierarquia Militar 3 na cor verde, ter entrada garantida ao grupo de Aprendizes Formados e manter-se no chat de Aprendizes;
I|IX.|Somente são punidos pelos integrantes do Tribunal de Justiça Policial.
A|Art. 51.|Não há obrigatoriedade para que os Aprendizes Formados se dirijam uns aos outros utilizando o cargo interno de “Aprendiz” nas dependências da Polícia DIC.
H|Cap. VII · Dos dispositivos internos
A|Art. 52.|Os membros do Tribunal serão agraciados com Distintivos Efetivos.
I|I.|Membro receberá 100 distintivos efetivos mensalmente;
I|II.|Presidente receberá 140 distintivos efetivos mensalmente.
H|Cap. VIII · Das considerações finais
A|Art. 53.|Este regimento poderá ser alterado mediante proposta do Plenário, aprovada por maioria qualificada dos seus membros e com a anuência do Conselho Superior de Justiça.
A|Art. 54.|Os membros do Tribunal devem cumprir este regimento e colaborar para o bom funcionamento do órgão.

const S=[{n:"Legislação",c:parse(D)},{n:"Emenda do Corpo Executivo",c:parse(D2)},{n:"Modus Operandi",c:parse(D3)},{n:"Regulamento Disciplinar",c:parse(D4)},{n:"Regulamento Administrativo",c:parse(D5)},{n:"Regimento dos VIPS Interno",c:parse(D6)},{n:"Regimento dos Distintivos",c:parse(D7)},{n:"Regulamento dos Uniformes",c:parse(D8)},{n:"Regimento dos Portadores",c:parse(D9)},{n:"Instruções de Comandos",c:parse(D10)},{n:"Regimento do TJP",c:parse(D11)}];let si=0,chs=S[0].c;
const $=id=>document.getElementById(id),out=$("out"),inp=$("q");
const norm=s=>s.replace(/[\u00c0-\u017f]/g,c=>c.normalize("NFD")[0]).toLowerCase();
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let sel=-1,scope=-1;
let names;const mk=()=>{names=["Todas",...chs.map(c=>{const p=c.t.split(" · ");return p.length>2?p[0].replace("Título","Tít.")+" · "+p[1]:p[0]})]};mk();
function chips(){$("chips").innerHTML=names.map((n,i)=>`<button class="${i-1==sel?"on":""}" data-i="${i-1}">${esc(n)}</button>`).join("")}
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=+b.dataset.i;render()};
const hit=(a,nq)=>norm(a.map(x=>x[1]+" "+x[2]).join(" ")).includes(nq);
const card=a=>`<article class="a">`+a.map(([k,l,t])=>`<p class="${k}${t.startsWith("(Inciso")?" n":""}">${l?`<b>${esc(l)}</b> `:""}${esc(t)}</p>`).join("")+`</article>`;
function tabs(cnt){const el=$("secs"),sl=el.scrollLeft;
if(cnt){el.innerHTML=`<button class="${scope==-1?"on":""}" data-s="-1">Todas (${cnt.reduce((x,y)=>x+y,0)})</button>`+S.map((s,i)=>`<button class="${i==scope?"on":""}${cnt[i]?"":" z"}" data-s="${i}">${esc(s.n)} (${cnt[i]})</button>`).join("")}
else el.innerHTML=S.map((s,i)=>`<button class="${i==si?"on":""}" data-s="${i}">${esc(s.n)}</button>`).join("");
el.scrollLeft=sl}
function render(){
const q=inp.value.trim(),nq=norm(q);
if(!nq){chs=S[si].c;mk();if(sel>=chs.length)sel=-1;chips();tabs(null);let h="",n=0;
chs.forEach((c,i)=>{if(sel>=0&&sel!=i)return;n+=c.arts.length;h+=`<h2>${esc(c.t)}</h2>`+c.arts.map(card).join("")});
out.innerHTML=h;$("info").textContent=`${S[si].n}: ${n} artigos`;return}
$("chips").innerHTML="";
const cnt=S.map(s=>s.c.reduce((t,c)=>t+c.arts.filter(a=>hit(a,nq)).length,0));
tabs(cnt);let h="",n=0,k=0;
S.forEach((s,j)=>{if(scope>=0&&scope!=j)return;if(!cnt[j])return;k++;n+=cnt[j];
h+=`<h3 class="sec">${esc(s.n)} <span>${cnt[j]}</span></h3>`;
s.c.forEach(c=>{const it=c.arts.filter(a=>hit(a,nq));if(!it.length)return;h+=`<h2>${esc(c.t)}</h2>`+it.map(card).join("")})});
out.innerHTML=h||`<p class="n">Nada encontrado${scope>=0?" nesta seção. Toque em “Todas” para buscar em tudo":""}.</p>`;
$("info").textContent=`${n} artigo(s) em ${k} seção(ões) com “${q}”`;
const w=document.createTreeWalker(out,4),ns=[];while(w.nextNode())ns.push(w.currentNode);
ns.forEach(x=>{const s=x.nodeValue,m=norm(s);let i=m.indexOf(nq);if(i<0)return;const f=document.createDocumentFragment();let p=0;
while(i>=0){f.append(s.slice(p,i));const k=document.createElement("mark");k.textContent=s.slice(i,i+nq.length);f.append(k);p=i+nq.length;i=m.indexOf(nq,p)}
f.append(s.slice(p));x.replaceWith(f)})}
$("secs").onclick=e=>{const b=e.target.closest("button");if(!b)return;const j=+b.dataset.s;
if(inp.value.trim()){scope=(j==scope)?-1:j}else{si=j;sel=-1}
render();window.scrollTo(0,0)};
inp.oninput=()=>{if(!inp.value.trim())scope=-1;render()};
inp.placeholder="Pesquisar em todas as seções…";render();
</script>
