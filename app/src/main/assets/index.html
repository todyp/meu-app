const D=`H|Título I · Introdução
A|Art. 1º|As disposições desta Legislação aplicam-se a todos os policiais do Departamento de Investigação Criminal (DIC) e regulam suas ações. Qualquer usuário do Habbo que juntar-se à Polícia deverá cumprir com os presentes termos.
P|§ 1º|O descumprimento das normas e procedimentos definidos nesta Legislação poderá acarretar a aplicação de sanções disciplinares previstas no Regulamento Disciplinar (RD);
P|§ 2º|A ignorância quanto às informações contidas nesta Legislação ou em qualquer outro documento oficial não exime o policial de ser responsabilizado e punido conforme as normas estabelecidas.
A|Art. 2º|Considerada a carta magna do departamento, este arquivo determina a distribuição e o funcionamento da Polícia de maneira integral. Todos os demais documentos oficiais, independente de sua origem ou confidencialidade, devem estar em consonância com as diretrizes impostas pela Legislação vigente.
A|Art. 3º|A Polícia preza pelas regras impostas pela empresa Sulake Corporation Oy, administradora do Habbo Hotel, e contidas na Habbo Etiqueta, devendo os militares segui-las à risca.
A|Art. 4º|A conduta dos membros do Departamento de Investigação Criminal será norteada pelos seguintes princípios básicos:
I|I -|Imparcialidade: todos os policiais devem agir de forma neutra, assegurando o mérito profissional e o tratamento igualitário a todas as pessoas, independentemente de raça, gênero, religião, vínculo afetivo ou qualquer outra característica individual;
I|II -|Empatia: deve-se considerar a perspectiva e as circunstâncias do outro, buscando compreender suas ações, motivações e particularidades de forma cuidadosa e ponderada. Antes de tomar qualquer decisão, é fundamental colocar-se no lugar do militar envolvido;
I|III -|Proporcionalidade: as punições devem ser proporcionais à gravidade das transgressões e ao cargo, posto ou graduação de cada infrator, considerando sua experiência e responsabilidade. Assim, um Inspetor receberá uma sanção mais severa do que um Subtenente, mesmo em casos semelhantes;
I|IV -|(Inciso não consta nos prints enviados.)
I|V -|Disciplina e hierarquia: é dever de todos os policiais cumprir rigorosamente as normas e diretrizes estabelecidas pelos documentos oficiais da Polícia DIC, assegurando a ordem e a conduta adequada no desempenho de todas as atividades. A estrutura hierárquica deve ser plenamente respeitada tanto no acatamento das ordens quanto na execução das funções, sendo absolutamente intolerável qualquer ato de insubordinação.
A|Art. 5º|Exige-se o respeito mútuo entre os policiais em todos os quartos do departamento, bem como em suas adjacências, como bate-papos, grupos e fóruns. Palavras de baixo calão não são toleradas, e as brincadeiras devem ser reciprocamente consentidas.
P|Parágrafo único.|Os policiais que forem flagrados em outros quartos do jogo apresentando qualquer comportamento que viole os princípios básicos do departamento, como discursos de ódio e/ou intolerância, serão severamente punidos, desde que sejam identificados como policiais do departamento e a referida atitude macule a imagem da Polícia.
A|Art. 6º|Preservando o conceito de liberdade individual, os colaboradores são completamente livres, isto é, ninguém é obrigado a abdicar de sua vida pessoal em prol da Polícia. Da mesma forma, a presença em base é facultativa quando no jogo, contanto que a carga horária desempenhada pelo policial esteja em conformidade com a posição hierárquica e/ou administrativa ocupada.
H|Título II · Cap. I · Do efetivo militar e suas atribuições
A|Art. 7º|O Departamento de Investigação Criminal possui duas carreiras principais que o compõem: a Hierarquia Militar e a Hierarquia Executiva. Qualquer jogador que integre um dos corpos hierárquicos é compreendido como policial/militar da corporação.
A|Art. 8º|Os cargos, postos e graduações da hierarquia militar são atribuídos àqueles que optaram pelo alistamento e foram promovidos de acordo com seu comprometimento e esforço. A imagem abaixo lista todas as posições existentes, bem como os grupos e subgrupos hierárquicos:
J||PRAÇAS: Soldado, Cabo, Sargento, Subtenente, Aspirante
J||OFICIAIS: Tenente, Capitão
J||OFICIAIS SUPERIORES: Major, Tenente-Coronel, Coronel
J||SUPERIORES: Inspetor, Superintendente
J||COMANDO: Comandante, Comandante-Geral
J||PRESIDÊNCIA: Comandante-Suplente, Supremo, Vice-Presidente, Presidente
P|Parágrafo único.|O cargo de Comandante-Suplente não é subordinado ao de Supremo. Trata-se de uma posição equivalente, limitando-se apenas a um período probatório, o qual poderá ser convertido em cargo efetivo na estrutura hierárquica da Presidência.
A|Art. 9º|Os cargos do Corpo de Superiores possuem um limite pré-definido de vagas, visando garantir o padrão de excelência e estimular a disciplina militar entre aqueles que desejam ocupar, gradualmente, as posições mais altas do organograma:
I|I -|Inspetoria, limite de quinze (15) vagas;
I|II -|Superintendência, limite de dez (10) vagas;
I|III -|Comando, limite de sete (07) vagas;
I|IV -|Comando-Geral, limite de quatro (04) vagas;
I|V -|Supremo, limite de três (03) vagas;
I|VI -|Vice-Presidente, limite de uma (01) vaga;
I|VII -|Presidente, limite de uma (01) vaga.
P|§ 1º|Militares do Grupo de Operações Especiais (GOE), não contam para a limitação de vagas para a Inspetoria;
P|§ 2º|A Presidência pode promover policiais que não entram na limitação de vagas prevista neste artigo.
A|Art. 10.|Os Cargos Executivos são atribuídos aos policiais que compraram o cargo desejado, podendo ser promovidos ao longo de suas carreiras, caso se esforcem e trabalhem de forma exímia.
P|Parágrafo único.|A Hierarquia Executiva é regulada por documentação distinta, nomeada Emenda do Corpo Executivo.
A|Art. 11.|É proibido realizar alterações nos nomes dos postos e das graduações do Corpo de Praças e dos Oficiais por distinção de gênero. Sendo assim, denominações como “Soldada”, “Sargenta” ou “Capitã”, independentemente da via usada para transmitir a informação, são proibidas.
P|Parágrafo único.|A presente proibição não se aplica aos Cargos Executivos. As variações permitidas constam em sua emenda.
A|Art. 12.|Ao se referir a um superior hierárquico, é obrigatória a utilização dos pronomes de tratamento “senhor” ou “senhora”, que devem estar de acordo com o sexo do avatar do policial no jogo.
P|Parágrafo único.|Nas situações em que a comunicação seja para com um equivalente ou subordinado hierárquico, o tratamento correto deve utilizar o nick e o correspondente cargo, posto ou graduação.
A|Art. 13.|A Presidência assegurará a rotatividade do Comando, rebaixando policiais inativos, inaptos ou desmotivados e concedendo espaço para novas pessoas.
H|Título II · Cap. II · Dos cursos e treinamentos
A|Art. 14.|Conforme conquistam posições maiores através das promoções, novos deveres e prerrogativas são entregues aos policiais. Os cursos hierárquicos são responsáveis por instruir-lhes a cumprir, de modo exímio, com as novas tarefas atribuídas e a como lidar com os poderes que receberam, sendo parte imprescindível para a formação de um bom policial. A formação obedecerá a seguinte ordem:
I|I -|Curso Básico Militar [CBM]: Forma os novos Soldados, aplicadas aos Recrutas pelos Guias;
I|II -|Curso de Formação Básica 1 [CFB1]: Direcionado aos Cabos, aplicado pelos Guias;
I|III -|Curso de Formação Básica 2 [CFB2]: Direcionado aos Cabos, aplicado pelos Guias;
I|IV -|Curso de Preparação à Liderança [CPL]: Direcionado aos Cabos, aplicado pelos Guias;
I|V -|Curso de Aperfeiçoamento Hierárquico [CAH]: Direcionado aos novos Sargentos, aplicado pelos Guias;
I|VII -|Capacitação em Normas e Procedimentos [CNP]: Direcionado aos Sargentos, aplicado pelos Guias;
I|VIII -|Curso de Formação Avançada [CFA]: Direcionado aos Sargentos, aplicado pelos Guias;
I|IX -|Curso de Supervisão e Carreira [CSC]: Direcionado aos Subtenentes, aplicado pelos Guias;
I|X -|Conceitos de Estrutura e Disciplina [CED]: Direcionado aos Subtenentes, aplicado pelos Guias;
I|XI -|Curso de Diretrizes e Consolidação [CDC]: Direcionado aos Aspirantes, aplicado pela Academia Policial;
I|XII -|Curso de Formação de Oficiais: Direcionado aos Aspirantes, aplicado pela Academia Policial;
I|XIII -|Curso de Comando Operacional [CCO]: Direcionado aos Tenentes, aplicado pela Academia Policial;
I|XIV -|Curso de Gestão Administrativa [CGA]: Direcionado aos Capitães, aplicado pela Academia Policial;
I|XV -|Curso de Liderança e Direção [CLD]: Direcionado aos Majores, aplicado pela Academia Policial;
I|XVI -|Curso de Formação de Superiores [CFS]: Direcionado aos Tenentes-Coronéis, aplicado pela Academia Policial.
P|§ 1º|A aplicação dos cursos deve seguir a ordem definida pelos incisos, sendo estritamente proibido realizá-los fora dessa sequência;
P|§ 2º|Alguns treinamentos fornecidos pela Academia Policial requerem agendamento prévio, consoante as explicações disponibilizadas nos materiais de cada curso;
P|§ 3º|O Curso Básico Militar deve ser iniciado quando houver no mínimo dois Recrutas ou cinco minutos de pré-aula, exceto nos contextos em que o Oficial de Comando presente considere benéfico prosseguir de outra forma;
P|§ 4º|Os cursos hierárquicos não podem, sob nenhuma hipótese, ser alterados sem o aval da Secretaria de Ensino. Desse modo, a modificação dos scripts e slides quanto ao seu conteúdo requer avaliação do órgão competente;
P|§ 5º|Os Tenentes/Promotores+ com CCO tornam-se automaticamente Aplicadores, ficando autorizados a aplicar todos os cursos dos Guias na ausência de membros da divisão. Caso não haja Guias disponíveis em base, é obrigação do policial aplicar a aula, se houver omissão dessa responsabilidade, estará sujeito a sanções disciplinares.
A|Art. 15.|As formações administrativas ou especiais fornecidas pelas divisões almejam capacitar o policial para prestar serviço no escopo de atuação da equipe.
P|Parágrafo único.|O Curso de Operações Especiais (COEsp) é um programa intenso de doutrina e imersão que permite, aos responsáveis, quebrar as regras definidas pelos documentos oficiais no que tange ao tratamento dos policiais, desde que se limite aos participantes dos cursos.
A|Art. 16.|Os treinamentos fornecidos pela Academia Policial possuem prazos de conclusão que, se não forem atendidos, resultarão em sanções disciplinares:
I|I -|Os policiais que integram o Oficialato e Oficialato Superior só poderão iniciar os cursos do próximo posto após cumprimento de metade do tempo mínimo exigido para promoção, acrescido de 3 (três) dias;
I|II -|Os oficiais possuem o prazo máximo de quinze (15) dias para iniciar o treinamento a partir da data em que se tornarem aptos;
I|III -|Os cursos aplicados pela Academia Policial, com exceção do Curso de Formação de Superiores, devem ser concluídos em até trinta (30) dias após iniciado;
I|IV -|O Curso de Formação de Superiores deverá ser concluído em até trinta e cinco (35) dias após iniciado.
P|§ 1º|O militar que ultrapassar o prazo estabelecido receberá uma advertência e, a cada cinco dias que se passarem sem adequação, mais uma advertência será emitida.
P|§ 2º|Os militares do Corpo Executivo estão isentos dos prazos previamente estabelecidos para o início ou conclusão de seus treinamentos.
A|Art. 17.|O uso da medalha não-HC é restrito e obrigatório aos policiais que concluíram todos os treinamentos do posto ou graduação, a fim de facilitar a identificação no quartel.
P|Parágrafo único.|Membros do Grupo de Operações Especiais, do Batalhão de Movimentações Estratégicas, da Diretoria de Engenharia, do Tribunal de Justiça Policial e Aprendizes Formados estão isentos do uso da medalha após a conclusão dos treinamentos, já que utilizam de medalha própria conforme a função interna que ocupam na divisão ou diretoria.
H|Título II · Cap. III · Das promoções
A|Art. 18.|À medida que os policiais evoluem dentro do departamento, as exigências para que ascendam hierarquicamente aumentam. Cada posto ou graduação acrescenta novos critérios, responsáveis por filtrar quem está ou não apto para ocupar a posição subsequente:
I|I -|Soldado para Cabo:
J|a)|Ter ao menos quinze (15) minutos após a aprovação no Curso Básico Militar;
J|b)|Saber efetuar o processo de alistamento;
J|c)|Apresentar uma ortografia aceitável;
J|d)|Saber executar os comandos “Sentido”, “À vontade”, “Continência” e “Apresentar-armas”.
J|e)|Respeitar todos os militares;
J|f)|Utilizar os pronomes de tratamento.
I|II -|Cabo para Sargento:
J|a)|Ter ao menos um (01) dia após a aprovação no Curso de Preparação à Liderança;
J|b)|Exercer um bom serviço nas Alavancas;
J|c)|Exercer um bom serviço no Fiscalizador de Recrutas;
I|III -|Sargento para Subtenente:
J|a)|Ter ao menos dois (02) dias após a aprovação no Curso de Formação Avançada;
J|b)|Exercer um bom serviço na Salinha de Recrutas e no comando da Recepção;
J|c)|Saber executar o comando “Apresente-se”;
J|d)|Apresentar uma boa ortografia.
I|IV -|Subtenente para Aspirante:
J|a)|Ter ao menos três (03) dias após a aprovação no Conceitos de Estrutura e Disciplina;
J|b)|Exercer um bom serviço no comando das Alavancas;
J|c)|Fazer parte da divisão de Guias ou Batalhão de Movimentações Estratégicas.
I|V -|Aspirante para Tenente: A promoção é automática, sendo o militar promovido assim que aprovado no Curso de Formação de Oficiais
I|VI -|Tenente para Capitão:
J|a)|Ter ao menos dez (10) dias no posto;
J|b)|Ter sido aprovado no Curso de Comando Operacional;
J|c)|Exercer um bom serviço como Oficial de base;
J|d)|Fazer parte da divisão de Guias ou Academia Policial e cumprir com as metas estipuladas;
J|e)|Desenvolver o costume de observar, auxiliar, punir e promover os subordinados quando identificar oportunidade;
J|f)|Ter pulso firme sempre que necessário;
J|g)|Ser um promotor assíduo.
I|VII -|Capitão para Major:
J|a)|Ter ao menos quinze (15) dias no posto;
J|b)|Ter sido aprovado no Curso de Gestão Administrativa;
J|c)|Gerir a base com excelência em qualquer comando central;
J|d)|Fazer parte da divisão de Guias ou Academia Policial e cumprir com as metas estipuladas;
J|e)|Distribuir Distintivos Operacionais regularmente;
J|f)|Apresentar uma ortografia ótima;
J|g)|Saber mediar situações de conflito;
J|h)|Ser um promotor assíduo;
I|VIII -|Major para Tenente-Coronel:
J|a)|Ter ao menos vinte (20) dias no posto;
J|b)|Possuir o Curso de Liderança e Direção;
J|c)|Fazer parte da divisão de Guias ou Academia Policial e cumprir com as metas estipuladas;
J|d)|Distribuir Distintivos Operacionais regularmente;
J|e)|Ocupar, no mínimo, uma função interna equivalente a de Fiscal de uma divisão ou diretoria.
J|f)|Demonstrar calma e racionalidade em situações que demandam essas características;
J|g)|Assumir corretamente o Posto de Vigilância;
J|h)|Ser um promotor assíduo;
I|IX -|Tenente-Coronel para Coronel:
J|a)|Ter ao menos vinte (25) dias no posto;
J|b)|Possuir o Curso de Formação de Superiores;
J|c)|Fazer parte da divisão de Guias ou Academia Policial e cumprir com as metas estipuladas;
J|d)|Distribuir Distintivos Operacionais regularmente;
J|e)|Ocupar, no mínimo, uma função interna equivalente a de Auxiliar de uma divisão ou diretoria;
J|f)|Ser proativo nos âmbitos operacional e administrativo, solucionando empecilhos e potencializando os serviços do cotidiano por vontade e iniciativa própria;
J|g)|Possuir capacidade argumentativa e análise crítica;
J|h)|Apresentar uma ortografia extraordinária;
J|i)|Contribuir com o departamento por meio de projetos e ideias eficientes e/ou inovadoras, que otimizem, em qualquer ambiente, os trabalhos realizados;
J|j)|Ser um promotor assíduo.
I|X -|Coronel para Inspetor(a):
J|a)|Ocupar, no mínimo, uma função interna equivalente a de Sub-Líder de uma divisão ou diretoria;
J|b)|Fazer parte da divisão de Guias ou Academia Policial e cumprir com as metas estipuladas;
J|c)|Participar frequentemente da reunião semanal, com um valor mínimo de 75% nos últimos dois meses;
J|d)|Distribuir Distintivos Operacionais regularmente;
J|e)|Demonstrar habilidades de liderança de equipes e pelotões;
J|f)|Ser um promotor assíduo.
I|XI -|Inspetor(a) para Superintendente:
J|a)|Ocupar, no mínimo, uma função interna equivalente a de Sub-Líder de uma divisão ou diretoria;
J|b)|Exercer um trabalho excepcional no cumprimento das incumbências da Inspetoria;
J|c)|Ter um raciocínio compatível com as virtudes de liderança, altruísmo, senso crítico;
J|d)|Estar a par sobre o andamento do departamento e contribuir ativamente com a sua evolução, por meio de todos os procedimentos e qualificações já mencionados;
J|e)|Distribuir Distintivos Operacionais regularmente;
J|f)|Estar aprovado no período de 30 dias de Observação.
I|XII -|Superintendente para Comandante:
J|a)|Ocupar, no mínimo, uma função interna equivalente a de Sub-Líder de uma divisão ou diretoria;
J|b)|Exercer um trabalho excepcional no cumprimento das incumbências da Superintendência;
J|c)|Saber confeccionar documentos bem escritos e formatados;
J|d)|Distribuir Distintivos Operacionais regularmente;
J|e)|Estar aprovado no período de 20 dias de Observação.
P|§ 1°|A estrutura de promoções da Polícia DIC é baseada na meritocracia, garantindo que o avanço na carreira ocorra conforme o esforço, dedicação e desempenho de cada policial, sem espaço para favorecimentos pessoais.
P|§ 2°|Os preceitos que englobam habilidades técnicas, éticas ou comportamentais são cumulativos. Ou seja, o militar precisa estar de acordo com todas as qualidades já exigidas anteriormente para que possa ascender novamente.
P|§ 3°|De Subtenente a Coronel é fundamental que o policial realize turnos em base, contribuindo de maneira consistente e eficiente com o seu movimento.
P|§ 4°|No cálculo do cumprimento do valor mínimo de dias após o treinamento ou tempo no cargo, posto ou graduação que ocupar, deve-se levar em consideração as horas e os minutos da última postagem correspondente.
P|§ 5°|O Comando e a Presidência não possuem requisitos adicionais para ascensão, mas devem estar em consonância com todos os critérios dispostos para os demais.
P|§ 6°|As promoções realizadas devem seguir à risca as exigências estipuladas por este artigo, com exceção da Presidência que, por sua vez, possui autonomia para efetuar ascensões hierárquicas sem a obrigatoriedade dos requisitos estabelecidos.
P|§ 7°|Um militar poderá ter sua promoção prorrogada se atender aos pré-requisitos e ao cumprimento do tempo mínimo no cargo, posto ou graduação, devido à má postura, punições relevantes e outros motivos que o promotor considere válidos.
P|§ 8°|O período de observação é uma fase probatória para avaliação do desempenho no cargo. Caso não atenda aos critérios, o policial será realocado à função anterior, sem caracterizar rebaixamento.
P|§ 9|Ressalta-se que o período de observação no Comando está sujeito à avaliação do Comando-Geral e da Presidência, sendo os critérios definidos exclusivamente por essas instâncias.
A|Art. 19.|Assim que o policial alcança o posto de Tenente, ele recebe permissão para promover seus subordinados. A partir deste momento, inicia-se o ciclo hierárquico de promoções. A seguir, estão representados cada posto e suas respectivas prerrogativas:
I|I -|Tenente promove, no máximo, Soldado a Cabo;
I|II -|Capitão promove, no máximo, Cabo a Sargento e Sócio a Agente;
I|III -|Major promove, no máximo, Sargento a Subtenente e Agente a Analista;
I|IV -|Tenente-Coronel promove, no máximo, Subtenente a Aspirante e Analista a Coordenador;
I|V -|Tenente-Coronel aprovado no CFS promove, no máximo, Tenente a Capitão e Promotor a Advogado;
I|VI -|Coronel promove, no máximo, Capitão a Major e Advogado a Administrador;
I|VII -|Inspetor promove, no máximo, Major a Tenente-Coronel e Administrador a Delegado;
I|VIII -|Superintendente promove, no máximo, Tenente-Coronel a Coronel e Delegado a Investigador.
P|§ 1°|As promoções para cargos acima de Coronel e Investigador ocorrem por meio de decisões colegiadas entre os integrantes do Comando.
P|§ 2°|As promoções acima de Supervisor e Superintendente ocorrem por meio de decisões colegiadas entre os integrantes do Comando-Geral em conjunto com a Presidência.
P|§ 3°|Os integrantes do Grupo de Operações Especiais somente poderão ser promovidos por autoridades pertencentes à respectiva divisão, em razão do desconhecimento, por parte de policiais externos, das atribuições e especificidades das funções desempenhadas no grupamento.
P|§ 4°|Os integrantes do Grupo de Operações Especiais possuem permissão para promover militares com até um posto ou cargo abaixo do seu.
A|Art. 20.|O policial que promover outro militar incorretamente ou com justificativa insatisfatória - contendo erros ortográficos ou sem apresentar motivos que fundamentam a ascensão - poderá ser punido pelos Supervisores.
P|§ 1º|As três primeiras promoções incorretas de Nível 1 realizadas por Tenentes+ ou Executivos com CCO resultarão em verificação pelos Supervisores, conforme o documento Motivos para promoções inválidas. A partir da quarta ocorrência, cada reincidência será punida com advertência.
P|§ 2º|Promoções incorretas de Nível 2 feitas por Majores+ ou Executivos com CGA serão punidas diretamente com advertência. Já Tenentes e Capitães serão apenas verificados nesses casos.
P|§ 3º|Caso o tempo mínimo para promoção não seja cumprido, mas o promovido tiver completado ao menos 75% do prazo exigido, ele será submetido a testes teóricos e práticos para validação do mérito. O superior que realizou a promoção incorreta será punido.
P|§ 4º|É indispensável a realização do Procedimento Pós-Promoção (PPP) com todos os policiais promovidos, seja na Sala de Comandos ou por meio de chat privado. A regra não se aplica em casos de retirada urgente e imediata do promovido.
A|Art. 21.|Quanto aos procedimentos de ascensão hierárquica, definem-se as seguintes restrições:
I|I -|A promoção subsequente de um militar não pode ser efetuada pelo mesmo policial que lhe promoveu anteriormente, salvo as decisões conjuntas promulgadas por algum grupo hierárquico do Corpo de Superiores;
I|II -|É terminantemente proibido promover um policial com quem se tenha vínculo afetivo ou conjugal, senão mediante decisão conjunta promulgada por algum grupo hierárquico do Corpo de Superiores.
H|Título II · Cap. IV · Das estrelas promocionais
A|Art. 22.|As Estrelas Promocionais visam regulamentar o sistema meritocrático de estrelas, bem como os critérios para sua obtenção, a premiação correspondente e as penalidades aplicáveis em caso de falhas, com foco na precisão dos atos promocionais.
A|Art. 23.|O sistema de estrelas objetiva valorizar a atenção, o rigor e a excelência dos policiais do Departamento de Investigação Criminal, recompensando o esforço individual e a ausência de erros na execução de promoções de subordinados.
A|Art. 24.|O reconhecimento do desempenho do policial neste instituto é quantificado por meio de "estrelas", que atestam a exatidão e a regularidade do militar em suas atribuições promocionais.
A|Art. 25.|A cada três (03) promoções realizadas com êxito e sem qualquer tipo de erro, o policial fará jus ao recebimento de uma (01) estrela.
P|§ 1º|A análise das promoções, a atribuição das estrelas e todas funções inerentes à manutenção e controle deste instituto ficarão sob responsabilidade exclusiva dos Supervisores.
P|§ 2º|O policial que solicitar dispensa, for desligado ou demitido por quaisquer motivos perderá integralmente o saldo de estrelas promocionais e os ciclos validados até a data do seu afastamento. A mesma regra aplica-se àqueles que retornarem ao Departamento de Investigação Criminal por meio de alistamento, reintegração ou readmissão.
A|Art. 26.|O policial que alcançar a cota máxima de dez (10) estrelas acumuladas terá o seu mérito reconhecido e receberá a premiação correspondente ao seu desempenho.
A|Art. 27.|A premiação concedida ao atingir a marca de dez (10) estrelas é composta, cumulativamente, por:
I|I -|Insígnia de Reconhecimento ao Subordinado;
I|II -|Um (01) HC;
I|III -|Um (01) mês de VIP Ouro.
A|Art. 28.|A integridade deste instituto promocional depende da manutenção contínua do padrão de excelência do policial. O acúmulo de estrelas não exime o militar de suas responsabilidades disciplinares, operacionais e administrativas.
A|Art. 29.|Em caso de cometimento de erro grave por parte do policial, o seu saldo de estrelas passará por um processo de revisão.
P|§ 1º|Considera-se erro grave o cometimento de erro promocional grave, a prática de transgressões médias, graves e gravíssimas dispostas no Regulamento Disciplinar, ações que firam outros princípios dispostos na Legislação da Polícia DIC, bem como infrações administrativas graves.
P|§ 2º|O processo de revisão, a deliberação sobre as infrações e a consequente retirada de estrelas serão conduzidos integralmente pelo Comando da Polícia DIC.
A|Art. 30.|A revisão motivada por erro grave poderá acarretar as seguintes sanções em relação ao sistema de estrelas, sem prejuízo de outras punições previstas no Regulamento Disciplinar:
I|I -|Dedução parcial das estrelas acumuladas pelo policial;
I|II -|Cassação total das estrelas, zerando o saldo atual do militar;
I|III -|Suspensão temporária do direito de participar e acumular novas estrelas neste sistema promocional;
I|IV -|Perda da Insígnia e prêmios.
A|Art. 31.|Casos omissos, dúvidas na interpretação deste capítulo ou situações excepcionais serão analisados e deliberados pela Liderança dos Supervisores, em conjunto com o Comando.
H|Título III · Das punições
A|Art. 32.|As punições são aplicadas aos militares que descumprem as regras e procedimentos estabelecidos pelos regulamentos oficiais do departamento. Atualmente, existem seis (06) punições distintas dentro da Polícia:
I|I -|Repreensão;
I|II -|Apresentar armas;
I|III -|Advertência;
I|IV -|Rebaixamento;
I|V -|Demissão;
I|VI -|Banimento.
A|Art. 33.|A repreensão pode ser aplicada por, no mínimo, Sargentos ou Executivos com CFA em todos os seus subordinados. É uma espécie de advertência verbal que orienta o policial a realizar o serviço de maneira correta ou que chama sua atenção por algum erro cometido.
P|Parágrafo único.|A repreensão não exige que o superior leve o subordinado à Sala de Comandos, desde que não o coloque em situação vexatória/humilhante. Neste caso, o caráter da repreensão será, obrigatoriamente, reservado.
A|Art. 34.|A punição de apresentar armas pode ser aplicada por, no mínimo, Sargentos ou Executivos com CFA em quaisquer de seus subordinados. O tempo de execução do comando pode variar de 1 minuto a, no máximo, 10 minutos.
P|Parágrafo único.|O aplicador da punição deve permanecer junto ao transgressor na Sala de Comandos até o fim do comando.
A|Art. 35.|A advertência pode ser aplicada por, no mínimo, Tenentes ou Executivos com CFO em qualquer subordinado.
P|Parágrafo único.|Sargentos acima podem receber advertência em caráter administrativo, sendo que apenas Subtenentes acima podem receber advertência por reprovabilidade de conduta.
A|Art. 36.|O rebaixamento pode ser aplicado por, no mínimo, Capitães ou Executivos com CCO em qualquer subordinado.
P|§ 1º|Apenas integrantes do Comando podem rebaixar membros do Corpo de Superiores, por ordem administrativa, desde que por meio de decisão colegiada.
P|§ 2º|O rebaixamento múltiplo (isto é, de dois ou mais cargos, postos ou graduações) só pode ser aplicado em caráter administrativo, mediante decisão colegiada do Comando. Dessa forma, devem coletivamente concordar com essa decisão.
P|§ 3º|O rebaixamento múltiplo por reprovabilidade de conduta é de competência exclusiva do Tribunal de Justiça Policial (TJP), do Conselho Superior de Justiça (CSJ) e da Presidência;
A|Art. 36-A.|O policial rebaixado por quaisquer circunstâncias deverá refazer todos os treinamentos exigidos para o cargo, posto ou graduação correspondente.
I|I -|O disposto no caput não se aplica aos casos de retorno após dispensa autorizados pela legislação.
I|II -|Nos casos de rebaixamento, não será exigido o cumprimento do tempo mínimo de permanência no posto ou graduação para a realização dos treinamentos exigidos.
A|Art. 37.|A demissão é aplicada por, no mínimo, Majores ou Executivos com CGA em seus subordinados sem prévia autorização. Exige-se, no entanto, que o responsável informe a um Comandante sobre a situação para que os Líderes das divisões ou diretorias do policial demitido fiquem cientes do ocorrido.
P|§ 1º|A dispensa é a demissão aplicada ao policial que voluntariamente solicitar o seu desligamento da Polícia através de um pedido explícito a um superior hierárquico.
P|§ 2º|Retirar-se dos grupos e/ou chats referentes ao departamento não se caracteriza-se como dispensa, mas sim como demissão, conforme prevê a TGV35 do Regulamento Disciplinar.
P|§ 3º|Militares do Grupo de Operações Especiais (GOE) têm permissão para demitir subordinados e pares sob supervisão da Coordenação ou Presidência. Quanto à Coordenação e o Comando do GOE, podem aplicar demissões a subordinados, pares e superiores sob a supervisão da Presidência.
A|Art. 38.|O banimento é utilizado em casos singulares, quando a Presidência não mais considera o militar merecedor de permanecer trabalhando no departamento, independente da conta que for utilizada pelo policial.
A|Art. 38-A.|Existem 03 (três) níveis de banimentos distintos determinados dentro da Polícia:
I|I -|Nível I - Leve (30 dias);
I|II -|Nível II - Médio (90 dias);
I|II -|Nível III - Grave (Permanente).
P|Parágrafo único.|Compete exclusivamente à Presidência a análise do nível do banimento a ser recebido pelo militar, conforme previsto no Art. 30, § 3º do Regulamento Disciplinar.
A|Art. 39.|As advertências são automaticamente extintas pelos meios abaixo:
I|I -|Ser rebaixado pelo acúmulo de três (03) advertências;
I|II -|Ser promovido de Coronel a Inspetor (Oficialato Superior ao Corpo de Superiores);
I|III -|Ser promovido de Superintendente a Comandante (Inspetoria ao Comando);
I|IV -|Ser promovido de Comandante-Geral a Supremo (Comando à Presidência);
I|V -|Através do indulto presidencial: o policial que não receber outra advertência escrita será perdoado após quarenta e cinco (45) dias. Caso reincida, o prazo será de sessenta (60) dias.
P|Parágrafo único.|Se o policial receber duas advertências simultaneamente, ambas terão o prazo de sessenta (60) dias para o perdão, contados a partir da data do ato infracional.
A|Art. 40.|As advertências, rebaixamentos e demissões devem acompanhar a norma infringida pelo militar punido, mencionando o documento e o artigo que prevê a situação ocorrida. Exige-se, ainda, que o superior insira todas as evidências possíveis, de modo a fundamentar a sua decisão.
P|Parágrafo único.|O militar que aplicar qualquer punição sem provas suficientes ou justificativa válida receberá a mesma punição que aplicou de forma errônea.
A|Art. 41.|Todas as ações administrativas devem conter em sua descrição os motivos explícitos para a sua aplicação.
P|Parágrafo único.|Ficam isentas desta exigência as ações administrativas de autoria da Presidência.
A|Art. 41-A.|Considera-se válida, para fins de procedimentos internos do departamento, a prova documental que preserve de forma suficiente a integridade da ocorrência, vedadas manipulações, edições, cortes ou supressões capazes de comprometer a correta compreensão dos fatos.
P|§ 1º|As evidências obtidas por meio de desktop, dispositivos móveis, gravações de tela, capturas de imagem, vídeos ou registros similares deverão apresentar contexto mínimo necessário para análise da ocorrência.
P|§ 2º|A utilização de provas com indícios de adulteração, montagem, ocultação de informações relevantes ou perda substancial de contexto poderá ensejar sua nulidade administrativa.
P|§ 3º|O disposto neste artigo aplica-se a denúncias, apurações internas, recursos, fiscalizações e quaisquer procedimentos administrativos conduzidos pelo departamento.
A|Art. 42.|Caso algum policial queira fazer uma denúncia sobre um dos seus pares ou superiores, deverá reunir todas as provas existentes e procurar um Promotor do Tribunal de Justiça Policial.
A|Art. 43.|Se o policial considerar que recebeu alguma punição aplicada inadequadamente, deverá reunir as provas que possui e encaminhá-las a um Defensor do Tribunal de Justiça Policial para recorrer.
P|Parágrafo único.|Uma punição tem um período máximo de 15 dias para ser recorrida. Caso o pedido de recorribilidade extrapole esse prazo, ela não será analisada.
A|Art. 44.|Cabe ao Regulamento Disciplinar listar as transgressões e penas acessórias, bem como definir o procedimento legal de análise, julgamento e conclusão dos casos.
A|Art. 45.|Com exceção da repreensão, os policiais do Tribunal de Justiça Policial e o Grupo de Operações Especiais (GOE) não podem ser punidos por pessoas de fora das divisões de elite, inclusive os Aprendizes em formação.
P|Parágrafo único.|Compete exclusivamente à Presidência a aplicação de punições aos integrantes do Grupo de Operações Especiais (GOE). No que tange ao Tribunal de Justiça Policial (TJP), ficam autorizados a aplicar punições o Comando, o Comando-Geral e a Presidência, sendo obrigatória a comunicação prévia ao líder responsável pela respectiva seção.
H|Título IV · Das divisões e diretorias
A|Art. 46.|Denomina-se divisão ou diretoria os órgãos administrativos setoriais que possuem, como objetivo, atender uma demanda específica da Polícia. Cada divisão é regida pelo seu Regimento Interno e demais documentos oficiais, que regulam o seu funcionamento.
P|Parágrafo único.|Os documentos internos de uma divisão ou diretoria não possuem o poder de interferir nas regras impostas pelos documentos de outras divisões, diretorias e oficiais (Legislação, Regulamento Disciplinar, Emenda dos Cargos Executivos e Regulamento dos Uniformes), nos termos do artigo 2º deste documento.
A|Art. 47.|Cada divisão e diretoria pode ser composta pelas funções internas a seguir:
I|I -|Membro;
I|II -|Fiscal;
I|III -|Auxiliar;
I|IV -|Sub-Líder;
I|V -|Vice-Líder;
I|VI -|Líder;
P|Parágrafo único.|O nome de cada função interna não é idêntico em todas as divisões e diretorias, além da possível ausência de algum nível hierárquico.
A|Art. 48.|As funções externas são utilizadas para representar os militares que não são oficialmente membros da divisão ou diretoria, mas, por algum motivo, ainda possuem um vínculo íntimo com esta, como alunos em processo de formação, banco de reserva ou sistema de aposentadoria/reforma administrativa:
I|I -|Aprendiz;
I|II -|Reservista;
I|III -|Reformado.
P|§ 1º|O nome das funções externas não são idênticas em todas as divisões e diretorias, além da possível ausência de algum nível hierárquico;
P|§ 2º|No caso das funções externas, permite-se que exista mais de uma posição com a mesma equivalência, mas com propósitos diferentes;
A|Art. 49.|Do posto de ingresso nas funções administrativas:
I|I -|Apenas Tenentes/Promotores e superiores podem ocupar a função interna equivalente a Fiscal nas divisões e diretorias;
I|II -|Apenas Tenentes/Promotores e superiores podem ocupar a função interna equivalente a Auxiliar nas divisões e diretorias;
I|III -|Apenas Majores/Administradores e superiores podem ocupar a função interna equivalente a Sub-Líder nas divisões e diretorias;
I|IV -|Apenas Tenentes-Coronéis/Delegados e superiores podem ocupar a função interna equivalente a Vice-Líder nas divisões e diretorias;
I|V -|Apenas Coronéis/Investigadores e superiores podem ocupar a função interna equivalente a Líder nas divisões e diretorias;
P|§ 1º|No Grupo de Operações Especiais, a função de Comandante, equivalente a Líder, somente poderá ser ocupada por militares com cargo igual ou superior a Comandante. A função de Subcomandante, equivalente a Vice-Líder, somente poderá ser ocupada por militares com cargo igual ou superior a Superintendente.
P|§ 2º|O cargo de Presidente do Tribunal de Justiça Policial poderá ser ocupado apenas por Coronéis ou Investigadores com o Curso de Formação de Superiores (CFS) e superiores.
A|Art. 50.|Os policiais estão autorizados a participar de um determinado número de divisões e diretorias, de acordo com o limite de pontos estabelecido para cada grupo hierárquico:
I|I -|Praças: limite de 4 pontos;
I|II -|Oficiais Subalternos: limite de 6 pontos;
I|III -|Oficiais Superiores: limite de 8,5 pontos;
I|IV -|Corpo de Superiores: limite de 5 pontos.
P|§ 1º|Na graduação de Subtenente, exige-se que o policial esteja na divisão dos Guias ou no Batalhão de Movimentações Estratégicas.
P|§ 2º|De Tenente a Coronel, exige-se que o policial esteja na divisão dos Guias ou na Academia Policial.
P|§ 3º|O limite máximo atribuído a um Oficial Superior será de 10 pontos, desde que o policial seja designado para a função de Sub-Líder em duas divisões e diretorias. Nesse caso, é vedada sua participação em qualquer outra divisão ou diretoria.
P|§ 4º|O policial que ultrapassar o limite de pontuação estabelecido para o seu grupo hierárquico possui um prazo de sete (07) dias para se retirar das divisões ou diretorias que preferir até que se enquadre no valor correto. Se até o fim desse período a adequação não for concluída, o militar receberá uma advertência escrita e terá um (01) dia para ajustar a sua pontuação. Por fim, caso ainda não tenha atendido à exigência, o Comando removerá o policial das divisões e diretorias por conta própria, optando sempre por deixá-lo na que possuir a função interna mais elevada.
A|Art. 51.|O limite de pontos será preenchido com a pontuação atribuída às funções internas das divisões e diretorias:
I|I -|Membro: acrescenta 2 pontos;
I|II -|Fiscal: acrescenta 2,5 pontos;
I|III -|Auxiliar: acrescenta 3 pontos;
I|IV -|Sub-Líder: acrescenta 5 pontos.
P|§ 1º|As posições de Líder e Vice-Líder preenchem qualquer limite de pontos. Contudo, aqueles que ocupam essas funções podem participar de uma divisão ou diretoria desde que ocupem, no máximo, função interna equivalente a Sub-Líder.
P|§ 2º|A divisão Equipe de Marketing só passa a entrar na contagem a partir da função de Auxiliar (A.EM).
P|§ 3º|A divisão de Guias só passa a entrar na contagem a partir da função de Auxiliar (A.Lg).
P|§ 4º|A divisão Academia Policial só passa a entrar na contagem a partir da função de Auxiliar (A.Ap).
P|§ 5º|A divisão Batalhão de Movimentações Estratégicas só passa a entrar na contagem a partir da função de Chefe (Ch.BME).
A|Art. 52.|As funções do Grupo de Operações Especiais, do Tribunal de Justiça Policial, da Assessoria Presidencial, da Diretoria de Engenharia, do Centro de Gestão e Finanças, da Diretoria de Comunicações e da Academia Militar de Formação e Elitização não são contabilizadas para o limite de pontos.
P|Parágrafo único.|Para fins de promoção, essas funções equivalem às seguintes posições internas:
I|I -|Militar (GOE), Engenheiro (Diretoria de Engenharia), Assessor Presidencial (APR), Moderador (Diretoria de Comunicações), Tutor (AMFE) e os membros do Tribunal de Justiça Policial equivalem à função de Auxiliar.
I|II -|Coordenador (GOE), Supervisor de Obras (Diretoria de Engenharia), Sub-Diretor (Diretoria de Comunicações) e Coordenador (AMFE) equivalem à função de Sub-Líder.
A|Art. 53.|Caso um policial se ausente ou deixe suas divisões e diretorias sem cumprir um período mínimo de duas semanas de trabalho com metas batidas, receberá uma advertência por escrito.
P|§ 1º|O policial que decidir sair da divisão ou diretoria dentro das primeiras 24 horas não será punido, desde que avise previamente a liderança. Se o policial permanecer por mais de 24 horas na divisão ou diretoria, será necessário cumprir o período mínimo de duas semanas de metas batidas para evitar sanções.
P|§ 2º|O rendimento insatisfatório do policial no cumprimento das atividades atribuídas ao seu posto ou na contribuição com o serviço em base resultará na imediata imposição de sanções disciplinares administrativas, podendo incluir até mesmo a remoção do policial de sua divisão ou diretoria, sem necessidade de aviso prévio.
P|§ 3º|A licença iniciado até quarta-feira da semana vigente, isenta obrigatoriamente o membro de receber qualquer sanção disciplinar;
A|Art. 54.|Todas as divisões e diretorias devem manter um quadro de desempenho interno de todos os seus membros.
A|Art. 55.|O Líder possui autonomia máxima para gerir a divisão ou diretoria e escolher a sua equipe de trabalho, inclusive para decidir os métodos de ingresso, reformular os documentos internos, definir a estrutura e o funcionamento interno e abrir exceções para as próprias regras definidas, desde que suas decisões não entrem em conflito com os limites estabelecidos pelos documentos oficiais.
A|Art. 57.|O departamento é composto por divisões e diretorias, sendo estas responsáveis pela administração de setores específicos para a manutenção e funcionamento de toda a estrutura interna. Todas elas podem ser conhecidas com mais profundidade na cartilha "Conhecendo as Divisões e Diretorias".
P|§ 1º|Das Divisões:
I|I -|Guias (G);
I|II -|Batalhão de Movimentações Estratégicas (BME);
I|III -|Academia Policial (Ap);
I|IV -|Equipe de Marketing (EM);
I|V -|Supervisores (Sp);
I|VI -|Tribunal de Justiça Policial (TJP);
I|VII -|Grupo de Operações Especiais (GOE).
P|§ 2º|Das Diretorias:
I|I -|Academia Militar de Formação e Elitização (AMFE);
I|II -|Centro de Gestão e Finanças (CGF);
I|III -|Diretoria de Engenharia (Eng);
I|IV -|Diretoria de Comunicações (DC);
I|(Incisos seguintes não constam nos prints enviados.)|
P|§ 3º|O Grupo de Operações Especiais é considerado divisão de elite devido às suas exigências e competências especializadas. Além disso, o Tribunal de Justiça Policial se denomina primordialmente como um Órgão Jurídico.
H|Título V · Das normas de perfil
A|Art. 58.|Considera-se perfil o conjunto do fardamento, missão, grupos, emblemas e visibilidade da conta.
P|Parágrafo único.|O único local do quartel que permite a alteração do fardamento é a Sala de Comandos. A troca de roupa no meio de qualquer setor da base é vedada.
H|Título V · Cap. I · Do fardamento
A|Art. 59.|A padronização dos uniformes colabora com a organização do ambiente, impactando diretamente no seu funcionamento. É obrigatório, portanto, que os militares estejam utilizando o fardamento estabelecido para seu cargo, posto ou graduação. A farda da hierarquia militar é composta pelo conjunto de peças a seguir:
I|I -|Boina;
I|II -|Camiseta com bolsos e manga curta (opção masculina) ou camisa sem manga (opção feminina);
I|III -|Calça com bolsos;
I|IV -|Sapato redondo.
P|§ 1º|O Corpo de Superiores e os Cargos Executivos não possuem a obrigatoriedade de utilizar a boina e o brevê.
P|§ 2º|Corpo Executivo Superior e o Comando possuem o visual livre, desde que sigam as normas dispostas no Regulamento dos Uniformes.
A|Art. 60.|A mesclagem entre cores HC e não-HC devem seguir os padrões abaixo:
I|I -|Calça, boina, sapatos, coldre, colete e camiseta HC;
I|II -|Calça, boina, sapatos, coldre, colete e camiseta não-HC;
I|III -|Calça, boina, sapatos, coldre e colete HC, camiseta não-HC;
I|IV -|Calça, boina, sapatos, coldre e colete não-HC, camiseta HC.
P|§ 1º|O acessório "Colete à prova de balas" é exclusivo para uso do Corpo Executivo e do Comando+.
P|§ 2º|O acessório "Coldre" é exclusivo para militares aprovados no Treinamento Tático de Combate Básico (TTCB), oferecido pelo Grupo de Operações Especiais (GOE).
A|Art. 61.|O policial que sair na lista dos Melhores da Semana Hierárquico estará isento do uso da boina durante a semana subsequente.
A|Art. 62.|As demais proibições sobre os visuais são abordadas pelo Regulamento dos Uniformes (RU).
H|Título V · Cap. II · Da missão
A|Art. 63.|A missão do militar é uma das formas de identificá-lo, contendo informações básicas sobre o policial. Define-se o seguinte padrão: “[DIC] Cargo/Posto/Graduação [Último treinamento] [Divisões/Diretorias]”.
P|§ 1º|Quando o militar possuir mais de uma Divisão ou Diretoria, a ordem deverá ser organizada hierarquicamente de acordo com a ocupação interna, do maior para o menor nível de responsabilidade. Assim, o cargo de maior relevância deverá ser apresentado primeiro, seguido pelos demais cargos ocupados.
P|§ 2º|Ordem hierárquica das Divisões/Diretorias:
I|I -|Líder;
I|II -|Vice-Líder;
I|III -|Sub-Líder;
I|IV -|Auxiliar;
I|VI -|Fiscal;
I|VII -|Membro.
P|§ 3º|A utilização do símbolo de marca registrada (®) é opcional e deve ser utilizada obrigatoriamente no fim da missão, bem como o caractere Ð que, conforme a preferência do militar, pode ou não ser colocado na sigla da Polícia (“[ÐIC]”).
A|Art. 64.|Nos casos em que há falta de espaço para colocar todas as divisões ou diretorias e treinamentos, permite-se que o militar utilize a abreviação correspondente ao seu posto:
I|I -|Subtenente, permite-se abreviar para “Sub”;
I|II -|Aspirante, permite-se abreviar para “Asp”;
I|III -|Tenente, permite-se abreviar para “Ten”;
I|IV -|Capitão, permite-se abreviar para “Cap”;
I|V -|Major, permite-se abreviar para “Maj”;
I|VI -|Tenente-Coronel, permite-se abreviar para “T-C” ou “T-Cel”;
I|VII -|Coronel, permite-se abreviar para “Cel”;
I|VIII -|Inspetor, permite-se abreviar para “Insp”;
I|IX -|Superintendente, permite-se abreviar para “Super”.
P|§ 1º|Os cargos, postos ou graduações não mencionados não podem ser abreviados na missão.
P|§ 2º|As abreviações só podem ser utilizadas na missão, conforme a condição estabelecida por este artigo. É vedado, portanto, o emprego desses termos de forma usual no quartel.
A|Art. 65.|A partir do Comando, abre-se margem para escrever a missão de três maneiras diferentes:
I|I -|Seguindo o padrão estabelecido pelo primeiro artigo deste tópico.
I|II -|Seguindo o modelo “xxx da DIC”, conforme o exemplo: “Comandante da DIC”.
I|III -|Seguindo o modelo “xxx da Polícia DIC”, conforme o exemplo: “Comandante da Polícia DIC”.
P|Parágrafo único.|Independente do modelo utilizado, as divisões e diretorias ainda devem ser inseridas na missão, facilitando a identificação das informações do policial.
H|Título V · Cap. III · Dos grupos e emblemas
A|Art. 66.|Estabelece-se, a seguir, a ordem de prioridade do grupo que deve ser selecionado como favorito.
I|I -|Emblema do Grupo de Operações Especiais e Tribunal de Justiça Policial, caso faça parte;
I|II -|Emblema destinado à Assessoria Presidencial;
I|III -|Emblema dos vendedores de Cargos Executivos;
I|IV -|Emblema de liderança, caso ocupe uma posição equivalente a Líder ou Vice-Líder de alguma divisão ou diretoria;
I|V -|Emblema correspondente ao sistema de VIPs, ao sistema de patrocinadores de divisões e diretorias ou à formação no Sistema de Aprendizes do TJP;
I|VI -|Emblema correspondente ao grupo hierárquico.
P|§ 1º|O emblema dos Melhores da Semana pode ser marcado como favorito pelos policiais durante a semana em que saíram nos Melhores da Semana Hierárquico ou Melhores da Semana de Divisões e Diretorias. Válido apenas para os militares que estão na quinta ou sexta prioridade (emblema correspondente aos que receberam o Certificado de Aptidão, aos formados no Sistema de Aprendizes do TJP ou correspondente ao grupo hierárquico, respectivamente).
P|§ 2º|O uso dos emblemas correspondentes às Honrarias Militares é autorizado aos policiais que as detém. Válido apenas para os militares que estão na sexta prioridade (emblema correspondente ao grupo hierárquico);
A|Art. 67.|Proíbe-se a presença, no perfil dos policiais e recrutas, de emblemas que façam referência a qualquer outra organização, polícia ou empresa do ramo policial.
P|Parágrafo único.|O disposto no caput não se aplica a grupos comemorativos, de lembranças, de amigos e/ou de gabinetes, vinculados a organizações e polícias aliadas integrantes da Aliança Revolucionária do Tratado Militar (ARTM). Permanecem proibidos, contudo, os grupos oficiais.
H|Título V · Cap. IV · Da visibilidade da conta
A|Art. 68.|Todos os policiais ativos da Polícia DIC, incluindo os Oficiais Reformados e Aposentados (salvo aposentados que faziam parte da Presidência), devem permanecer com a conta em modo online e com visibilidade do perfil habilitada, conforme instrução feita no Curso Básico Militar.
A|Art. 69.|É estritamente proibido o alistamento, a venda de cargos, a contratação e o acesso de policiais ao quartel para usuários com o perfil no modo offline ou com a visibilidade desativada.
P|§ 1º|Esse requisito não se aplica aos integrantes da Presidência.
P|§ 2º|O descumprimento da norma prevista no caput acarretará punições conforme o cargo, posto ou graduação do militar:
I|I -|Soldado a Subtenente: serão imediatamente demitidos, em consonância com a TGV22 do Regulamento Disciplinar.;
I|II -|Aspirantes, Oficiais e Oficiais Superiores e Superiores: receberão uma advertência de imediato, e um aviso acerca da irregularidade será emitido, em consonância com a TM39 do Regulamento Disciplinar. Caso não haja adequação em até 72 horas, serão demitidos;
I|III -|Cargos Executivos: receberão um aviso acerca da irregularidade e, caso não haja adequação em até 72 horas, serão demitidos em consonância com a TGV23;
I|IV -|Oficiais Reformados: serão orientados acerca da irregularidade e, caso não haja adequação em 48 horas, tornam-se passíveis da perda da reforma e das condecorações;
I|V -|Aposentados: serão orientados acerca da irregularidade e, caso não haja adequação em 48 horas, tornam-se passíveis da perda da aposentadoria.
P|§ 3º|Da comunicação da irregularidade:
I|I -|Os meios disponibilizados pelo Habbo Hotel;
I|II -|Através de chats oficiais no Facebook;
I|III -|Pelo bate-papo privado do policial no Facebook;
I|IV -|Através de chats oficiais no Telegram;
I|V -|Pelo bate-papo privado do policial no Telegram.
H|Título VI · Da ordenação e segmentação dos quartéis
A|Art. 70.|É terminantemente proibido o alistamento, venda de cargos, execução de contratos e realização de transferência de conta a usuários do Habbo com nomes de usuário que:
I|I -|Tenham semelhança ao nick de algum policial ativo, reformado ou aposentado;
I|II -|Contenha apenas símbolos, pontuação ou caracteres repetidos em sequência excessivamente;
I|III -|Contenha comandos utilizados em funções ou setores da Base Principal e Base Auxiliar;
I|IV -|Contenha teor sexual e/ou violento, ainda que de modo implícito;
I|V -|É expressamente proibido o uso de nicknames vulgares ou depreciativos, incluindo, mas não se limitando a, termos que possam causar constrangimento ou desrespeito no ambiente;
I|VI -|Contenham siglas ou façam referência a outras organizações policiais.
A|Art. 71.|Compreende-se como batalhão, quartel ou base os quartos utilizados pela Polícia para estabelecer seus principais serviços. Atualmente, dois quartéis são dispostos para que os policiais possam operar, denominados de batalhão primário/principal (BP) e batalhão auxiliar (BA).
A|Art. 72.|O batalhão é seccionado em setores, onde cada um deles possui um escopo específico:
I|I -|A área externa se refere ao lado de fora da base, caracterizando-se pela movimentação intensa de Recrutas. A permanência de militares ativos nesse ambiente é permitida, contribuindo para o movimento da base desde ficar em pé até conversando via sussurro/fora deste, contanto que moderado. Altos índices de tumultos, baderna e floods não serão tolerados;
I|II -|O pátio diz respeito ao local onde os comandos centrais se encontram e onde os policiais que ainda não foram designados a nenhum setor devem aguardar;
I|III -|A sala de ausências destina-se aos militares que precisam se afastar temporariamente das atividades do batalhão, mas pretendem continuar na base para contribuir com a movimentação estatística e visual do quarto;
I|IV -|A sala VIP possui o mesmo objetivo da sala de ausências, diferenciando-se pela exclusividade concedida aos militares que ocupam uma vaga no Corpo de Superiores ou aqueles que patrocinaram o Sistema VIP da Assessoria Presidencial;
I|V -|A Sala de Comandos (SC) é o local utilizado para promover, punir ou instruir os subordinados, bem como trocar o visual e realizar atividades especiais. Existem duas Salas de Comandos no batalhão: a SC interna e a SC externa;
I|VI -|O corredor é a central de teletransportes do quartel, disponibilizando cabines para ir até o corredor interno, a sala de acessos ou o batalhão oposto;
I|VII -|O assento de aplicação é onde os Guias aguardam o término da pré-aula para iniciar o Curso Básico Militar;
I|VIII -|A Recepção atende os civis que possuem interesse em se alistar, adequando-os aos padrões de perfil. Este setor não exige permissão prévia dos comandos centrais para ser assumido, seja como comandante ou recepcionista;
I|IX -|A Sala de Recrutas, comumente conhecida como Salinha, é o local onde a pré-aula ocorre. Trata-se de uma preparação para que o recruta seja levado ao Curso Básico Militar sabendo sobre o departamento e tendo um uma base de conhecimento mínima;
I|X -|O setor das Alavancas possui o papel de verificar os Soldados, Cabos e Sargentos que estão entrando no quartel;
I|XI -|O Fiscalizador de Recrutas (FR) possui o papel de verificar se os recrutas alistados pela recepção estão de acordo com os requisitos do alistamento;
I|XII -|A Central de Ajuda (CA), desempenha a função primordial de auxiliar os militares que estão com dificuldades ou dúvidas circunstanciais que precisam ser rapidamente resolvidas. Enquanto houver militares designados atuando diretamente nesse setor, eles não poderão ser assumidos por outros militares durante o período em que estiverem exercendo suas funções.
A|Art. 73.|Restringe-se que qualquer policial fique de pé ou caminhando exageradamente pela base.
P|Parágrafo único.|A regra disposta no caput deste artigo não se aplica ao Comando acima e nem ao Grupo de Operações Especiais (GOE) em casos específicos relativos às funções da divisão e diretoria.
A|Art. 74.|As áreas operacionais da base, isto é, que realizam algum tipo de serviço para atender uma demanda ou cumprir uma função específica, possuem postos de trabalho, são eles:
I|I -|Recepção:
J|a)|Recepcionista, responsável por alistar os civis que se aproximam. Essa função pode ser exercida por, no mínimo, Soldados ou Cargos Executivos aprovados no CBM;
J|b)|Comandante, encarregado de gerir e organizar o setor. Essa função pode ser exercida por, no mínimo, Sargentos ou Agentes, sendo o setor prioritário destes.
I|II -|Setor das Alavancas:
J|a)|Alavancas, destinadas a verificar o perfil no jogo e no system dos policiais que estiverem entrando no quartel. Essa função pode ser exercida por, no mínimo, Cabos ou Sócios com CFB1, sendo o setor prioritário desses;
J|b)|Comandante, responsável por gerir e organizar o setor. Essa função pode ser exercida por, no mínimo, Subtenentes ou Analistas com CFA, sendo o setor prioritário destes.
I|III -|Fiscalizador de Recrutas:
J|a)|Fiscalizador de Recrutas (FR), incumbido de efetuar a segunda checagem dos Recrutas alistados pela Recepção. Essa função pode ser exercida por, no mínimo, Cabos ou Sócios com CFB2, sendo o setor prioritário destes;
I|IV -|Sala de Recrutas (Salinha):
J|a)|Instrutor, responsabilizado por aplicar a pré-aula aos recrutas. Essa função pode ser exercida por, no mínimo, Cabos ou Sócios com CFB2, sendo prioridade de Sargentos e Agentes.
I|V -|Central de Ajuda:
J|a)|Atendente, incumbido de sanar as dúvidas e apresentar a solução dos problemas apresentados pelos militares que buscam o setor. Essa função pode ser exercida por, no mínimo, Majores ou Administradores com CGA.
I|VI -|Pátio:
J|a)|Oficial de Base (OB), responsável por gerir e organizar o quartel e o pátio conforme a sua preferência, auxiliando os setores que precisam de apoio e mediando possíveis conflitos. Essa função pode ser exercida por, no mínimo, Aspirantes ou Coordenadores com CFO;
J|b)|Posto de Vigilância (PV), responsável por gerir e organizar os turnos dos militares, além de corrigir o Oficial de Base que realizar seu trabalho incorretamente. Essa função pode ser exercida por, no mínimo, Majores ou Administradores com CGA;
J|c)|Oficial de Comando (OC), responsável por administrar a base e cumprir as funções internas de seu posto, definidas pelo Regimento dos Portadores (documento confidencial).
P|§ 1º|Na ausência do Oficial de Base, a responsabilidade de gerir e organizar o quartel e o pátio é automaticamente atribuída ao Oficial de Comando. Excepcionalmente, caso o Oficial de Comando não esteja presente integralmente ou não haja nenhum portador, o Posto de Vigilância poderá assumir tais atribuições.
P|§ 2º|É expressamente proibido que um posto de trabalho interfira na função de outro. Os únicos que possuem autonomia para exercer esse tipo de ação, quando necessário, são:
I|I -|O Oficial de Comando;
I|II -|Caveiras do Grupo de Operações Especiais nas seguintes situações:
J|a)|Perante aviso prévio;
J|b)|A fim de realizar movimentações estratégicas;
J|c)|Caso o batalhão se encontre em situação crítica.
P|§ 3º|É proibido ao policial, enquanto estiver atuando em qualquer um dos comandos centrais, a realização de outras atividades que não sejam da sua própria função, como promoções, aplicação de testes ou punições que exijam sua presença na Sala de Comandos.
P|§ 4º|É expressamente proibido entrar na fila de qualquer função dos comandos centrais enquanto estiver no turno de Oficial de Base (OB).
P|§ 5º|Alguns setores possuem balões de fala personalizados, definidos pelos cursos hierárquicos.
P|§ 6º|O Oficial de Comando está autorizado a realizar orientações e correções aos policiais presentes no local, incluindo aqueles que sejam seus pares e superiores, desde que a referida conduta esteja em consonância com os documentos oficiais. Destaca-se que, embora incumbido desta responsabilidade, o Oficial de Comando não detém poder disciplinar sobre os seus pares e superiores.
P|§ 7º|Após cinquenta (50) minutos de duração de turno em base, Tenentes/Promotores possuem total prioridade para assumir o posto do Oficial de Base (OB).
A|Art. 75.|Não é exigida autorização prévia para assumir setores da base, sendo permitida a ocupação proativa por iniciativa individual, respeitada a ordem de prioridade de preenchimento estabelecida para cada posto ou graduação.
P|§ 1º|A recepção constitui prioridade absoluta de preenchimento. Enquanto houver vagas disponíveis na recepção, estas deverão ser ocupadas antes da ocupação de quaisquer outros setores.
P|§ 2º|Estando a recepção devidamente preenchida, será permitida a ocupação dos demais setores da base, observada a ordem de prioridade correspondente a graduação ou posto do militar.
P|§ 3º|Para se ausentar de um setor já ocupado, é necessária a autorização prévia do comandante do setor ou da autoridade competente.
P|§ 4º|A migração entre setores da base depende de autorização prévia, exceto quando o setor de destino for a Recepção, o Fiscalizador de Recrutas ou a Sala de Recrutas.
P|§ 5º|A movimentação realizada em desacordo com este artigo será considerada infração disciplinar, sujeita às medidas cabíveis previstas no regulamento disciplinar.
A|Art. 76.|Os policiais que estiverem assumindo qualquer um dos comandos centrais têm a obrigação de sempre darem avisos para os policiais presentes. Tais mensagens são encontradas no documento “Anúncios em base”.
A|Art. 77.|Somente a Presidência pode utilizar cores diferentes no balão de fala, salvo os postos que fazem uso desse recurso.
P|§ 1º|O balão de fala rosa é restrito à Presidência.
P|§ 2º|Permite-se, ainda, a utilização dessa prerrogativa pelo Grupo de Operações Especiais (GOE), no decorrer de suas atividades internas, e pelo Corpo de Superiores, na realização de seus pronunciamentos.
A|Art. 78.|A Aliança Revolucionária do Tratado Militar (ARTM) é composta pelos departamentos RCC, DME e pela organização GOPH.
P|§ 1º|Os membros da aliança possuem acesso à base, conforme as regras a seguir:
I|I -|O Grupo Organizado de Polícia Habbiana (GOPH), ocasionalmente, realiza rondas, as quais buscam estabilizar a Polícia no navegador de quartos. A entrada do grupo é permitida caso o número de funcionários realizando a ação seja igual ou maior a quatro (04);
I|II -|A entrada dos demais departamentos (RCC e DME) é permitida aos seus devidos representantes na aliança. Ademais, para que acessem o batalhão, é obrigatório que estejam com o emblema do tratado como favorito.
P|§ 2º|É vedado aos aliados:
I|I -|Auxiliar nas atividades do batalhão;
I|II -|Permanecer em qualquer local que não seja a sala de ausências;
I|III -|Provocar desorganização e tumulto no quartel.
I|(Demais incisos do § 2º, se houver, não constam nos prints enviados.)|
H|Título VII · Dos comandos
A|Art. 79.|No contexto militar, os comandos representam uma demonstração de respeito e subordinação ao sistema hierárquico. O Departamento de Investigação Criminal dispõe, atualmente, de seis comandos que engrandecem os valores da instituição e do militarismo.
A|Art. 80.|O comando “Sentido”, quando anunciado, induz os militares presentes a darem um passo à frente, permanecendo imóveis e em silêncio. O “Sentido” pode ser utilizado conforme a preferência dos superiores em seus subordinados para instruir, promover, ou aplicar uma ordem. Esse comando acontece de maneira coletiva, geralmente, em três ocasiões:
I|I -|Sempre que um policial equivalente ou superior ao militar de maior posto/cargo que estiver presente no quartel entrar e sentar-se no pátio ou ocupar algum setor, o Oficial de Comando (ou Oficial de Base, na ausência do OC) aplicará o sentido;
P|§ 1°|É obrigatório que o militar sente-se no pátio ou se dirija a um setor para que receba o comando.
P|§ 2°|O treinamento mínimo para que o policial possa ser prestigiado com o comando é o Curso de Formação de Superiores.
P|§ 3°|O sentido é aplicado apenas nos casos em que o policial entrar pelo piso de acesso da área externa ou pelo comando de entrada, utilizado pela Presidência.
P|§ 4°|Nos contextos em que o militar se locomove à Sala de Comandos, ao corredor ou à sala de ausências, o comando é imediatamente cancelado.
P|§ 5°|Para que o mesmo policial receba o comando novamente, se estabelece um tempo mínimo de uma (01) hora fora do batalhão (a presença no lado externo também se configura como estar afastado do quartel). Caso o policial entre em base antes do intervalo ser concluído, a contabilização do tempo é reiniciada.
P|§ 6°|Alunos do Curso de Ações de Comandos e Alunos do COEsp não recebem o Sentido.
P|§ 7°|Quando um militar que estiver sendo prestigiado com o comando perder a conexão, é responsabilidade do aplicador efetuar o cancelamento do comando.
P|§ 8°|O comando pode ser recusado, no entanto, é necessário que o policial sinalize ao Oficial do Comando presente por meio do sussurro.
I|II -|Quando ocorrer um pronunciamento pelo Corpo de Superiores ou pela liderança de alguma divisão ou diretoria;
I|III -|Considerado mandatório pelo Oficial de Comando (ou Oficial de Base) para organizar o batalhão ou transmitir um anúncio relevante;
P|§ 9°|O policial que executar o comando só poderá retornar às atividades após a instrução “À vontade”. É permitido também, caso a conexão caia ou o militar precise sair urgentemente, que ele apenas se retire do quarto ou se desconecte do jogo;
P|§ 10|Dependendo da localização do militar no batalhão, pode acontecer de dar um passo para trás, para o lado ou, até mesmo, não dar nenhum passo para prestar o comando, apenas rotacionando seu corpo para a direção adequada;
P|§ 11|Os policiais que estiverem atendendo um Recruta na Recepção, no Fiscalizador de Recrutas, na Salinha, ou que se encontrem na Sala de Comandos, não precisam executar o comando. (Aplica-se somente aos casos em que o sentido for aplicado de maneira coletiva);
P|§ 12|Os policiais que estiverem isentos de executar o Sentido por se encontrarem na Sala de Comandos, não poderão sair deste setor até que o comando seja findado.
A|Art. 81.|O comando “À vontade” é utilizado para finalizar o sentido. Ao ler essa determinação, o policial deverá proclamar o lema (“AVANTE, DIC!”) e, somente após isso, retornar à posição original.
A|Art. 82.|O comando “Continência” é utilizado para demonstrar respeito durante ocasiões especiais, como para homenagear um policial. Assim que for transmitido, todos, com exceção do militar prestigiado, devem acenar uma única vez.
A|Art. 83.|O comando “Apresentar armas” é uma ordem de natureza punitiva, utilizada em casos de infrações leves. O militar punido que receber essa instrução deverá acenar durante o período definido pelo aplicador.
A|Art. 84.|O comando “Descansar” é a instrução utilizada para interromper o “Apresentar armas”.
A|Art. 85.|O “Apresente-se” trata-se de um comando utilizado para formalidades de procedimentos sérios.
P|Parágrafo único:|Para a execução do comando “Apresente-se”, superior e subordinado devem estar na Sala de Comandos, com o superior no tapete cinza e o subordinado no tapete vermelho. O superior deve dar um passo à frente e ordenar o comando “Apresente-se!”, o subordinado dá um passo à frente, presta continência e declara “Sua Graduação/Posto/Cargo + Seu Nick apresentando-se, senhor(a)!”. Ao final, o superior diz “Dispensado!” e ambos retornam à posição inicial.
H|Título VIII · Arts. 87 a 89
A||(O cabeçalho do Título VIII e o Art. 86 não constam nos prints enviados.)
A|Art. 87.|A remuneração é garantida aos militares que comparecerem na data e no horário previamente marcados, exceto quando:
P|Parágrafo único:|A cada advertência registrada no mês vigente, haverá redução de 25% sobre o valor total do pagamento a ser recebido (salário base e distintivos no referido mês).
A|Art. 88.|Chama-se de DICoin a moeda oficial da Polícia, utilizada para comprar os itens disponibilizados no system, os quais são alterados periodicamente. Funcionam como uma forma de pagamento adicional, a fim de valorizar os militares mais esforçados.
A|Art. 89.|Os distintivos constituem forma complementar de remuneração, concedida aos policiais que ocuparem funções dentro das divisões ou que forem agraciados por seus superiores na execução de atividades operacionais no Departamento.
